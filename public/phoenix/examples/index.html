            <button type="button" data-sl-phoenix data-sl-phoenix-preset="light" data-sl-phoenix-sound="0">Смотреть без звука</button>
        </p>
        <p><a href="nested/page.html">Другой пример страницы</a> · <a href="../index.html">Отдельная презентация</a></p>
