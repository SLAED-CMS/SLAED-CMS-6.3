{% if add_for %}
<button type="button" data-sl-repeat-add="{{ add_for }}" title="{{ add_label }}" aria-label="{{ add_label }}" hidden><i class="bi bi-plus-circle-fill" aria-hidden="true"></i></button>
{% else %}
<div data-sl-repeat{% if group_id %} id="{{ group_id }}"{% endif %}>
  {% for row in rows %}
  <div data-sl-repeat-row{% if row.is_empty %} data-sl-repeat-empty{% endif %}>
    {{{ row.content_html }}}
  </div>
  {% endfor %}
  {% if add_label %}
  <button type="button" class="sl-but" data-sl-repeat-add hidden><i class="bi bi-plus-lg" aria-hidden="true"></i> {{ add_label }}</button>
  {% endif %}
</div>
{% endif %}
