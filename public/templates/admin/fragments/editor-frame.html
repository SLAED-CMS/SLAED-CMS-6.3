<div class="sl-editor" data-sl-editor data-sl-editor-name="{{ tab_text }}" data-sl-editor-lang="{{ lang_key }}"{% if files_json %} data-sl-editor-files="{{ files_json }}"{% endif %}{% if vars_json %} data-sl-editor-vars="{{ vars_json }}"{% endif %}{% if is_lint %} data-sl-editor-lint{% endif %}{% if room_num %} data-sl-editor-room="{{ room_num }}"{% endif %}{% if is_code %} data-sl-editor-code{% endif %}{% if core_url %} data-sl-editor-core="{{ core_url }}"{% endif %}{% if grammar_url %} data-sl-editor-grammar="{{ grammar_url }}"{% endif %}>
  <div class="sl-editor-row" data-sl-editor-row><span class="sl-editor-tab"><i class="bi bi-{{ icon_name }}" aria-hidden="true"></i><span title="{{ tab_text }}">{{ tab_text }}</span></span></div>
  <div class="sl-editor-card" data-sl-editor-card>
    <textarea class="sl-editor-text{% if is_code %} sl-editor-code{% endif %}" data-sl-editor-area{% if name_attr %} name="{{ name_attr }}"{% endif %}{% if input_id %} id="{{ input_id }}"{% endif %}{% if rows_num %} rows="{{ rows_num }}"{% endif %}{% if is_code %} spellcheck="false"{% endif %}{% if placeholder_text %} placeholder="{{ placeholder_text }}"{% endif %}{% if is_required %} required{% endif %}{% if labelledby %} aria-labelledby="{{ labelledby }}"{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}{% if describedby %} aria-describedby="{{ describedby }}"{% endif %}>{{ value_text }}</textarea>
    <div class="sl-editor-status" data-sl-editor-status><span data-sl-editor-pos></span><span data-sl-editor-size></span><span class="sl-editor-left" data-sl-editor-left></span><span data-sl-editor-used></span><button type="button" class="sl-editor-dirty" data-sl-editor-act="diff" aria-haspopup="dialog" title="{{ diff_text }}">{{ dirty_text }}</button><span class="sl-editor-note" data-sl-editor-note aria-live="polite"></span>{% if is_lint %}<button type="button" class="sl-editor-lint" data-sl-editor-act="lint" aria-expanded="false" title="{{ lint_text }} (Ctrl+Shift+M)"><i class="bi bi-check-circle" data-sl-editor-tone="ok" aria-hidden="true"></i><i class="bi bi-exclamation-triangle" data-sl-editor-tone="warn" aria-hidden="true" hidden></i><i class="bi bi-x-octagon" data-sl-editor-tone="error" aria-hidden="true" hidden></i><span data-sl-editor-lint-text>{{ lint_text }}</span></button>{% endif %}{% if lang_text %}<span class="sl-editor-lang">{{ lang_text }}</span>{% endif %}</div>
  </div>
</div>
