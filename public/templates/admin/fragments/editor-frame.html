<div class="sl-editor" data-sl-editor data-sl-editor-name="{{ tab_text }}"{% if is_code %} data-sl-editor-code{% endif %}{% if core_url %} data-sl-editor-core="{{ core_url }}"{% endif %}{% if grammar_url %} data-sl-editor-grammar="{{ grammar_url }}"{% endif %}>
  <div class="sl-editor-row" data-sl-editor-row><span class="sl-editor-tab"><i class="bi bi-{{ icon_name }}" aria-hidden="true"></i><span title="{{ tab_text }}">{{ tab_text }}</span></span></div>
  <div class="sl-editor-card" data-sl-editor-card>
    <textarea class="sl-editor-text{% if is_code %} sl-editor-code{% endif %}" data-sl-editor-area{% if name_attr %} name="{{ name_attr }}"{% endif %}{% if input_id %} id="{{ input_id }}"{% endif %}{% if rows_num %} rows="{{ rows_num }}"{% endif %}{% if is_code %} spellcheck="false"{% endif %}{% if placeholder_text %} placeholder="{{ placeholder_text }}"{% endif %}{% if is_required %} required{% endif %}{% if labelledby %} aria-labelledby="{{ labelledby }}"{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}{% if describedby %} aria-describedby="{{ describedby }}"{% endif %}>{{ value_text }}</textarea>
    <div class="sl-editor-status"><span data-sl-editor-pos></span><span data-sl-editor-size></span><span class="sl-editor-dirty">{{ dirty_text }}</span><span class="sl-editor-note" data-sl-editor-note aria-live="polite"></span>{% if lang_text %}<span class="sl-editor-lang">{{ lang_text }}</span>{% endif %}</div>
  </div>
</div>
