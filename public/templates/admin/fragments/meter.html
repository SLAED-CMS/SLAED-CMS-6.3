<div class="sl-meter{% if is_row %} sl-meter-row{% endif %}"><div class="sl-meter-head">{% if is_row %}{% else %}<span>{{ label }}</span>{% endif %}<b>{{ value }}</b></div><span class="sl-meter-bar sl-knob-{{ tone }}" role="meter" aria-label="{{ label }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}"><i style="--sl-d-part: {{ pct }}%"></i></span>{% if note %}<span class="sl-meter-note">{{ note }}</span>{% endif %}</div>
