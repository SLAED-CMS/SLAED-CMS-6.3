<li class="sl-bell-item"><span class="sl-float sl-bell-float" data-sl-float-align="end"><button type="button" class="sl-bell" data-sl-bell="{{ url }}" data-sl-bell-label="{{ _ADM_BELL }}" aria-label="{{ _ADM_BELL }}: {{ sum }}"><span class="sl-bell-ic"><i class="bi bi-bell" aria-hidden="true"></i><span class="sl-bell-n" data-sl-bell-sum{% if not sum %} hidden{% endif %}>{{ sum }}</span></span></button><span class="sl-float-panel sl-bell-tip" role="group" aria-labelledby="sl-bell-cap"><span class="sl-bell-cap" id="sl-bell-cap">{{ _ADM_WAIT }}</span>{% for row in rows %}<a href="{{ row.href }}" title="{{ row.title }}" data-sl-queue-row="{{ row.key }}" data-sl-queue-mod="{{ row.mod }}"{% if not row.num %} hidden{% endif %}><i class="bi bi-{{ row.icon }}" aria-hidden="true"></i> {{ row.label }} <span class="sl-bell-num" data-sl-queue-n>{{ row.num }}</span></a>{% endfor %}<span class="sl-muted" data-sl-bell-none{% if sum %} hidden{% endif %}>{{ _NO_INFO }}</span></span></span></li>
