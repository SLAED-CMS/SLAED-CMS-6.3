<div class="sl-toast-host" aria-live="polite" data-sl-did-del="{{ _ADM_GONE }}" data-sl-did-on="{{ _ADM_TURNON }}" data-sl-did-off="{{ _ADM_TURNOFF }}" data-sl-did-fail="{{ _ERROR }}" data-sl-turn-on="{{ _ACTIVATE }}" data-sl-turn-off="{{ _DEACTIVATE }}" data-sl-led-on="{{ _ACT }}" data-sl-led-off="{{ _DEACT }}">
  <template data-sl-toast><div class="sl-alert sl-alert-success sl-alert-flash sl-toast"><div class="sl-alert-flash-bar"><svg aria-hidden="true" focusable="false"><circle cx="50%" cy="50%" r="50%" pathLength="100"></circle></svg></div><div class="sl-alert-body"><span data-sl-toast-text></span><button type="button" class="sl-but" data-sl-undo hidden>{{ undo_text }}</button><button type="button" class="sl-but-mini" data-sl-toast-close title="{{ close_text }}" aria-label="{{ close_text }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div></div></template>
</div>
