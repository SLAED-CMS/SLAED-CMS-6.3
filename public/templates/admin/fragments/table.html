{% if is_wrapless %}
{% else %}
<div class="sl-box sl-table-shell">
{% endif %}
<table
  class="sl-table-list-sort{% if is_fixed %} sl-table-fixed{% endif %}"
  {% if attr %}{{{ attr }}}{% endif %}
  {% if disable_sort %}{% else %}data-sl-table-sort{% endif %}
  {% if density %}data-sl-density="{{ density }}"{% endif %}
  {% if sort_key %}data-sl-sort-keep="{{ sort_key }}" data-sl-sort-said="{{ _SORT }}" data-sl-sort-asc="{{ _ASC }}" data-sl-sort-desc="{{ _DESC }}"{% endif %}
>
<thead>
  <tr>
    {% if head %}
    {% for col in head %}{% include 'fragments/th.html' with col %}{% endfor %}
    {% else %}
    {{{ head_html }}}
    {% endif %}
  </tr>
</thead>
<tbody>{{{ rows_html }}}</tbody>
</table>
{% if is_wrapless %}
{% else %}
</div>
{% endif %}
