<div class="sl-metrics">{% for item in items %}<div class="sl-metric{% if item.tone %} sl-metric-{{ item.tone }}{% endif %}{% if item.is_good %} sl-metric-good{% endif %}"><span class="sl-metric-name">{% if item.tone %}<i class="sl-metric-dot" aria-hidden="true"></i>{% endif %}{{ item.label }}</span><b class="sl-metric-value">{{ item.value }}{% if item.unit %} <small>{{ item.unit }}</small>{% endif %}</b>{% if item.note %}<small>{{ item.note }}</small>{% endif %}{% if item.icon %}<i class="bi bi-{{ item.icon }} sl-metric-icon" aria-hidden="true"></i>{% endif %}</div>{% endfor %}</div>
