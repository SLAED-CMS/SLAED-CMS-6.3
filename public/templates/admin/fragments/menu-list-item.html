<div class="sl-menu-list-item{% if is_off %} sl-dimmed{% endif %}"{% if key %} data-sl-menu-item="{{ key }}"{% endif %}{% if is_drag %} data-sl-drag-id="{{ key }}"{% endif %}>
  {% if is_drag %}<span class="sl-drag-handle" aria-hidden="true"></span>{% endif %}<a href="{{ link.href }}" title="{{ link.title }}"{% if link.is_current %} aria-current="page"{% endif %}><i class="bi bi-{{ link.icon_name }}" aria-hidden="true"></i> <span class="sl-menu-name">{{ link.label }}</span>{% if queue_key %} <span class="sl-queue" data-sl-queue="{{ queue_key }}"{% if not queue_num %} hidden{% endif %}><span data-sl-queue-n>{{ queue_num }}</span><span class="sl-visually-hidden"> {{ _WAITINGCONT }}</span></span>{% endif %}</a>
  {% include 'fragments/dial.html' %}
</div>
