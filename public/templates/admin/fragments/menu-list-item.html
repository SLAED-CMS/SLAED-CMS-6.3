<div class="sl-menu-list-item{% if is_off %} sl-dimmed{% endif %}"{% if key %} data-sl-menu-item="{{ key }}"{% endif %}>
  <a href="{{ link.href }}" title="{{ link.title }}"{% if link.is_current %} aria-current="page"{% endif %}><i class="bi bi-{{ link.icon_name }}" aria-hidden="true"></i> {{ link.label }}{% if queue_key %} <span class="sl-queue" data-sl-queue="{{ queue_key }}"{% if not queue_num %} hidden{% endif %}><span data-sl-queue-n>{{ queue_num }}</span><span class="sl-visually-hidden"> {{ _WAITINGCONT }}</span></span>{% endif %}</a>
  {% include 'fragments/dial.html' %}
</div>
