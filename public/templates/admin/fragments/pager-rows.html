{% if rows %}<span> · <span class="sl-float sl-pager-rows"{% if rows.is_up %} data-sl-float-up{% endif %} data-sl-rows="{{ rows.pick }}" data-sl-rows-base="{{ rows.base }}" data-sl-rows-limit="{{ rows.limit }}" data-sl-rows-page="{{ rows.page }}" data-sl-rows-href="{{ rows.href }}" data-sl-rows-new="{{ rows.say_new }}" data-sl-rows-all="{{ rows.say_all }}" data-sl-rows-def="{{ rows.say_def }}"><button type="button" class="sl-pager-rows-btn" aria-describedby="{{ rows.id }}-head">{{ rows.said }} <b>{{ rows.shown }}</b><i class="bi bi-chevron-down" aria-hidden="true"></i></button><span class="sl-float-panel sl-pager-tip" role="group" aria-labelledby="{{ rows.id }}-head"><span class="sl-pager-tip-head" id="{{ rows.id }}-head">{{ _ADM_ROWS }}</span><span class="sl-pager-rows-list">{% for item in rows.ladder %}<button type="button" class="sl-pager-rows-item{% if item.is_now %} sl-is-active{% endif %}" data-sl-rows-set="{{ item.value }}" aria-pressed="{% if item.is_now %}true{% else %}false{% endif %}"{% if item.is_home %} data-sl-rows-home{% endif %}{% if item.is_same %} data-sl-rows-same{% endif %}{% if item.is_off %} disabled{% endif %}><span class="sl-pager-rows-key">{{ item.key }}</span><span class="sl-pager-rows-text">{{ item.text }}</span><span class="sl-pager-rows-hint">{{ item.hint }}</span></button>{% endfor %}<span class="sl-pager-rows-item sl-pager-rows-own{% if rows.own %} sl-is-active{% endif %}"><input type="number" class="sl-pager-rows-key" id="{{ rows.id }}-own" min="5" max="{{ rows.max }}" step="1" placeholder="…" value="{{ rows.own }}" title="{{ rows.tip }}" aria-describedby="{{ rows.id }}-span" data-sl-rows-own><label class="sl-pager-rows-text" for="{{ rows.id }}-own">{{ _ADM_ROWSOWN }}</label><span class="sl-pager-rows-end"><span class="sl-pager-rows-hint" id="{{ rows.id }}-span">{{ rows.span }}</span><button type="button" class="sl-pager-rows-go" title="{{ _OK }}" aria-label="{{ _OK }}" data-sl-rows-go><i class="bi bi-check-lg" aria-hidden="true"></i></button></span></span><span class="sl-pager-rows-sep" aria-hidden="true"></span><button type="button" class="sl-pager-rows-item" data-sl-rows-set=""{% if rows.is_free %} disabled{% endif %}><span class="sl-pager-rows-key"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></span><span class="sl-pager-rows-text">{{ rows.back }}</span></button></span><span class="sl-pager-tip-note"><span class="sl-pager-rows-mark" aria-hidden="true"></span>{{ rows.note }}</span></span></span></span>{% else %}<span class="sl-pager-range"> · {{ range_text }}</span>{% endif %}
