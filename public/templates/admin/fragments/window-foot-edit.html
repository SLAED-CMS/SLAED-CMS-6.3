<span class="sl-modal-info" aria-live="polite"><span class="sl-chip sl-chip-neutral" title="{{ ver_hint }}">{{ ver_label }} {{ ver_text }}</span></span>
<a class="sl-modal-btn" href="{{ back_url }}"><i class="bi bi-arrow-left" aria-hidden="true"></i>{{ back_text }}</a>
<button type="submit" class="sl-modal-btn sl-modal-btn-main" form="{{ form_id }}"{% if confirm_text %} data-sl-confirm="{{ confirm_text }}"{% endif %}><i class="bi bi-save" aria-hidden="true"></i>{{ save_text }}</button>
