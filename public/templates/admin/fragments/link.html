<a
  href="{% if href %}{{ href }}{% else %}#{% endif %}"
  title="{{ title }}"

  {% if class or rel or is_account_button or is_num_anchor or is_button_blue or is_footer_button or is_votes or is_comments or is_top_hidden or isdebug or isslaed or is_mini %}
  class="
    {{ class }}
    {% if is_mini %} sl-dial-item sl-but-mini{% endif %}
    {% if rel %} sl-tabs-link{% endif %}
    {% if rel and is_active %} sl-is-active{% endif %}
    {% if is_account_button %} sl-but{% endif %}
    {% if is_num_anchor %} sl-pnum{% endif %}
    {% if is_button_blue %} sl-but-blue{% endif %}
    {% if is_footer_button %} sl-but-foot{% endif %}
    {% if is_votes %} sl-votes{% endif %}
    {% if is_comments %} sl-coms{% endif %}
    {% if is_top_hidden %} sl-thide{% endif %}
    {% if isdebug %} sl-debugger-toggle{% endif %}
    {% if isslaed %} sl-slaed-home{% endif %}
  "
  {% endif %}

  {% if rel %}
    data-sl-tab-target="{{ rel }}"
    data-sl-tab-link
  {% endif %}
  {% if isdebug %}
    data-sl-toggle-control="sl_debugger"
    data-sl-toggle-effect="slide"
    data-sl-toggle-duration="500"
  {% endif %}

  {% if link_attr %}{{{ link_attr }}}{% endif %}
  {% if confirm_text %}data-sl-confirm="{{ confirm_text }}"{% endif %}
  {% if onclick_attr %}{{{ onclick_attr }}}{% endif %}

  {% if is_htmx or is_post %}
    {% if is_post %}hx-post="{{ href }}"{% else %}hx-get="{{ href }}"{% endif %}
    hx-target="{{ hx_target }}"
    hx-swap="{% if hx_swap %}{{ hx_swap }}{% else %}innerHTML{% endif %}"
    hx-push-url="false"
    {% if hx_include %}hx-include="{{ hx_include }}"{% endif %}
  {% endif %}

  {% if is_blank %}
    target="_blank"
    rel="noopener noreferrer"
  {% endif %}
>
  {% if img_src %}
    <img
      src="{{ img_src }}"
      alt="{{ img_alt }}"
      title="{{ title }}"
    >
  {% endif %}
  {% if icon_name %}<i class="bi bi-{{ icon_name }}"></i>{% endif %}
  {% if label_html %}{{{ label_html }}}{% endif %}
  {% if is_label_strong %}
    <b>{{ label }}</b>
  {% elseif label %}
    {{ label }}
  {% endif %}
</a>{% if suffix_html %} {{{ suffix_html }}}{% endif %}
