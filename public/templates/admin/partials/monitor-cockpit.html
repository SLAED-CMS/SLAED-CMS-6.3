{% if is_page %}<div data-sl-monitor="{{ url }}" data-sl-monitor-every="{{ every }}" data-sl-monitor-view="{{ view }}">{{{ content_html }}}</div>{% endif %}
{% if is_lamp %}<span class="sl-float sl-cockpit-float"><button type="button" class="sl-cockpit-plate" aria-label="{{ state_text }}" data-sl-pulse><span class="sl-cockpit-glass" aria-hidden="true"></span><span class="sl-cockpit-head sl-cockpit-rate" aria-hidden="true"><i class="bi bi-heart-pulse-fill"></i><b data-sl-pulse-num>&mdash;</b><small>{{ rate_text }}</small></span><span class="sl-cockpit-trace" aria-hidden="true"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path data-sl-pulse-trace d="M0 24H400"></path></svg></span><span class="sl-cockpit-mood" aria-hidden="true" data-sl-pulse-mood></span></button><span class="sl-float-panel sl-bell-tip" role="group" aria-labelledby="sl-cockpit-tip-cap"><span class="sl-bell-cap" id="sl-cockpit-tip-cap" data-sl-signals-cap></span><span data-sl-signals></span></span></span>{% endif %}
