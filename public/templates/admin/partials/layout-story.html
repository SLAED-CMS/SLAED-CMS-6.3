{# The history of the site builder: the last publications, the newest first, each with its author, its counts and the way back into the draft #}
{% if rows %}<ul class="sl-lay-links">{% for item in rows %}<li><div class="sl-lay-link"><i class="bi bi-{% if item.is_live %}cloud-check{% else %}clock-history{% endif %}" aria-hidden="true"></i><span class="sl-lay-link-name">{{ item.when }}</span><span class="sl-lay-link-text">{{ item.text }}</span><button type="button" class="sl-but" data-sl-lay-act="story-back" data-sl-lay-id="{{ item.num }}"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>{{ back_text }}</button></div></li>{% endfor %}</ul>{% else %}<p class="sl-list-none">{{ none_text }}</p>{% endif %}
