{% if is_page %}<div data-sl-stat="{{ url }}" data-sl-stat-key="{{ month }}" data-sl-stat-every="{{ every }}"{% if is_run %} data-sl-stat-live{% endif %} data-sl-stat-view="{{ view }}">{{{ content_html }}}</div>{% endif %}
{% if is_state %}<span class="sl-cockpit-state" role="status"><span class="sl-float sl-pace" tabindex="0" data-sl-stat-pace{% if not is_now %} hidden{% endif %}><span data-sl-stat-pace-text></span><span class="sl-float-panel sl-bell-tip" role="group"><span class="sl-bell-cap">{{ pace_cap }}</span><span data-sl-stat-pace-rows></span><a><i class="bi bi-clock" aria-hidden="true"></i> <span data-sl-stat-run></span></a></span></span><span data-sl-stat-run data-sl-stat-off{% if is_now %} hidden{% endif %}></span></span>{% endif %}
{% if is_nav %}<div class="sl-cockpit-nav">
  <span class="sl-cockpit-day"><span class="sl-cockpit-set" role="group" aria-label="{{ set_text }}" data-sl-stat-if="run"><button type="button" data-sl-stat-now="1">{{ now_text }}</button><button type="button" data-sl-stat-now="0">{{ past_text }}</button></span><span data-sl-stat-if="arc" hidden>{{ last_text }}</span><span data-sl-stat-if="day" hidden><span data-sl-stat-date></span><button type="button" class="sl-cockpit-clear" data-sl-stat-clear title="{{ clear_text }}" aria-label="{{ clear_text }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span></span>
  <a class="sl-cockpit-step"{% if prev_url %} href="{{ prev_url }}"{% else %} role="link" aria-disabled="true"{% endif %} title="{{ prev_text }}" aria-label="{{ prev_text }}"><i class="bi bi-chevron-left" aria-hidden="true"></i></a>
  <a class="sl-cockpit-step"{% if next_url %} href="{{ next_url }}"{% else %} role="link" aria-disabled="true"{% endif %} title="{{ next_text }}" aria-label="{{ next_text }}"><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
  {{{ live_html }}}
</div>{% endif %}
{% if is_lamp %}<div class="sl-cockpit-float"><div class="sl-cockpit-plate sl-cockpit-dial"><span class="sl-cockpit-glass" aria-hidden="true"></span>{{{ clock_html }}}</div></div>{% endif %}
