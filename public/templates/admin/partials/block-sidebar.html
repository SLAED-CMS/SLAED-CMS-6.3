<div class="sl-block-sidebar{% if is_find %} sl-block-menu{% endif %}{% if is_queue %} sl-block-queue{% endif %}"{% if is_find %} data-sl-find-group{% endif %}>
  <h3><button type="button" class="sl-menu-head" title="{{ close }}" data-sl-toggle-control="sl-block-{{ id }}" data-sl-toggle-effect="slide" data-sl-toggle-duration="500"><b>{% if icon_name %}<i class="bi bi-{{ icon_name }}" aria-hidden="true"></i>{% endif %}<span class="sl-menu-name">{{ title }}</span></b><i class="bi bi-arrows-collapse sl-panel-toggle sl-panel-toggle-open" aria-hidden="true"></i><i class="bi bi-arrows-expand sl-panel-toggle sl-panel-toggle-closed" aria-hidden="true"></i></button></h3>
  <div
    id="sl-block-{{ id }}"
    class="sl-block-sidebar-content"

    data-sl-toggle="sl-block-{{ id }}"{% if is_drag %} data-sl-drag-event="sl:menu-order"{% endif %}
  >{% if content_id %}<div id="{{ content_id }}">{% endif %}{{{ content_html }}}{% if content_id %}</div>{% endif %}</div>
  <div class="sl-block-sidebar-bottom"></div>
</div>
