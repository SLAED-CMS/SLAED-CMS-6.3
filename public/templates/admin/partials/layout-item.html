{# The caption of one item of a list in the site builder: its words, then its moves and its deletion, which post through the screen #}
<span class="sl-lay-item-cap">{{ label }}</span>
<span class="sl-lay-item-acts"><button type="button" class="sl-but-mini sl-is-muted" data-sl-lay-act="item-up" data-sl-lay-arg="{{ num }}" title="{{ up_text }}" aria-label="{{ up_text }}"{% if is_first %} disabled{% endif %}><i class="bi bi-arrow-up" aria-hidden="true"></i></button><button type="button" class="sl-but-mini sl-is-muted" data-sl-lay-act="item-down" data-sl-lay-arg="{{ num }}" title="{{ down_text }}" aria-label="{{ down_text }}"{% if is_last %} disabled{% endif %}><i class="bi bi-arrow-down" aria-hidden="true"></i></button><button type="button" class="sl-but-mini sl-is-muted" data-sl-lay-act="item-del" data-sl-lay-arg="{{ num }}" title="{{ del_text }}" aria-label="{{ del_text }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
