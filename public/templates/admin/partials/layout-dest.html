{# The pages a section of the site builder may be copied to, each a row that copies it to the end of that page #}
<div class="sl-modal-title"><i class="bi bi-files" aria-hidden="true"></i> <span class="sl-modal-cap"><strong>{{ title_text }}</strong><span class="sl-modal-sub">{{ sub_text }}</span></span> <span class="sl-modal-acts"><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ close_text }}" aria-label="{{ close_text }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span></div>
<div class="sl-modal-body">{% if rows %}<ul class="sl-editor-issues sl-lay-issues">{% for item in rows %}<li data-sl-editor-tone="info"><button type="button" class="sl-editor-issue" data-sl-lay-act="sec-copy" data-sl-lay-id="{{ sid }}" data-sl-lay-arg="{{ item.key }}"><i class="bi bi-file-earmark-richtext" aria-hidden="true"></i><span>{{ item.title }}</span><small>{{ item.where }}</small><i class="bi bi-chevron-right" aria-hidden="true"></i></button></li>{% endfor %}</ul>{% else %}<p class="sl-list-none">{{ none_text }}</p>{% endif %}</div>
