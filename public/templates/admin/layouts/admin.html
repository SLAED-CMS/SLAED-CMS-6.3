<!doctype html>
<html lang="{{ lang }}" data-theme="{{ mode }}">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
{{{ meta }}}
{{{ links }}}
{{{ scripts }}}
</head>
<body>
  <div class="sl-wrapper sl-admin-shell">
    <div class="sl-wraptop"></div>
    <div class="sl-wrapmid">
      <div class="sl-header sl-admin-header">
        <div class="sl-admin-brand"><h1><a href="//slaed.net" target="_blank" title="{{ adtitle }}"><img src="{{ adlogo }}" alt="{{ adalt }}" title="{{ adtitle }}"></a></h1></div>
        <div class="sl-admin-toolbar">
          <div class="sl-toolbar">
            <div>
              <ul class="sl-reset">{{{ menu }}}<li class="sl-set-item"><button type="button" data-sl-open="sl-settings" title="{{ _FUNCTIONS }}"><i class="bi bi-sliders" aria-hidden="true"></i> <b>{{ _FUNCTIONS }}</b></button></li></ul>
            </div>
          </div>
        </div>
      </div>
      <div class="sl-admin-main">
        <aside class="sl-admin-sidebar">{{{ admin_blocks }}}</aside>
        <main class="sl-admin-content"><div class="sl-admin-content-inner">{% block content %}{% endblock %}</div></main>
      </div>
      <div class="sl-footer sl-admin-footer">
        <div class="sl-copyright">{% if time_html %}{{{ time_html }}}<br>{% endif %}{{{ license }}}</div>
        <span>{{{ foot_html }}}</span>
      </div>
    </div>
    <div class="sl-wrapfoot"></div>
    {{{ windows_html }}}
    {{{ settings_win }}}
    {% if debug_html %}
    <div id="sl_debugger" data-sl-toggle="sl_debugger" data-sl-toggle-default="open">
    {{{ debug_html }}}
    </div>
    {% endif %}
  </div>
</body>
</html>
