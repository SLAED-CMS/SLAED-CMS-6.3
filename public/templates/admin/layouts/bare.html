<!doctype html>
<html lang="{{ lang }}" data-theme="{{ mode }}"{% if is_still %} data-sl-still{% endif %}>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if is_bare %}<title>{% if title %}{{ title }}{% else %}{{ sitename }}{% endif %}</title>{% endif %}
{{{ meta }}}
{{{ links }}}
{{{ scripts }}}
</head>
<body{% if is_bare %} class="sl-admin-shell"{% endif %}>
  {% if not is_bare %}
  <div class="sl-admin-shell sl-admin-login-shell">
    <div class="sl-admin-login-top"></div>
    <div class="sl-admin-login-card" data-sl-pointer-at>
      <header class="sl-admin-login-header">
        <div class="sl-admin-brand"><h1><a href="//slaed.net" target="_blank" title="{{ adtitle }}"><img src="{{ adlogo }}" alt="{{ adalt }}" title="{{ adtitle }}"></a></h1></div>
      </header>
      <main class="sl-admin-login-content">
  {% endif %}
  {% block content %}{% endblock %}
  {% if not is_bare %}
      </main>
      <footer class="sl-admin-login-footer"><div class="sl-admin-login-copyright">{{{ license }}}</div></footer>
    </div>
    <div class="sl-admin-login-bottom"></div>
  </div>
  {% endif %}
</body>
</html>
