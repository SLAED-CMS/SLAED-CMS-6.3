<div class="sl-changelog-commit-stats"><strong>{{ changes_label }}:</strong> <span class="sl-changelog-add">+{{ added }}</span> / <span class="sl-changelog-del">-{{ deleted }}</span> | <strong>{{ count }} {{ files_label }}</strong></div>
{% if files %}
<div class="sl-changelog-commit-files">
  {% for file in files %}
  <div><span class="sl-changelog-add">+{{ file.added }}</span> <span class="sl-changelog-del">-{{ file.deleted }}</span> {{ file.file }}</div>
  {% endfor %}
</div>
{% endif %}
