{% if is_break %}
<br>
{% elseif is_strong_em %}
<strong><em>{{{ content_html }}}</em></strong>
{% elseif is_strong %}
<strong>{{{ content_html }}}</strong>
{% elseif is_em %}
<em>{{{ content_html }}}</em>
{% elseif is_del %}
<del>{{{ content_html }}}</del>
{% elseif is_mark %}
<mark>{{{ content_html }}}</mark>
{% elseif is_code %}
<code>{{{ content_html }}}</code>
{% endif %}
