<div class="sl-file-door" id="{{ box_id }}"{% if is_form %} data-sl-file-form{% endif %}>
  <button type="button" class="sl-but" id="{{ input_id }}" data-sl-act="open"{% if editor_id %} data-editor="{{ editor_id }}"{% endif %}{% if describedby %} aria-describedby="{{ describedby }}"{% endif %}><i class="bi bi-folder2-open" aria-hidden="true"></i> {{ open_label }}</button>
  <span class="sl-chip sl-chip-neutral" data-sl-field="chip"{% if not chip_text %} hidden{% endif %}><i class="bi bi-paperclip" aria-hidden="true"></i><span data-sl-field="name" title="{{ chip_text }}">{{ chip_text }}</span><button type="button" class="sl-but-mini" data-sl-act="clear"{% if editor_id %} data-editor="{{ editor_id }}"{% endif %} title="{{ clear_label }}" aria-label="{{ clear_label }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
  {% if is_form %}
  <input type="file" class="sl-visually-hidden" name="{{ file_name }}" data-sl-field="file" accept="{{ accept_attr }}" aria-label="{{ open_label }}" tabindex="-1" required>
  {% else %}
  <input type="file" name="{{ file_name }}" data-sl-field="file" accept="{{ accept_attr }}" hidden>
  <input type="hidden" name="{{ path_name }}" data-sl-field="path" value="{{ path_value }}">
  {% endif %}
  {% if url_name %}
  <input type="hidden" name="{{ url_name }}" data-sl-field="url" value="{{ url_value }}">
  {% endif %}
</div>
