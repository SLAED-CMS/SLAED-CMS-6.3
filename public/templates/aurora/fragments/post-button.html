<form action="{{ action }}" method="post" class="sl-post-button"{% if form_attr %} {{{ form_attr }}}{% endif %}>
  {{{ hidden }}}
  <button type="submit" class="{% if is_mini %}sl-dial-item sl-but-mini{% elseif is_danger %}sl-alert-act sl-alert-act-danger{% elseif is_act %}sl-alert-act{% else %}sl-but{% endif %}" title="{{ title }}"{% if confirm_text %} data-sl-confirm="{{ confirm_text }}"{% endif %}><i class="bi bi-{{ icon_name }}" aria-hidden="true"></i>{% if label %} {{ label }}{% endif %}</button>
</form>
