{% if is_mark %}
<span id="{{ mark_id }}"{% if is_oob %} hx-swap-oob="outerHTML"{% endif %}>{{{ mark_html }}}</span>
{% elseif is_current %}
<div data-sl-quick-stamp="{{ stamp }}">
  {{{ text_html }}}
</div>
{% else %}
<form method="post" class="sl-inline-edit" data-sl-quick-form data-sl-quick-ask="{{ ask_text }}" data-sl-quick-leave="{{ leave_text }}" hx-post="{{ root }}index.php?go=1&amp;op=updateQuickEdit" hx-target="closest [data-sl-quick]" hx-swap="innerHTML" hx-push-url="false" hx-headers='{"X-CSRF-TOKEN": "{{ token }}"}'>
  <input type="hidden" name="kind" value="{{ kind }}">
  <input type="hidden" name="id" value="{{ id }}">
  <input type="hidden" name="field" value="{{ field }}">
  <input type="hidden" name="stamp" value="{{ stamp }}">
  {{{ editor_html }}}
  <button type="submit" class="sl-but"><i class="bi bi-check-lg" aria-hidden="true"></i> {{ save_label }}</button>
  <button type="button" class="sl-but" data-sl-quick-cancel><i class="bi bi-arrow-left" aria-hidden="true"></i> {{ back_label }}</button>
</form>
{% endif %}
