{% if label_for %}
<label{% if label_id %} id="{{ label_id }}"{% endif %} class="{% if is_label_hidden %}sl-visually-hidden{% else %}sl-form-label{% endif %}" for="{{ label_for }}"> {% if label_html %}{{{ label_html }}}{% else %}{{ label }}{% endif %}</label>
{% else %}
<span{% if label_id %} id="{{ label_id }}"{% endif %} class="{% if is_label_hidden %}sl-visually-hidden{% else %}sl-form-label{% endif %}"> {% if label_html %}{{{ label_html }}}{% else %}{{ label }}{% endif %}</span>
{% endif %}
