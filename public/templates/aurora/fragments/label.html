{% if label_for %}
<label{% if label_id %} id="{{ label_id }}"{% endif %} class="sl-form-label" for="{{ label_for }}"> {% if label_html %}{{{ label_html }}}{% else %}{{ label }}{% endif %}</label>
{% else %}
<span{% if label_id %} id="{{ label_id }}"{% endif %} class="sl-form-label"> {% if label_html %}{{{ label_html }}}{% else %}{{ label }}{% endif %}</span>
{% endif %}
