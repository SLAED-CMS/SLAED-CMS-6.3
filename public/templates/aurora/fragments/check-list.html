<div class="sl-check-list" role="group"{% if labelledby %} aria-labelledby="{{ labelledby }}"{% endif %}{% if describedby %} aria-describedby="{{ describedby }}"{% endif %}>
  {% for item in items %}
  <div{% if item.depth %} style="--sl-d-depth: {{ item.depth }}"{% endif %}>{% include 'fragments/checkbox.html' with item %}{% if item.main_name %}<label class="sl-chip sl-chip-info sl-check-main" title="{{ item.main_label }}"><input type="radio" class="sl-visually-hidden" name="{{ item.main_name }}" value="{{ item.value_attr }}" aria-label="{{ item.main_label }}: {{ item.label_text }}" data-sl-main{% if item.is_main %} checked{% endif %}><i class="bi bi-star" aria-hidden="true"></i><i class="bi bi-star-fill" aria-hidden="true"></i><span>{{ item.sub_label }}</span><span>{{ item.main_label }}</span></label>{% endif %}</div>
  {% endfor %}
</div>
