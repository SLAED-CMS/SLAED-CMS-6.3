<!doctype html>
<html lang="{{ lang }}" data-theme="{{ mode }}"{% if is_still %} data-sl-still{% endif %}>
  <head>
    <title>{% block title %}{% if title %}{{ title }}{% else %}{{ sitename }}{% endif %}{% endblock %}</title>
    {{{ meta }}}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{{ links }}}
  </head>
  <body>
    {% block content %}{% endblock %}
    {{{ scripts }}}
  </body>
</html>
