<section class="sl-pres-section" id="{% if is_brand %}archive{% else %}showcase{% endif %}">
  {% include 'fragments/presentation-head.html' with head %}
  <div class="sl-pres-body">
    <div class="sl-pres-gallery" data-sl-pres="{% if is_brand %}brand{% else %}sites{% endif %}" role="region" aria-label="{{ title }}" aria-roledescription="{{ role }}" data-sl-pres-of="{{ of }}">
      <div class="sl-pres-gallery-head"><span>{{ over }}</span><b>{{ count }}</b></div>
      <div class="sl-pres-gallery-track" tabindex="0" aria-label="{{ hint }}"{% if is_brand %} data-sl-shot-group{% endif %}>
        {% for item in items %}
        {% if is_brand %}
        <article class="sl-pres-tile" role="group" aria-label="{{ item.pos }}"{% if item.is_contain %} data-sl-pres-fit="contain"{% endif %}{% if item.is_first %} data-sl-pres-feature{% endif %}{% if item.is_hidden %} hidden{% endif %}>
          <a class="sl-pres-tile-open" href="{{ item.href }}" data-sl-shot-open title="{{ item.title }}"><img src="{{ item.href }}" width="{{ item.w }}" height="{{ item.h }}" alt="{{ item.title }}" loading="lazy" decoding="async"></a>
          <span class="sl-pres-tile-tools"><button type="button" data-sl-pres-open title="{{ item.open }}" aria-label="{{ item.open }}: {{ item.title }}"><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i></button><a href="{{ item.href }}" download title="{{ item.down }}" aria-label="{{ item.down }}: {{ item.title }}"><i class="bi bi-download" aria-hidden="true"></i></a></span>
          <div class="sl-pres-tile-copy">
            <small>{{ item.group }}</small>
            <h3>{{ item.title }}</h3>
          </div>
        </article>
        {% else %}
        {% include 'fragments/presentation-site.html' with item %}
        {% endif %}
        {% endfor %}
      </div>
      <div class="sl-pres-gallery-controls">
        <button type="button" data-sl-pres-step="-1" aria-label="{{ prev }}"><i class="bi bi-arrow-left" aria-hidden="true"></i></button>
        <output aria-live="polite" aria-atomic="true"></output>
        <input type="range" min="0" max="{{ last }}" value="0" data-sl-pres-range aria-label="{{ hint }}">
        <button type="button" data-sl-pres-step="1" aria-label="{{ next }}"><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</section>
