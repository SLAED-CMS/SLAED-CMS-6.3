<div class="sl-pres-claim sl-sec-cta">
  {% if over %}<span class="sl-pres-over"{% if is_build %} data-sl-text="over"{% endif %}>{{ over }}</span>{% endif %}
  <h3{% if is_build %} data-sl-text="title"{% endif %}>{{ title }}</h3>
  {% if text %}<p class="sl-sec-lines"{% if is_build %} data-sl-text="text" data-sl-lines{% endif %}>{{ text }}</p>{% endif %}
  {% if btn and href %}<a class="sl-but sl-sec-cta-but" href="{{ href }}"{% if href_ext %} target="_blank" rel="noopener"{% endif %}{% if is_build %} data-sl-text="btn"{% endif %}>{{ btn }}</a>{% endif %}
</div>
