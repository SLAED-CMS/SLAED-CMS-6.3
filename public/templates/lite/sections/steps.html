<div class="sl-pres-commits">
  {% for item in items %}<div class="sl-pres-commit"><span class="sl-pres-sha">{{ item.order_num }}</span><div><b{% if is_build %} data-sl-text="items.{{ item.order_num }}.title"{% endif %}>{{ item.title }}</b>{% if item.text %}<span class="sl-pres-tags"><span{% if is_build %} data-sl-text="items.{{ item.order_num }}.text"{% endif %}>{{ item.text }}</span></span>{% endif %}</div><span></span></div>{% endfor %}
</div>
