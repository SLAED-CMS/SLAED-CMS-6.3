<div class="sl-sec-media{% if not photo %} sl-sec-solo{% elseif side_right %} sl-sec-flip{% endif %}">
  {% if photo %}<figure class="sl-pres-shot sl-sec-pic"><img src="{{ photo }}" alt="{{ alt }}" style="--sl-d-focus: {{ focus }}" loading="lazy" width="2560" height="1440"></figure>{% endif %}
  <div class="sl-pres-principle-copy sl-sec-copy">
    <div class="sl-entry-content sl-sec-md">{{{ text_html }}}</div>
    {% if btn and href %}<p class="sl-sec-acts"><a class="sl-but" href="{{ href }}"{% if href_ext %} target="_blank" rel="noopener"{% endif %}>{{ btn }}</a></p>{% endif %}
  </div>
</div>
