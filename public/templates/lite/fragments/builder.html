<template data-sl-build>
  <div class="sl-builder-ring sl-builder-hover" data-sl-build-hover aria-hidden="true" hidden><span class="sl-builder-name" data-sl-build-name></span></div>
  <div class="sl-builder-ring sl-builder-sel" data-sl-build-sel hidden>
    <span class="sl-builder-name" data-sl-build-name aria-hidden="true"></span>
    <span class="sl-editor-pill sl-editor-pill-open sl-builder-bar" role="toolbar" data-sl-build-bar>
      <span class="sl-editor-grp"><button type="button" class="sl-modal-act sl-builder-grip" data-sl-build-grip data-sl-build-word="grip"><i class="bi bi-arrows-move" aria-hidden="true"></i></button></span>
      <span class="sl-editor-grp"><button type="button" class="sl-modal-act" data-sl-build-act="up" data-sl-build-word="up"><i class="bi bi-arrow-up" aria-hidden="true"></i></button><button type="button" class="sl-modal-act" data-sl-build-act="down" data-sl-build-word="down"><i class="bi bi-arrow-down" aria-hidden="true"></i></button></span>
      <span class="sl-editor-grp"><button type="button" class="sl-modal-act" data-sl-build-act="dup" data-sl-build-word="dup"><i class="bi bi-copy" aria-hidden="true"></i></button><button type="button" class="sl-modal-act" data-sl-build-act="link" data-sl-build-word="link"><i class="bi bi-link-45deg" aria-hidden="true"></i></button></span>
      <span class="sl-editor-grp"><button type="button" class="sl-modal-act" data-sl-build-act="hide" data-sl-build-word="hide"><i class="bi bi-eye-slash" aria-hidden="true"></i></button><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-build-act="del" data-sl-build-word="del"><i class="bi bi-trash3" aria-hidden="true"></i></button></span>
    </span>
    <button type="button" class="sl-but sl-builder-add" data-sl-build-act="add"><i class="bi bi-plus-lg" aria-hidden="true"></i><span data-sl-build-word="add"></span></button>
  </div>
  <div class="sl-builder-ring sl-builder-line" data-sl-build-line aria-hidden="true" hidden></div>
  <div class="sl-builder-ghost" data-sl-build-ghost aria-hidden="true" hidden></div>
</template>
