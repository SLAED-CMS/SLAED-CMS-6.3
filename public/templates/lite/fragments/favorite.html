<span id="{{ rep_id }}" class="sl-tip sl-float sl-fav">
  {% if is_on %}<span class="sl-but-mini sl-fav-on" aria-label="{{ _FAVOR }}"><i class="bi bi-star-fill" aria-hidden="true"></i></span>
  {% elseif is_limit %}<span class="sl-but-mini sl-fav-limit" aria-disabled="true" aria-label="{{ title }}"><i class="bi bi-star-fill" aria-hidden="true"></i></span>
  {% else %}<button type="button" class="sl-but-mini" aria-label="{{ _FAVOR_ADD }}" data-sl-fav="{{ rep_id }}" data-sl-done="{{ _FAVOR_DONE }}" hx-post="{{ href }}" hx-params="none" hx-headers='{"X-CSRF-TOKEN": "{{ token }}"}' hx-target="#{{ rep_id }}" hx-swap="outerHTML" hx-push-url="false"><i class="bi bi-star" aria-hidden="true"></i></button>
  {% endif %}
  <div class="sl-float-panel">{% if is_on %}{{ _FAVOR }}{% elseif is_limit %}{{ title }}{% else %}{{ _FAVOR_ADD }}{% endif %}</div>
</span>
