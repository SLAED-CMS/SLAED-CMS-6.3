<nav class="sl-block-menu"><ul>{% for item in items %}<li><a href="{% if item.href %}{{ item.href }}{% else %}#{% endif %}" title="{{ item.title }}"{% if item.blank %} target="_blank" rel="noopener"{% endif %}>{% if item.icon %}<i class="bi bi-{{ item.icon }}" aria-hidden="true"></i>&nbsp;{% endif %}{{ item.title }}</a>{% if item.kids %}<ul>{% for kid in item.kids %}<li><a href="{% if kid.href %}{{ kid.href }}{% else %}#{% endif %}" title="{{ kid.title }}"{% if kid.blank %} target="_blank" rel="noopener"{% endif %}>{% if kid.icon %}<i class="bi bi-{{ kid.icon }}" aria-hidden="true"></i>&nbsp;{% endif %}{{ kid.title }}</a></li>{% endfor %}</ul>{% endif %}</li>{% endfor %}</ul></nav>
