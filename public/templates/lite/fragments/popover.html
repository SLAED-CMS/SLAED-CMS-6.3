{% if content_html %}
<div class="sl-float sl-tip" tabindex="0"><span class="sl-tip-icon"><i class="bi bi-info-circle-fill" aria-hidden="true"></i></span><div class="sl-float-panel">{{{ content_html }}}</div></div>
{% endif %}
{% if items %}
<div class="sl-float sl-tip" tabindex="0">
  <span class="sl-tip-icon"><i class="bi bi-info-circle-fill" aria-hidden="true"></i></span>
  <div class="sl-float-panel">
    <dl>
      {% for item in items %}
      {% if item.label %}<dt>{{ item.label }}</dt>{% endif %}
      <dd>{% if item.has_value_text %}{{ item.value_text }}{% else %}{{{ item.value }}}{% endif %}</dd>
      {% endfor %}
    </dl>
  </div>
</div>
{% endif %}
