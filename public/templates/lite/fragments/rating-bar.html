{% if not is_live %}<span class="sl-hidden">{{ result }}</span>{% endif %}
<div title="{{ title }}" class="sl-urating"{% if is_live %} data-sl-rate hx-target="#{{ target_id }}" hx-swap="innerHTML transition:true" hx-push-url="false" hx-vals='{"mod": "{{ mod }}", "id": "{{ mid }}", "typ": "stars", "token": "{{ token }}"}'{% endif %}>
  {% for star in stars %}{% if is_live %}<a class="sl-star" hx-post="index.php?go=1&amp;op=getRatingView" hx-vals='{"rate": "{{ star.value }}"}' hx-trigger="click" title="{{ star.value }}">{% else %}<span class="sl-star">{% endif %}<i class="bi bi-star{% if star.is_full %}-fill{% elseif star.is_half %}-half{% endif %}" aria-hidden="true"></i>{% if is_live %}</a>{% else %}</span>{% endif %}{% endfor %}
</div>
<span title="{{ votes_title }}" class="sl-rate-num{% if has_score %} sl-rate-is{% endif %}">{{ votes }}</span>
