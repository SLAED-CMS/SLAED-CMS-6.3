<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сводка &middot; Статистика — стенд SLAED CMS</title>
  <link rel="stylesheet" href="../templates/admin/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/base.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/theme.css">
  <!-- The stand is served without Cache-Control; its sheets and scripts are stamped so an edit is seen at once -->
  <script>document.write('<link rel="stylesheet" href="assets/demo.css?v=' + Date.now() + '"><link rel="stylesheet" href="assets/st.css?v=' + Date.now() + '">');</script>
  <script src="../plugins/system/global-func.js"></script>
  <script src="../plugins/system/slaed.js"></script>
  <script src="../templates/admin/assets/js/admin-ui.js"></script>
  <style>
    /* Сводка: the page of an analytics service — the period at the top, six figures with their change and trend, one large
       chart, then the slices in cards and the table of days at the end */
    .v-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--sl-space-5);
    }

    .v-period {
      display: flex;
      align-items: center;
      gap: var(--sl-space-3);
    }

    .v-period b {
      min-width: 150px;
      font-size: var(--sl-font-h3);
      text-align: center;
    }

    .v-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: var(--sl-space-5);
    }

    .v-kpi {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: var(--sl-space-2) var(--sl-space-3);
      margin: 0;
      padding: var(--sl-space-5) var(--sl-space-6);
      border-top: 3px solid var(--st-tone);
    }

    .v-kpi-cap {
      grid-column: 1 / -1;
      font-size: var(--sl-font-small);
      color: var(--sl-text-muted);
    }

    .v-kpi-cap .bi {
      margin-right: var(--sl-space-2);
      color: var(--st-tone);
    }

    .v-kpi > b {
      font-size: var(--sl-font-h1);
      font-variant-numeric: tabular-nums;
      line-height: var(--sl-line-tight);
    }

    .v-kpi-spark {
      grid-column: 1 / -1;
      height: 28px;
    }

    .v-cap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sl-space-3) var(--sl-space-6);
      margin-bottom: var(--sl-space-5);
    }

    .v-cap h2 {
      margin: 0 auto 0 0;
      font-size: var(--sl-font-h4);
    }

    .v-key {
      display: inline-flex;
      align-items: center;
      gap: var(--sl-space-2);
      font-size: var(--sl-font-small);
      color: var(--sl-text-muted);
    }

    .v-main [data-st-chart] {
      --st-h: 260px;
    }

    .v-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: var(--sl-space-6);
    }

    .v-cards > .sl-box {
      margin: 0;
    }

    .v-tabs {
      margin-bottom: var(--sl-space-5);
    }

    .v-card [data-st-stack] + [data-st-bars] {
      margin-top: var(--sl-space-6);
    }

    .v-rings.sl-statx-rings {
      --sl-statx-max-width: 86px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .v-card [data-st-chart] {
      --st-h: 150px;
    }

    /* The beam of the theme crosses every figure once a cycle, each a step after the one before; the glyph jumps under the hand */
    .v-kpi {
      overflow: hidden;
    }

    @media (prefers-reduced-motion: no-preference) {
      :root.st-fx:not([data-demo-motion="off"]) .v-kpi::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: var(--sl-beam-width);
        background: linear-gradient(100deg, transparent, var(--sl-tint-strong), transparent);
        transform: translateX(-160%) skewX(-18deg);
        animation: sl-beam var(--sl-beam-dur) var(--sl-ease-in-out) infinite;
        animation-delay: calc(var(--st-i, 0) * var(--sl-beam-dur) / 10);
        pointer-events: none;
      }

      :root.st-fx:not([data-demo-motion="off"]) .v-kpi-cap .bi {
        display: inline-block;
        transition: transform var(--sl-time-slow) var(--st-spring);
      }

      :root.st-fx:not([data-demo-motion="off"]) .v-kpi:hover .v-kpi-cap .bi {
        transform: translateY(calc(var(--sl-space-2) * -1)) scale(1.3);
      }

      :root.st-fx:not([data-demo-motion="off"]) .v-kpi:hover > b {
        color: var(--st-tone);
      }

      :root.st-fx:not([data-demo-motion="off"]) .v-kpi > b {
        transition: color var(--sl-time-base) var(--sl-ease-out);
      }

      :root.st-fx:not([data-demo-motion="off"]) .st-play .v-kpi-spark {
        animation: st-fade 0.6s var(--sl-ease-out) both;
        animation-delay: calc(0.3s + var(--st-i, 0) * 80ms);
      }
    }

    .v-table summary {
      cursor: pointer;
      font-size: var(--sl-font-h4);
      font-weight: var(--sl-weight-semibold);
    }

    .v-table[open] summary {
      margin-bottom: var(--sl-space-5);
    }
  </style>
</head>
<body>
  <template data-st-face>
    <section class="sl-box v-bar">
      <div class="v-period">
        <button type="button" class="sl-but" data-st-go="prev" title="Месяц раньше" aria-label="Месяц раньше"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
        <b data-st-t="month"></b>
        <button type="button" class="sl-but" data-st-go="next" title="Месяц позже" aria-label="Месяц позже"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        <span class="sl-chip" data-st-t="run"></span>
        <span class="st-live" data-st-if="run">в эфире</span>
      </div>
      <span class="sl-seg" role="group" aria-label="Сколько дней показать" data-sl-knob="st-range"><span class="sl-seg-knob" data-sl-knob-mark></span>
        <button type="button" class="sl-seg-cell" data-st-range="7">7 дней</button>
        <button type="button" class="sl-seg-cell" data-st-range="14">14 дней</button>
        <button type="button" class="sl-seg-cell" data-st-range="all">Весь месяц</button>
      </span>
    </section>

    <section class="v-kpis" aria-label="Итоги периода" data-st-rise>
      <article data-st-tilt class="sl-box v-kpi st-s-u"><span class="v-kpi-cap"><i class="bi bi-person" aria-hidden="true"></i>Уникальные</span><b data-st-t="u"></b><span data-st-delta="u"></span><span class="v-kpi-spark" data-st-spark="u"></span></article>
      <article data-st-tilt class="sl-box v-kpi st-s-h"><span class="v-kpi-cap"><i class="bi bi-eye" aria-hidden="true"></i>Входы</span><b data-st-t="h"></b><span data-st-delta="h"></span><span class="v-kpi-spark" data-st-spark="h"></span></article>
      <article data-st-tilt class="sl-box v-kpi st-s-aud"><span class="v-kpi-cap"><i class="bi bi-people" aria-hidden="true"></i>Аудитория</span><b data-st-t="aud"></b><span data-st-delta="aud"></span><span class="v-kpi-spark" data-st-spark="aud"></span></article>
      <article data-st-tilt class="sl-box v-kpi st-s-ref"><span class="v-kpi-cap"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Переходы</span><b data-st-t="ref"></b><span data-st-delta="ref"></span><span class="v-kpi-spark" data-st-spark="ref"></span></article>
      <article data-st-tilt class="sl-box v-kpi st-s-usr"><span class="v-kpi-cap"><i class="bi bi-person-check" aria-hidden="true"></i>Пользователи</span><b data-st-t="usr"></b><span data-st-delta="usr"></span><span class="v-kpi-spark" data-st-spark="usr"></span></article>
      <article data-st-tilt class="sl-box v-kpi st-s-gen"><span class="v-kpi-cap"><i class="bi bi-stopwatch" aria-hidden="true"></i>Генерация, мс</span><b data-st-t="gen"></b><span data-st-delta="gen"></span><span class="v-kpi-spark" data-st-spark="gen"></span></article>
    </section>

    <section class="sl-box v-main">
      <header class="v-cap">
        <h2>Посещения по дням</h2>
        <span class="v-key st-s-h"><i class="st-dot"></i>Входы</span>
        <span class="v-key st-s-u"><i class="st-dot"></i>Уникальные</span>
        <button type="button" class="sl-but" data-st-cmp><i class="bi bi-intersect" aria-hidden="true"></i> Сравнить с прошлым месяцем</button>
      </header>
      <div data-st-chart="h,u" data-st-cmp-on data-st-pick></div>
    </section>

    <div class="v-cards" data-st-rise>
      <section class="sl-box v-card">
        <header class="v-cap"><h2>Источники</h2></header>
        <div data-st-stack="refcat"></div>
        <div class="sl-statx-tone-warning" data-st-bars="countries" data-st-top="6"></div>
      </section>
      <section class="sl-box v-card">
        <header class="v-cap"><h2>Аудитория</h2></header>
        <div class="sl-statx-rings v-rings">
          <div class="sl-statx-ring sl-statx-tone-success" data-st-share="human"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="sl-statx-rbg" cx="50" cy="50" r="38"></circle><circle class="sl-statx-rval" cx="50" cy="50" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"></circle></svg><strong data-st-pct></strong><b data-st-share-name></b><span data-st-share-hint></span></div>
          <div class="sl-statx-ring sl-statx-tone-accent" data-st-share="mobile"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="sl-statx-rbg" cx="50" cy="50" r="38"></circle><circle class="sl-statx-rval" cx="50" cy="50" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"></circle></svg><strong data-st-pct></strong><b data-st-share-name></b><span data-st-share-hint></span></div>
          <div class="sl-statx-ring sl-statx-tone-primary" data-st-share="ret"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="sl-statx-rbg" cx="50" cy="50" r="38"></circle><circle class="sl-statx-rval" cx="50" cy="50" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"></circle></svg><strong data-st-pct></strong><b data-st-share-name></b><span data-st-share-hint></span></div>
          <div class="sl-statx-ring sl-statx-tone-warning" data-st-share="search"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="sl-statx-rbg" cx="50" cy="50" r="38"></circle><circle class="sl-statx-rval" cx="50" cy="50" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"></circle></svg><strong data-st-pct></strong><b data-st-share-name></b><span data-st-share-hint></span></div>
        </div>
      </section>
      <section class="sl-box v-card" data-demo-tabs>
        <header class="v-cap"><h2>Техника</h2>
          <span class="sl-seg" role="tablist" aria-label="Разрез" data-sl-knob="st-tech"><span class="sl-seg-knob" data-sl-knob-mark></span>
            <button type="button" class="sl-seg-cell sl-is-active" role="tab" aria-selected="true" data-demo-tab="br">Браузеры</button>
            <button type="button" class="sl-seg-cell" role="tab" aria-selected="false" data-demo-tab="os">Системы</button>
            <button type="button" class="sl-seg-cell" role="tab" aria-selected="false" data-demo-tab="dev">Устройства</button>
          </span>
        </header>
        <div class="sl-statx-tone-primary" data-demo-panel="br" data-st-bars="browsers" data-st-top="7"></div>
        <div class="sl-statx-tone-success" data-demo-panel="os" data-st-bars="os" hidden></div>
        <div class="sl-statx-tone-accent" data-demo-panel="dev" data-st-bars="devices" hidden></div>
      </section>
      <section class="sl-box v-card" data-demo-tabs>
        <header class="v-cap"><h2>Сеансы</h2>
          <span class="sl-seg" role="tablist" aria-label="Разрез" data-sl-knob="st-sess"><span class="sl-seg-knob" data-sl-knob-mark></span>
            <button type="button" class="sl-seg-cell sl-is-active" role="tab" aria-selected="true" data-demo-tab="nr">Новые</button>
            <button type="button" class="sl-seg-cell" role="tab" aria-selected="false" data-demo-tab="dp">Глубина</button>
            <button type="button" class="sl-seg-cell" role="tab" aria-selected="false" data-demo-tab="du">Длительность</button>
          </span>
        </header>
        <div data-demo-panel="nr" data-st-stack="newret"></div>
        <div data-demo-panel="dp" data-st-stack="depth" hidden></div>
        <div data-demo-panel="du" data-st-stack="duration" hidden></div>
      </section>
      <section class="sl-box v-card">
        <header class="v-cap"><h2>Входы по часам</h2><span class="v-key st-s-gen"><i class="st-dot"></i>Генерация</span></header>
        <div data-st-chart="hits,gen" data-st-x="hours"></div>
      </section>
    </div>

    <section class="sl-box">
      <details class="v-table" open>
        <summary>По дням</summary>
        <div data-st-table></div>
      </details>
    </section>
  </template>
  <script>document.write('<script src="assets/st.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="assets/demo.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
