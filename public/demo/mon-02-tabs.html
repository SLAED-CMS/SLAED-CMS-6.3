<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вкладки &middot; Мониторинг — стенд SLAED CMS</title>
  <link rel="stylesheet" href="../templates/admin/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/base.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/theme.css">
  <!-- The stand is served without Cache-Control; its sheets and scripts are stamped so an edit is seen at once -->
  <script>document.write('<link rel="stylesheet" href="assets/demo.css?v=' + Date.now() + '"><link rel="stylesheet" href="assets/st.css?v=' + Date.now() + '"><link rel="stylesheet" href="assets/mon.css?v=' + Date.now() + '">');</script>
  <script src="../plugins/system/global-func.js"></script>
  <script src="../plugins/system/slaed.js"></script>
  <script src="../templates/admin/assets/js/admin-ui.js"></script>
  <style>
    /* Вкладки: the plate, the live chart over the whole width, then one window with the sections as tabs beside every
       check of the lamp; the tabs lie in one cell, so the window keeps the height of the longest and nothing jumps */
    /* The tabs stand a hair taller than the live chip; they give it back so this head is as high as its neighbours */
    .v-tabs {
      margin-block: -1px;
      margin-left: auto;
    }

    .v-tabs .sl-seg-cell {
      font-family: inherit;
      text-transform: none;
      letter-spacing: 0;
    }

    .v-panels {
      display: grid;
      flex: 1;
    }

    .v-panels > * {
      grid-area: 1 / 1;
    }

    .v-panels > [hidden] {
      display: grid;
      visibility: hidden;
    }

    @media (max-width: 760px) {
      .v-tabs {
        margin-left: 0;
      }

      .st-win-cap:has(.v-tabs) {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <template data-st-face data-st-module="monitor" data-st-title="Мониторинг" data-st-icon="display" data-st-tabs="Главная:|Справка:info|Журнал действий:log">
    <div class="st-ground" data-st-rise data-demo-kinds="ok:Норма:ok|warn:Внимание:warn|danger:Сбой:danger" data-kind="warn">
      <div data-mon-block="cockpit" data-mon-nav="off"></div>

      <section class="st-win" data-st-rise data-sl-live-box>
        <div class="st-win-cap"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i><span>Трафик и нагрузка</span><span class="st-meta">20 минут</span><span data-mon-live></span></div>
        <div class="st-win-body"><div data-mon-block="traffic"></div></div>
      </section>

      <div class="st-split" data-st-rise>
        <section class="st-win" data-demo-tabs>
          <div class="st-win-cap"><i class="bi bi-hdd-rack" aria-hidden="true"></i><span>Система</span>
            <span class="sl-seg v-tabs" role="tablist" aria-label="Раздел" data-sl-knob="mn-sec"><span class="sl-seg-knob" data-sl-knob-mark></span>
              <button type="button" class="sl-seg-cell sl-is-active" role="tab" aria-selected="true" data-demo-tab="srv">Сервер</button>
              <button type="button" class="sl-seg-cell" role="tab" aria-selected="false" data-demo-tab="php">PHP</button>
              <button type="button" class="sl-seg-cell" role="tab" aria-selected="false" data-demo-tab="db">База и запрос</button>
            </span>
          </div>
          <div class="st-win-body">
            <div class="v-panels">
              <div class="mn-two" data-demo-panel="srv"><div><div data-mon-meter="disk"></div><div data-mon-kv="server"></div></div><div><div data-mon-kv="disk"></div><p class="mn-sub">Сайт</p><div data-mon-kv="cms"></div></div></div>
              <div class="mn-two" data-demo-panel="php" hidden><div><div data-mon-kv="php"></div><p class="mn-sub">OPcache</p><div data-mon-kv="opcache"></div></div><div><div data-mon-meter="opmem"></div><div data-mon-meter="upload"></div><div data-mon-kv="limits"></div></div></div>
              <div class="mn-two" data-demo-panel="db" hidden><div><div data-mon-meter="pool"></div><div data-mon-kv="db"></div></div><div><div data-mon-meter="phpmem"></div><div data-mon-kv="request"></div></div></div>
            </div>
          </div>
        </section>
        <div class="st-side" data-st-rise>
          <section class="st-win">
            <div class="st-win-cap"><span class="st-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Проверки</span><span class="st-meta"><span data-mon-t="passed"></span> из <span data-mon-t="total"></span></span></div>
            <div class="st-win-body" data-mon-signals="all"></div>
          </section>
        </div>
      </div>

      <div class="st-trio" data-st-rise>
        <section class="st-win">
          <div class="st-win-cap"><span class="st-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Программы</span></div>
          <div class="st-win-body" data-mon-kv="software"></div>
        </section>
        <section class="st-win">
          <div class="st-win-cap"><span class="st-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Безопасность</span></div>
          <div class="st-win-body" data-mon-kv="security"></div>
        </section>
        <section class="st-win">
          <div class="st-win-cap"><span class="st-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Хранилище</span><span class="st-meta">копия сегодня, 07:38</span></div>
          <div class="st-win-body" data-mon-kv="folders"></div>
        </section>
      </div>

      <section class="st-win" data-st-rise>
        <div class="st-win-cap"><i class="bi bi-puzzle" aria-hidden="true"></i><span>Расширения PHP</span></div>
        <div class="st-win-body" data-mon-block="ext"></div>
      </section>
    </div>
  </template>
  <script>document.write('<script src="assets/st.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="assets/mon.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="assets/demo.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
