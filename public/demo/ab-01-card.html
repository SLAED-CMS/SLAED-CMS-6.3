<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 &middot; Карточка — стенд блока администратора SLAED CMS</title>
  <script>document.write('<script src="assets/ablock.js?v=' + Date.now() + '"><\/script>');</script>
  <style>
    /* 01 Карточка - the admin block cut from the site's own user block (partials/block-user-info.html of lite): the
       head with the avatar in its ring and the nick, the rows of sl-block-pm - the panel, the logout, the owner's links
       after a captioned line - and the summary of the visitors under it, ring and lines and the two chips. The ring and
       "Подробнее" open the window of the live statistics. On the site the head and the rows ARE the user card's classes;
       in the panel the same head is drawn on tokens.

       Transfer: one fragment per theme (admin-block-card.html) fed by adminblock(); the summary is session-summary.html
       with the shares it waits for; the window is fragments/window.html with the rows of getUserSessionAdminInfo() */

    [data-ab-ctx="admin"] .v-head {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: var(--sl-space-4);
      align-items: center;
      padding: var(--sl-space-2) 0 var(--sl-space-4);
      border-bottom: 1px solid var(--sl-border);
    }

    [data-ab-ctx="admin"] .v-head img {
      box-sizing: border-box;
      width: 52px;
      height: 52px;
      padding: 3px;
      border-radius: var(--sl-radius-circle);
      background: conic-gradient(var(--sl-primary) 0 100%, var(--sl-border) 0);
    }

    [data-ab-ctx="admin"] .v-head p {
      margin: 0;
      line-height: var(--sl-line-tight);
    }

    [data-ab-ctx="admin"] .v-head b {
      display: block;
      color: var(--sl-text);
      font-size: var(--sl-font-h4);
    }

    .v-head small {
      color: var(--sl-text-muted);
      font-size: var(--sl-font-micro);
    }

    .v-card .ab-sum {
      margin-top: var(--sl-space-4);
      padding-top: var(--sl-space-4);
      border-top: 1px solid var(--sl-border-subtle, var(--sl-border));
    }

    .sl-block-user-ava .sl-ava-min.v-ava {
      background-color: var(--sl-bg);
    }
  </style>
  <script>
    window.AB_FACE = {
      blocks(d) {
        const { esc, rows, line, free, block, summary } = window.AB;
        const head = d.ctx === 'site'
          ? `<div class="sl-block-user-ava"><span class="sl-live-avatar"><i class="sl-ava-min v-ava" style="background-image: url(${d.me.ava});"></i></span><p><a href="${d.home.href}">${esc(d.me.nick)}</a><small>${d.me.role} · вход в ${d.me.since}</small></p></div>`
          : `<div class="v-head"><img src="${d.me.ava}" alt=""><p><b>${esc(d.me.nick)}</b><small>${d.me.role} · вход в ${d.me.since}</small></p></div>`;
        const inner = `<div class="${d.ctx === 'site' ? 'sl-user-card ' : ''}v-card">${head}` +
          rows(d, [d.home, { ...d.logout, cls: 'ab-out' }]) + line(d) + rows(d, d.extras.items) + free(d) + summary(d) + '</div>';
        return block(d, { id: 7, title: d.title }, inner);
      },
    };
  </script>
</head>
<body>
  <script>document.write('<script src="assets/demo.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
