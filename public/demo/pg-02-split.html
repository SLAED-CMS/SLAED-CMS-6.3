<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три зоны &middot; Пагинатор — стенд SLAED CMS</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <!-- The stand is served without Cache-Control; its sheet and script are stamped so an edit is seen at once -->
  <script>document.write('<link rel="stylesheet" href="assets/demo.css?v=' + Date.now() + '">');</script>
  <script src="../plugins/system/global-func.js"></script>
  <script src="../plugins/system/slaed.js"></script>
  <style>
    /* Три зоны: back on the left edge, the numbers in the middle, forward on the right edge, the summary above them */
    .sl-pager.v2 { display: block; padding-bottom: 0; }
    .sl-pager.v2 .v2-sum { display: flex; justify-content: space-between; gap: var(--sl-space-4); margin: 0 0 var(--sl-space-5); font-size: var(--sl-font-small); text-align: left; }
    .v2-sum b { color: var(--sl-text-strong); font-weight: var(--sl-weight-semibold); }
    .v2-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sl-space-4); }
    .v2 .sl-but { margin: 0; padding-inline: var(--sl-space-5); }
    .v2-prev { justify-self: start; }
    .v2-next { justify-self: end; }
    .v2 .sl-but.sl-is-muted { opacity: var(--sl-fade-disabled); box-shadow: none; }
    .v2 .sl-but:focus-visible { box-shadow: var(--sl-shadow-focus); outline: 0; }
    .v2-pages { display: flex; gap: var(--sl-space-1); }
    .v2 .v2-cell { min-width: var(--sl-size-control); height: var(--sl-size-control); background: transparent; color: var(--sl-text); font-size: var(--sl-font-body); font-weight: var(--sl-weight-semibold); font-variant-numeric: tabular-nums; transition: background-color var(--sl-time-fast) var(--sl-ease-out), color var(--sl-time-fast) var(--sl-ease-out); }
    .v2 a.v2-cell:hover { background: var(--sl-tint); color: var(--sl-primary-strong); }
    .v2 .v2-cell.sl-is-active { background: var(--sl-primary-strong); color: var(--sl-on-solid); box-shadow: var(--sl-shadow-xs); }
    .v2 .v2-cell.sl-is-muted { color: var(--sl-text-muted); }
    .v2-count { display: none; color: var(--sl-text-muted); font-variant-numeric: tabular-nums; }
    .v2-count b { color: var(--sl-text-strong); }
    @container pg (width < 600px) {
      .v2-pages { display: none; }
      .v2-count { display: inline; }
    }
    @container pg (width < 380px) {
      .v2-word, .v2-shown { display: none; }
    }
  </style>
</head>
<body class="sl-summer" id="top">
<main class="d-page" data-demo-page data-demo-band="Новости">
  <h1 class="sl-title">Новости</h1>
  <ul class="d-pg-list" id="pg-list"></ul>
  <div data-demo-pager data-count="97" data-limit="10" data-cur="1" data-pg-list="pg-list"></div>
  <section class="d-pg-cases" aria-labelledby="pg-cases">
    <h2 class="sl-title" id="pg-cases">Тот же пагинатор в других местах</h2>
    <figure class="d-pg-case"><figcaption>Комментарии — три страницы, открыта вторая</figcaption><div data-demo-pager data-count="27" data-limit="10" data-cur="2"></div></figure>
    <figure class="d-pg-case"><figcaption>Архив — 480 материалов, 48 страниц, середина</figcaption><div data-demo-pager data-count="480" data-limit="10" data-cur="24"></div></figure>
    <figure class="d-pg-case"><figcaption>Конец раздела — последняя страница</figcaption><div data-demo-pager data-count="97" data-limit="10" data-cur="10"></div></figure>
    <figure class="d-pg-case d-pg-narrow"><figcaption>Узкая колонка — подвал форума</figcaption><div data-demo-pager data-count="480" data-limit="10" data-cur="7"></div></figure>
    <figure class="d-pg-case d-pg-pm"><figcaption>Личные сообщения — колонка списка, 240 писем</figcaption><div data-demo-pager data-count="240" data-limit="15" data-cur="8"></div></figure>
  </section>
</main>
<!-- The pager every host on the page clones: the variant is this template and the style above, the page around it is shared -->
<template data-pg-tpl>
  <nav class="sl-pager v2" aria-label="Страницы">
    <p class="sl-pager-info v2-sum" aria-live="polite"><span class="v2-shown">Показаны <b><span data-pg-text="from"></span>–<span data-pg-text="to"></span></b> из <b data-pg-text="count"></b></span><span>Страница <b data-pg-text="cur"></b> из <b data-pg-text="pages"></b></span></p>
    <div class="v2-row">
      <a class="sl-but v2-prev" data-pg-go="prev" title="Предыдущая страница"><i class="bi bi-arrow-left" aria-hidden="true"></i><span class="v2-word">Назад</span></a>
      <span class="v2-pages" data-pg-pages data-pg-cell="sl-but-mini v2-cell" data-pg-win="7"></span>
      <span class="v2-count" aria-hidden="true"><b data-pg-text="cur"></b> / <span data-pg-text="pages"></span></span>
      <a class="sl-but v2-next" data-pg-go="next" title="Следующая страница"><i class="bi bi-arrow-right" aria-hidden="true"></i><span class="v2-word">Вперёд</span></a>
    </div>
  </nav>
</template>
<script>document.write('<script src="assets/demo.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
