<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зебра &middot; Таблицы панели — стенд SLAED CMS</title>
  <link rel="stylesheet" href="../templates/admin/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/base.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/theme.css">
  <!-- The stand is served without Cache-Control; its sheets and scripts are stamped so an edit is seen at once -->
  <script>document.write('<link rel="stylesheet" href="assets/demo.css?v=' + Date.now() + '"><link rel="stylesheet" href="assets/tbl.css?v=' + Date.now() + '">');</script>
  <script src="../plugins/system/global-func.js"></script>
  <script src="../plugins/system/slaed.js"></script>
  <script src="../templates/admin/assets/js/admin-ui.js"></script>
  <style>
    /* Зебра: no lines; every second row lies on a pale band with rounded ends, the row in hand takes the tint */
    @media (width > 560px) {
      .tb-skin .sl-table-list-sort {
        border-collapse: separate;
      }

      .tb-skin .sl-table-list-sort th {
        height: 38px;
        padding: 0 var(--sl-space-6) 0 var(--sl-space-5);
        font-size: var(--sl-font-small);
        color: var(--sl-text-muted);
      }

      .tb-skin .sl-table-list-sort td {
        height: 40px;
        padding: 0 var(--sl-space-5);
      }

      .tb-skin .sl-table-list-sort :is(th, td):is(.sl-col-status, .sl-col-actions, .sl-col-check) {
        padding: 0 var(--sl-space-3);
      }

      .tb-skin .sl-table-list-sort tbody tr:nth-child(even) > td {
        background: light-dark(#f4f7fa, #172033);
      }

      .tb-skin .sl-table-list-sort tbody tr > td:first-child {
        border-radius: var(--sl-radius-2) 0 0 var(--sl-radius-2);
      }

      .tb-skin .sl-table-list-sort tbody tr > td:last-child {
        border-radius: 0 var(--sl-radius-2) var(--sl-radius-2) 0;
      }

      .tb-skin .sl-table-list-sort tbody tr:hover > td {
        background: var(--sl-tint);
      }

      .tb-skin .sl-table-list-sort tbody tr:has(> .sl-col-check input:checked) > td {
        background: var(--sl-tint-strong);
      }

      .tb-skin .sl-table-list-sort td:is(.sl-col-id, .sl-col-date) {
        color: var(--sl-text-muted);
      }
    }
  </style>
</head>
<body>
  <script>document.write('<script src="assets/tbl.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="assets/demo.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
