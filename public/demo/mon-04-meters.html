<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Приборы &middot; Мониторинг — стенд SLAED CMS</title>
  <link rel="stylesheet" href="../templates/admin/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/base.css">
  <link rel="stylesheet" href="../templates/admin/assets/css/theme.css">
  <!-- The stand is served without Cache-Control; its sheets and scripts are stamped so an edit is seen at once -->
  <script>document.write('<link rel="stylesheet" href="assets/demo.css?v=' + Date.now() + '"><link rel="stylesheet" href="assets/st.css?v=' + Date.now() + '"><link rel="stylesheet" href="assets/mon.css?v=' + Date.now() + '">');</script>
  <script src="../plugins/system/global-func.js"></script>
  <script src="../plugins/system/slaed.js"></script>
  <script src="../templates/admin/assets/js/admin-ui.js"></script>
  <style>
    /* Приборы: every figure that has a limit is a meter — three windows of two meters each under the live chart; the
       plain facts stand in one large window of two equal halves beside the request, the checks and the software */
    .v-meters {
      justify-content: space-around;
    }
  </style>
</head>
<body>
  <template data-st-face data-st-module="monitor" data-st-title="Мониторинг" data-st-icon="display" data-st-tabs="Главная:|Справка:info|Журнал действий:log">
    <div class="mn-ground" data-st-rise data-demo-kinds="ok:Норма:ok|warn:Внимание:warn|danger:Сбой:danger" data-kind="warn">
      <div data-mon-block="cockpit" data-mon-nav="off"></div>

      <section class="mn-win" data-st-rise data-sl-live-box>
        <div class="mn-win-cap"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i><span>Трафик и нагрузка</span><span class="mn-meta">20 минут</span><span data-mon-live></span></div>
        <div class="mn-win-body"><div data-mon-block="traffic"></div></div>
      </section>

      <div class="mn-trio" data-st-rise>
        <section class="mn-win">
          <div class="mn-win-cap"><span class="mn-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Память</span></div>
          <div class="mn-win-body v-meters"><div data-mon-meter="opmem"></div><div data-mon-meter="phpmem"></div></div>
        </section>
        <section class="mn-win">
          <div class="mn-win-cap"><span class="mn-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Ёмкость</span></div>
          <div class="mn-win-body v-meters"><div data-mon-meter="disk"></div><div data-mon-meter="pool"></div></div>
        </section>
        <section class="mn-win">
          <div class="mn-win-cap"><span class="mn-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Хранилище</span><span class="mn-meta">копия сегодня, 07:38</span></div>
          <div class="mn-win-body v-meters"><div data-mon-store></div><div data-mon-meter="upload"></div></div>
        </section>
      </div>

      <div class="mn-split" data-st-rise>
        <section class="mn-win">
          <div class="mn-win-cap"><i class="bi bi-hdd-network" aria-hidden="true"></i><span>Сервер, PHP и база</span></div>
          <div class="mn-win-body mn-two">
            <div><p class="mn-sub">Сервер</p><div data-mon-kv="server"></div><p class="mn-sub">PHP</p><div data-mon-kv="php"></div><p class="mn-sub">Диск</p><div data-mon-kv="disk"></div><p class="mn-sub">Безопасность</p><div data-mon-kv="security"></div></div>
            <div><p class="mn-sub">Лимиты</p><div data-mon-kv="limits"></div><p class="mn-sub">База данных</p><div data-mon-kv="db"></div><p class="mn-sub">OPcache</p><div data-mon-kv="opcache"></div><p class="mn-sub">Сайт</p><div data-mon-kv="cms"></div></div>
          </div>
        </section>
        <div class="mn-side" data-st-rise>
          <section class="mn-win">
            <div class="mn-win-cap"><span class="mn-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Проверки</span><span class="mn-meta"><span data-mon-t="passed"></span> из 12</span></div>
            <div class="mn-win-body" data-mon-signals="all"></div>
          </section>
          <section class="mn-win">
            <div class="mn-win-cap"><span class="mn-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Запрос</span></div>
            <div class="mn-win-body" data-mon-kv="request"></div>
          </section>
          <section class="mn-win">
            <div class="mn-win-cap"><span class="mn-lamps" aria-hidden="true"><i></i><i></i><i></i></span><span>Программы</span></div>
            <div class="mn-win-body" data-mon-kv="software"></div>
          </section>
        </div>
      </div>

      <section class="mn-win" data-st-rise>
        <div class="mn-win-cap"><i class="bi bi-puzzle" aria-hidden="true"></i><span>Расширения PHP</span></div>
        <div class="mn-win-body mn-two"><div><p class="mn-sub">Включены</p><div class="mn-chips" data-mon-chips="on"></div></div><div><p class="mn-sub">Выключены</p><div class="mn-chips" data-mon-chips="off"></div></div></div>
      </section>
    </div>
  </template>
  <script>document.write('<script src="assets/st.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="assets/mon.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="assets/demo.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
