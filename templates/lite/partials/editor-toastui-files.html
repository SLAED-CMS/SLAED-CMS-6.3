<div id="{{ panel_id }}" class="sl-toastui-upload sl-none" data-editor-id="{{ editor_id }}" role="dialog" aria-labelledby="{{ title_id }}" aria-hidden="true">
  <div class="sl-toastui-window-head">
    <button type="button" class="sl-toastui-window-action sl-toastui-window-drag js-slaed-window-drag" data-editor="{{ editor_id }}" data-window="files" title="{{ move_label }}" aria-label="{{ move_label }}"><span class="sl-toastui-head-icon sl-toastui-head-icon-move" aria-hidden="true"></span></button>
    <strong id="{{ title_id }}">{{ title_label }}</strong>
    <div class="sl-toastui-window-actions">
      <button type="button" class="sl-toastui-window-action js-slaed-window-expand" data-editor="{{ editor_id }}" data-window="files" data-expand="{{ expand_label }}" data-restore="{{ restore_label }}" title="{{ expand_label }}" aria-label="{{ expand_label }}"><span class="sl-toastui-head-icon sl-toastui-head-icon-expand" aria-hidden="true"></span></button>
      <button type="button" class="sl-toastui-window-action js-slaed-window-close" data-editor="{{ editor_id }}" data-window="files" title="{{ close_label }}" aria-label="{{ close_label }}"><span class="sl-toastui-head-icon sl-toastui-head-icon-close" aria-hidden="true"></span></button>
    </div>
  </div>
  <div class="sl-toastui-upload-info">
    <div>{{ type_label }}: {{ types_text }}</div>
    <div>{{ allsize_label }}: {{ allsize_text }}</div>
    <div>{{ filesize_label }}: {{ filesize_text }}</div>
    <div>{{ width_label }}: {{ width_text }}</div>
    <div>{{ height_label }}: {{ height_text }}</div>
    <div>{{ count_label }}: {{ count_text }}</div>
  </div>
  <div class="sl-toastui-upload-picker">
    <label for="{{ file_id }}">{{ select_label }}</label>
    <div class="sl-toastui-upload-file-row js-slaed-upload-drop" data-editor="{{ editor_id }}" role="button" tabindex="0" aria-label="{{ drop_label }}">
      <span class="toastui-editor-file-name js-slaed-upload-name">{{ nofile_label }}</span>
      <input type="file" id="{{ file_id }}" class="sl-toastui-file-input js-slaed-upload-file" data-editor="{{ editor_id }}" multiple="multiple">
    </div>
    <small>{{ drop_label }}</small>
  </div>
  <div class="sl-toastui-upload-refresh">
    <input type="button" value="{{ refresh_label }}" class="js-slaed-file-refresh" data-editor="{{ editor_id }}">
  </div>
  <div id="{{ msg_id }}"></div>
  <label id="{{ object_id }}" class="sl-toastui-image-mode sl-none">
    <input type="checkbox">
    <span><strong>{{ object_label }}</strong><small>{{ object_info }}</small></span>
  </label>
  <div id="{{ list_id }}" class="sl-editor-upload-files"></div>
</div>
