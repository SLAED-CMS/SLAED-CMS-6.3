<div class="js-slaed-editor-tpl" hidden>
  <template data-tpl="emoji-panel">
    <dialog class="sl-modal sl-modal-sm sl-editor-emoji-panel" data-sl-window>
      <div class="sl-modal-title">
        <i class="bi bi-emoji-smile" aria-hidden="true"></i>
        <span class="sl-modal-cap"><strong>{{ emoji_label }}</strong></span>
        <span class="sl-modal-acts">
          <span class="sl-modal-act sl-modal-act-move" title="{{ move_label }}" aria-hidden="true"><i class="bi bi-grip-vertical"></i></span>
          <button type="button" class="sl-modal-act" data-sl-full data-expand="{{ expand_label }}" data-restore="{{ restore_label }}" title="{{ expand_label }}" aria-label="{{ expand_label }}"><i class="bi bi-arrows-angle-expand" aria-hidden="true"></i></button>
          <button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ close_label }}" aria-label="{{ close_label }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </span>
      </div>
      <input type="search" class="sl-editor-emoji-search">
      <div class="sl-editor-emoji-tabs"></div>
      <div class="sl-editor-emoji-grid"></div>
    </dialog>
  </template>
  <template data-tpl="emoji-tab"><button type="button" class="sl-editor-emoji-tab"></button></template>
  <template data-tpl="emoji-item"><button type="button" class="sl-editor-emoji-item"></button></template>
  <template data-tpl="emoji-empty"><div class="sl-editor-emoji-empty"></div></template>
  <template data-tpl="msg-info"><div class="sl-alert sl-alert-info"><div class="sl-alert-body"><p class="sl-alert-text" data-sl-text></p></div></div></template>
  <template data-tpl="msg-warn"><div class="sl-alert sl-alert-warn"><div class="sl-alert-body"><p class="sl-alert-text" data-sl-text></p></div></div></template>
  <template data-tpl="fm-tile">
    <div class="sl-fm-cell" tabindex="-1">
      <div class="sl-fm-tile">
        <span class="sl-fm-tile-img"><i class="bi" aria-hidden="true"></i><img alt="" hidden><a class="sl-fm-zoom" href="#" data-sl-zoom hidden><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i></a></span>
        <span class="sl-fm-tile-kind"></span>
        <span class="sl-fm-tile-cap"><b></b><small></small></span>
      </div>
      <label class="sl-fm-pick"><input type="checkbox" data-sl-pick></label>
    </div>
  </template>
  <template data-tpl="fm-row">
    <div class="sl-fm-row" tabindex="-1">
      <label class="sl-fm-pick"><input type="checkbox" data-sl-pick></label>
      <span class="sl-fm-row-thumb"><i class="bi" aria-hidden="true"></i><img alt="" hidden><a class="sl-fm-zoom" href="#" data-sl-zoom hidden><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i></a></span>
      <span class="sl-fm-row-name"></span>
      <span class="sl-fm-row-meta"></span>
      <span class="sl-fm-row-meta"></span>
      <span class="sl-fm-row-meta"></span>
    </div>
  </template>
  <template data-tpl="fm-dial"><span class="sl-dial"><button type="button" class="sl-dial-toggle sl-but-mini"><i class="bi bi-three-dots" aria-hidden="true"></i></button></span></template>
  <template data-tpl="fm-act"><a class="sl-dial-item sl-but-mini" href="#"><i class="bi" aria-hidden="true"></i></a></template>
  <template data-tpl="fm-job">
    <div class="sl-fm-job">
      <i class="bi bi-file-earmark-arrow-up" aria-hidden="true"></i>
      <div>
        <span class="sl-fm-job-name"><span></span><small></small></span>
        <div class="sl-progress-line sl-progress-2"><div></div></div>
      </div>
      <button type="button" class="sl-but-mini sl-is-muted" data-sl-act="jobstop"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
  </template>
  <template data-tpl="fm-pick"><label class="sl-fm-pick"><input type="checkbox"></label></template>
  <template data-tpl="fm-why"><p class="sl-fm-job-why"></p></template>
  <template data-tpl="fm-prop"><div><dt></dt><dd></dd></div></template>
  <template data-tpl="fm-busy"><span class="sl-fm-busy"><span class="sl-loading"></span></span></template>
</div>
