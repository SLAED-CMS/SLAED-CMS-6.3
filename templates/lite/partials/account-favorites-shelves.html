<div class="sl-opt-grid sl-opt-w6" id="favshelves">
  {% for shelf in shelves %}
  <div class="sl-opt-tile sl-opt-w6 sl-cat-tone-{{ shelf.tone }}">
    <div class="sl-profile-hub-head" title="{{ shelf.title }}" data-sl-toggle-control="favshelf-{{ shelf.key }}" data-sl-toggle-effect="slide" data-sl-toggle-duration="500">
      <h3><i class="bi bi-{{ shelf.icon }}" aria-hidden="true"></i> {{{ shelf.title_html }}}</h3>
      <span class="sl-profile-hub-total"><span class="sl-chip sl-chip-neutral" title="{{ fav_label }}">{{ shelf.count }}</span><i class="bi bi-chevron-up sl-panel-toggle-open" aria-hidden="true"></i><i class="bi bi-chevron-down sl-panel-toggle-closed" aria-hidden="true"></i></span>
    </div>
    <div id="favshelf-{{ shelf.key }}" data-sl-toggle="favshelf-{{ shelf.key }}">
      {% for row in shelf.rows %}
      <div class="sl-cab-row"><i class="bi bi-{{ shelf.icon }}" aria-hidden="true"></i><b><a href="{{ row.href }}" title="{{ row.title }}">{{{ row.label_html }}}</a></b><span class="sl-profile-hub-total"><a class="sl-but-mini" href="{{ row.href }}" title="{{ show_label }}"><i class="bi bi-eye" aria-hidden="true"></i></a><a class="sl-but-mini" href="{{ row.del_href }}" title="{{ del_label }}" hx-get="{{ row.del_href }}" hx-include="#favseek, #favmod" hx-target="#repfavorliste" hx-swap="innerHTML" hx-push-url="false"><i class="bi bi-trash" aria-hidden="true"></i></a></span></div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
  {% if !shelves %}
  <div class="sl-opt-tile sl-opt-w6"><p>{{ none_text }}</p></div>
  {% endif %}
</div>
