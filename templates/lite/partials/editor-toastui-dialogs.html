{% for window in windows %}
<div id="{{ window.head_id }}" class="sl-toastui-window-head sl-toastui-popup-head sl-none" data-window-head="{{ window.name }}">
  <button type="button" class="sl-toastui-window-action sl-toastui-window-drag js-slaed-window-drag" data-editor="{{ editor_id }}" data-window="{{ window.name }}" title="{{ move_label }}" aria-label="{{ move_label }}"><span class="sl-toastui-head-icon sl-toastui-head-icon-move" aria-hidden="true"></span></button>
  <strong>{{ window.label }}</strong>
  <div class="sl-toastui-window-actions">
    <button type="button" class="sl-toastui-window-action js-slaed-window-expand" data-editor="{{ editor_id }}" data-window="{{ window.name }}" data-expand="{{ expand_label }}" data-restore="{{ restore_label }}" title="{{ expand_label }}" aria-label="{{ expand_label }}"><span class="sl-toastui-head-icon sl-toastui-head-icon-expand" aria-hidden="true"></span></button>
    <button type="button" class="sl-toastui-window-action js-slaed-window-close" data-editor="{{ editor_id }}" data-window="{{ window.name }}" title="{{ close_label }}" aria-label="{{ close_label }}"><span class="sl-toastui-head-icon sl-toastui-head-icon-close" aria-hidden="true"></span></button>
  </div>
</div>
{% endfor %}
