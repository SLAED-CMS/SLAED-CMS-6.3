<dialog class="sl-modal sl-modal-sm" id="sl-share-qr" aria-labelledby="sl-qr-name">
  <div class="sl-modal-title">
    <i class="bi bi-qr-code" aria-hidden="true"></i>
    <span class="sl-modal-cap"><strong id="sl-qr-name">{{ _QRCODE }}</strong></span>
    <span class="sl-modal-acts"><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ _CLOSE }}" aria-label="{{ _CLOSE }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
  </div>
  <div class="sl-modal-body">
    <div class="sl-qr-code" data-sl-qr></div>
    <p class="sl-modal-note"></p>
  </div>
  <div class="sl-modal-foot">
    <button type="button" class="sl-modal-btn sl-modal-btn-main" data-sl-share-act="copy" data-sl-done="{{ _COPIED }}" data-sl-focus><i class="bi bi-link-45deg" aria-hidden="true"></i> {{ _COPYLINK }}</button>
  </div>
</dialog>
