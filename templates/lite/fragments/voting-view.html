<li>
  <div class="sl-progress-info">
    <span title="{{ text_safe }}">{{{ text }}}</span>
    <span class="sl-pull-right" title="{{ text_safe }} - {{ percent }}%"><b>{{ percent }}%</b> <b>({{ votes_label }}: {{ votes }})</b></span>
  </div>
  <meter class="sl-vote-meter sl-vote-meter-{{ pn }}" value="{{ percent }}" min="0" max="100" title="{{ text_safe }} - {{ percent }}%">{{ percent }}%</meter>
</li>
