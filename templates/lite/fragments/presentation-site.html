<article class="sl-pres-tile">
  <figure class="sl-pres-shot"><img src="{{ src }}" width="{{ w }}" height="{{ h }}" alt="{{ name }}" loading="lazy" decoding="async"><b class="sl-pres-rate" title="{{ rating }}"><i class="bi bi-star-fill" aria-hidden="true"></i>{{ rate }}</b></figure>
  <div class="sl-pres-tile-copy">{% if has_cat %}<small>{{ cat }}</small>{% endif %}<h3>{{ name }}</h3></div>
</article>
