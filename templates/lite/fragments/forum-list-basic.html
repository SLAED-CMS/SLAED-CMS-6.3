<tr class="forum-line">
	<td class="fl-col-icon-m">{{{ icon }}}</td>
	<td class="fl-col-content"><h3>{{{ link }}}</h3></td>
	<td class="fl-col-stat">{{ replies }}</td>
	<td class="fl-col-stat">{{ posts }}</td>
	<td class="fl-col-stat">{{ views }}</td>
	<td class="fl-col-last">
		<ul class="forum-last">
			<li>{{ last_date }}</li>
			<li>{{{ last_poster }}} {{{ last_link }}}</li>
		</ul>
	</td>
</tr>
