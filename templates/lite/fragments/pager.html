<p class="sl-pager-info">{{ page_label }} <b>{{ page_of }}</b>{% if count %}. {{ overall }}: <b>{{ count }}</b>{% endif %}</p>
<div class="sl-pager">
  <div class="sl-pager-main">
    <div class="sl-pager-pages">{{{ items }}}</div>
    <div class="sl-pager-nextprev">
      <b class="sl-pager-prev">{{{ prev }}}</b>
      <b class="sl-pager-next">{{{ next }}}</b>
    </div>
  </div>
</div>
