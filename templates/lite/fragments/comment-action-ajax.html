<a
  href="index.php?{{{ query }}}"

  {% if is_post %}hx-post="index.php?{{{ query }}}"{% else %}hx-get="index.php?{{{ query }}}"{% endif %}
  hx-target="{% if target_id %}#{{ target_id }}{% else %}#rep{{ target }}{% endif %}"
  hx-swap="{% if swap %}{{ swap }}{% else %}innerHTML{% endif %}"
  hx-push-url="false"

  title="{{ title }}"

  {% if class or is_favorite or is_button_blue or is_cart_plus or is_cart_minus %}
  class="
    {% if class %}{{ class }}{% endif %}
    {% if is_favorite %}{% if class %} {% endif %}sl-favor{% endif %}
    {% if is_button_blue %}{% if class or is_favorite %} {% endif %}sl-but-primary{% endif %}
    {% if is_cart_plus %}{% if class or is_favorite or is_button_blue %} {% endif %}sl-cart-plus{% endif %}
    {% if is_cart_minus %}{% if class or is_favorite or is_button_blue or is_cart_plus %} {% endif %}sl-cart-minus{% endif %}
  "
  {% endif %}
>{% if is_favorite %}<i class="bi bi-heart" aria-hidden="true"></i> {% endif %}{% if is_cart_plus %}<i class="bi bi-cart-plus" aria-hidden="true"></i> {% endif %}{% if is_cart_minus %}<i class="bi bi-dash-lg" aria-hidden="true"></i> {% endif %}{{ label }}</a>
