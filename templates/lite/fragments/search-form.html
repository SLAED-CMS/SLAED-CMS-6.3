{% if is_block %}
<form action="index.php?name=search" method="post" class="sl-block-search">
  <input type="hidden" name="mod" value="">
  <input type="text" name="word" maxlength="100" placeholder="{{ search_label }}" aria-label="{{ search_label }}" class="sl-field sl-field--block" required>
  <button type="submit" class="sl-but">{{ ok_label }}</button>
</form>
{% else %}
<form action="{{ action }}" method="post" name="post" class="sl-search-panel">
  {{{ mod_html }}}
  {% if typ_html %}{{{ typ_html }}}{% endif %}
  {{{ word_html }}}
  <button type="submit" class="sl-but">{{ ok_label }}</button>
</form>
{% endif %}
