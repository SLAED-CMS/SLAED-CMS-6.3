<dialog class="sl-modal sl-modal-md" id="sl-share-sheet" aria-labelledby="sl-share-name">
  <div class="sl-modal-title">
    <i class="bi bi-share-fill" aria-hidden="true"></i>
    <span class="sl-modal-cap"><strong id="sl-share-name">{{ _SHARE }}</strong></span>
    <span class="sl-modal-acts"><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ _CLOSE }}" aria-label="{{ _CLOSE }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
  </div>
  <div class="sl-modal-body">
    <div class="sl-share-grid">
      <button type="button" class="sl-share-net" data-sl-net="telegram"><span class="sl-share-net-ico"><i class="bi bi-telegram" aria-hidden="true"></i></span>Telegram</button>
      <button type="button" class="sl-share-net" data-sl-net="whatsapp"><span class="sl-share-net-ico"><i class="bi bi-whatsapp" aria-hidden="true"></i></span>WhatsApp</button>
      <button type="button" class="sl-share-net" data-sl-net="viber"><span class="sl-share-net-ico"><svg class="sl-svg-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.3c-3.5 0-6.4 2.4-6.4 5.4 0 1.6.8 3 2.2 4-.1.9-.4 2-1 2.8 1.2-.2 2.5-.7 3.3-1.3.6.1 1.2.2 1.9.2 3.5 0 6.4-2.4 6.4-5.4S11.5 1.3 8 1.3z" fill="none" stroke="currentColor" stroke-width="1.3"/><path transform="translate(4.9 3.6) scale(0.42)" fill="currentColor" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"/></svg></span>Viber</button>

      <button type="button" class="sl-share-net" data-sl-net="facebook"><span class="sl-share-net-ico"><i class="bi bi-facebook" aria-hidden="true"></i></span>Facebook</button>
      <button type="button" class="sl-share-net" data-sl-net="x"><span class="sl-share-net-ico"><i class="bi bi-twitter-x" aria-hidden="true"></i></span>X</button>
      <button type="button" class="sl-share-net" data-sl-net="pinterest"><span class="sl-share-net-ico"><i class="bi bi-pinterest" aria-hidden="true"></i></span>Pinterest</button>
      <button type="button" class="sl-share-net" data-sl-net="reddit"><span class="sl-share-net-ico"><i class="bi bi-reddit" aria-hidden="true"></i></span>Reddit</button>
      <button type="button" class="sl-share-net" data-sl-net="linkedin"><span class="sl-share-net-ico"><i class="bi bi-linkedin" aria-hidden="true"></i></span>LinkedIn</button>
      <button type="button" class="sl-share-net" data-sl-net="mail"><span class="sl-share-net-ico"><i class="bi bi-envelope-at" aria-hidden="true"></i></span>{{ _EMAIL }}</button>
    </div>
  </div>
</dialog>
