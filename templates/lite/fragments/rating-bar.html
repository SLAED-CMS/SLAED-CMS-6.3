{% if not is_live %}<span class="sl-none">{{ result }}</span>{% endif %}
<div title="{{ title }}" class="sl-urating">
  {% for star in stars %}
    {% if is_live %}
      <a class="sl-star" hx-get="index.php?{{{ hover_query }}}&amp;rate={{ star.value }}" hx-trigger="click" hx-target="#{{ target_id }}" hx-swap="outerHTML" hx-push-url="false" title="{{ star.value }}"><i class="bi bi-star{% if star.is_full %}-fill{% elseif star.is_half %}-half{% endif %}" aria-hidden="true"></i></a>
    {% else %}
      <i class="bi bi-star{% if star.is_full %}-fill{% elseif star.is_half %}-half{% endif %}" aria-hidden="true"></i>
    {% endif %}
  {% endfor %}
</div>
<span title="{{ votes_title }}" class="sl-rate-num{% if has_score %} sl-rate-is{% endif %}">{{ votes }}</span>
