<time
  datetime="{{ iso }}"
  title="{{ title }}"
  class="{% if class %}{{ class }}{% elseif is_related_date %}sl-related-date{% else %}sl-chip sl-chip-info sl-date{% endif %}"
>{% if not class and not is_related_date %}<i class="bi bi-calendar3" aria-hidden="true"></i> {% endif %}{{ text }}</time>
