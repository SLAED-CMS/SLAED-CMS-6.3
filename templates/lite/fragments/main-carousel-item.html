<li>
  <div class="sl-site-item">
    <a href="{{ full_url }}" rel="alternate" title="{{ link_title }}" class="sl-site-link">
      <div class="sl-site-img sl-ico">
        <img src="{{ thumb_url }}" alt="{{ img_alt }}" title="{{ img_alt }}">
      </div>
      <p class="sl-site-title">{{ site_label }}: {{ site_name }}</p>
    </a>
    <b class="sl-ico sl-rate-sites" title="{{ rating_label }}">{{ rating }}</b>
  </div>
</li>
