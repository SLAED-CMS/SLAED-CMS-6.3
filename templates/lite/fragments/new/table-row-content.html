<tr class="sl-table-row"{% if id %} id="{{ id }}"{% endif %}><td class="sl-table-cell sl-table-col-num"><a href="#{{ id }}" title="{{ id }}" class="sl_pnum">{{ id }}</a></td><td class="sl-table-cell">{% if title_new %}{{{ title_new }}} {% endif %}<a href="{{{ href }}}" title="{{ title_attr }}">{{ title_text }}</a>{{{ tip }}}</td><td class="sl-table-cell">{% if is_moder %}<nav class="sl_menu"><ul><li><span class="sl_but_red">{{ editor }}</span><ul><li><a href="{{{ edit_href }}}" title="{{ edit_text }}">{{ edit_text }}</a></li><li><a href="{{{ delete_href }}}" OnClick="return DelCheck(this, '{{{ delete_ask }}}');" title="{{ delete_text }}">{{ delete_text }}</a></li></ul></li></ul></nav>{% endif %}</td></tr>
