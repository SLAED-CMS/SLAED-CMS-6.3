<dialog class="sl-modal" id="sl-confirm" aria-label="{{ _CONFIRM }}">
  <div class="sl-modal-body">
    <div class="sl-font sl-modal-title"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> {{ _CONFIRM }}</div>
    <button type="button" class="sl-but-mini sl-modal-close" data-sl-close title="{{ _CLOSE }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    <p data-sl-confirm-text></p>
    <div class="sl-modal-foot">
      <button type="button" class="sl-chip sl-chip-neutral sl-live-act" data-sl-close>{{ _NO }}</button>
      <button type="button" class="sl-chip sl-chip-danger sl-live-act" data-sl-confirm-ok>{{ _YES }}</button>
    </div>
  </div>
</dialog>
