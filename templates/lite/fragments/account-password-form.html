{{{ info_html }}}<form action="index.php?name={{ name }}" method="post"><table class="sl_table_form">
<tr><td>{{ lbl_newpass }}:</td><td><input type="password" name="newpass" maxlength="25" class="sl-field" placeholder="{{ lbl_newpass }}" required></td></tr>
<tr><td>{{ lbl_newpass2 }}:</td><td><input type="password" name="newpass2" maxlength="25" class="sl-field" placeholder="{{ lbl_newpass2 }}" required></td></tr>
<tr><td>{{ lbl_oldpass }}:</td><td><input type="password" name="oldpass" maxlength="25" class="sl-field" placeholder="{{ lbl_oldpass }}" required></td></tr>
<tr><td colspan="2" class="sl_center"><input type="hidden" name="token" value="{{ token }}"><input type="hidden" name="op" value="savepass"><input type="submit" value="{{ submit_label }}" class="sl_but_blue"></td></tr>
</table></form>
