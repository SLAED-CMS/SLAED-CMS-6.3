<tr class="forum-line">
	<td class="fl-col-icon">{%icon%}</td>
	<td class="fl-col-content">
		<h4>{%link%}</h4>
		<p class="forum-description">{%desc%}</p>
	</td>
	<td class="fl-col-stat">{%topics%}</td>
	<td class="fl-col-stat">{%posts%}</td>
	<td class="fl-col-last">
		<ul class="forum-last">
			<li>{%date%}</li>
			<li>{%last_topic%}</li>
			<li>{%last_post%} {%last_link%}</li>
		</ul>
	</td>
</tr>
