<form name="form" class="sl-calculator-form">
	<table class="sl-table-form">
		<tr>
			<td>{{ from_label }}: <input type="number" name="a" class="sl-field sl-calculator-field"> EUR</td>
			<td>{{ to_label }} <input name="total" class="sl-field sl-calculator-field"> {{ to_cur }}</td>
			<td><input type="button" value="{{ btn_label }}" class="sl-but-blue" OnClick="{{ fn_name }}(this.form)"></td>
		</tr>
	</table>
</form>
