{% if content or icon or subtitle %}
<div class="basecont">
    <div class="bpad">
        <div class="headmodule">
            {% if icon %}<span class="lcolomn"><img src="templates/admin/images/admin/{{ icon }}" title="{{ title }}" alt="{{ title }}"></span>{% endif %}
            <div class="rcolomn"><h1>{{ title }}</h1>{{{ subtitle }}}</div>
            <div class="clr"></div>
        </div>
        <br>
        {{{ content }}}
    </div>
</div>
{% elseif title and is_level_two %}
<h2>{{ title }}</h2>
{% elseif title %}
<h3 class="sl-title">{{ title }}</h3>
{% endif %}
