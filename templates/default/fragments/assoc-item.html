<li class="sl-assoc-item">
<a href="{{{ href }}}" title="{{ title_attr }}" class="sl-assoc-img" style="background-image: url({{ img_src }});"></a>
<b><a href="{{{ href }}}" title="{{ title_attr }}">{{ title_text }}</a></b>
<p>{{{ text }}}</p>
<ul class="sl-assoc-meta"><li>{% if date_text %}<time datetime="{{ date_iso }}" title="{{ date_label }}" class="sl_date">{{ date_text }}</time>{% endif %}</li></ul>
</li>
