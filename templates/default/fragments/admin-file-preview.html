{% if show_image %}<div OnClick="{{ toggle_onclick }}" class="sl_drop sl_preview_mini" style="background-image: url({{{ image_url }}});" title="{{ image_title }}"><span id="{{ preview_id }}" class="sl_drop-form"><img src="{{{ image_url }}}" alt="{{ image_title }}" title="{{ image_title }}"></span></div>{% else %}<div class="sl_preview_mini" style="background-image: url(templates/admin/images/admin/no.png);" title="{{ no_title }}"></div>{% endif %}
