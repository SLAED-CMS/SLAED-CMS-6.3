<div class="forum-post">
	<div class="forum-post-in clrfix">
		<div class="fp-right">
			<div class="fp-meta">
				<span class="grey">{%date%} {%ip%} {%title%}</span>
			</div>
			<div class="entry-content">{%text%}<small>{%sig%}</small></div>
			<div class="fp-moder">{%btn_profile%}{%btn_web%}{%btn_edit%}</div>
		</div>
		<div class="fp-left">
			<div class="fp-nickname dropdown dropup">
				<a OnClick="HideShow(&#039;m-form&#039;, &#039;blind&#039;, &#039;down&#039;, 500);"><b>{%username%}</b></a>
				<div id="m-form" class="dropdown-form">
					<ul class="list-text">
						<li>{%group%}</li>
						<li>{%points%}</li>
						<li>{%regdate%}</li>
						<li>{%gender%}</li>
						<li>{%from%}</li>
						<li>{%warn%}</li>
					</ul>
				</div>
			</div>
			<a title="{%username%}" class="sl_avatar" style="background-image: url({%avatar%});"></a>
			<div class="min-rate">
				<div class="rate-like-box">{%user_rate%}</div>
			</div>
			<ul class="fp-user-info">
				<li><b>{%rank%}</b></li>
				<li>{%rank_link%}</li>
			</ul>
		</div>
	</div>
</div>
