<div class="commit" style="background: {%background%}">
    <div class="commit-header">
        <strong>{%subject%}</strong>
        <code>{%hash%}</code>
    </div>
    <div class="commit-meta">
        <strong>{%label_author%}:</strong> {%author%} &lt;{%email%}&gt; | <strong>{%label_date%}:</strong> {%date%}
    </div>
    {%body%}
    {%stats%}
</div>
