<span class="sl-icon-picker">
  <span class="sl-ico"><i class="bi bi-{{ value_attr }}" data-sl-icon-preview></i></span>
  <input type="text" name="{{ name_attr }}" value="{{ value_attr }}" maxlength="64" class="sl-select-config" placeholder="{{ placeholder_text }}" data-sl-icon-input>
  <button type="button" class="sl-but" title="{{ button_label }}" data-sl-icon-open><i class="bi bi-grid-3x3-gap"></i> {{ button_label }}</button>
</span>
