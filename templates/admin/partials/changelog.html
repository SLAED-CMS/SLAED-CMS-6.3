<div class="chlog-wrapper">
    <!-- Filter Form -->
    <form action="{{ aroute }}.php" method="get" class="chlog-filter">
        <h3>{{ txt_filter_heading }}</h3>
        <input type="hidden" name="name" value="changelog">

        <div class="chlog-filter-grid">
            <div class="chlog-filter-field">
                <label for="search">{{ txt_search_label }}:</label>
                <input type="text" id="search" name="search" value="{{ search }}" placeholder="{{ txt_search_placeholder }}">
            </div>

            <div class="chlog-filter-field">
                <label for="author">{{ txt_author_label }}:</label>
                <input type="text" id="author" name="author" value="{{ author }}" placeholder="{{ txt_author_placeholder }}">
            </div>

            <div class="chlog-filter-field">
                <label for="file">{{ txt_file_label }}:</label>
                <input type="text" id="file" name="file" value="{{ file }}" placeholder="{{ txt_file_placeholder }}">
            </div>

            <div class="chlog-filter-field">
                <label for="datefrom">{{ txt_datefrom_label }}:</label>
                <input type="date" id="datefrom" name="datefrom" value="{{ datefrom }}">
            </div>

            <div class="chlog-filter-field">
                <label for="dateto">{{ txt_dateto_label }}:</label>
                <input type="date" id="dateto" name="dateto" value="{{ dateto }}">
            </div>
        </div>

        <div class="chlog-filter-actions">
            <button type="submit" class="chlog-btn chlog-btn-primary">{{ txt_filter_btn }}</button>
            <button type="button" class="chlog-btn chlog-btn-secondary" onclick="window.location.href='{{ aroute }}.php?name=changelog'">{{ txt_reset_btn }}</button>
        </div>
    </form>

    <!-- Results Header -->
    <div class="chlog-results">
        <div class="chlog-results-info">
            <strong>{{ txt_total }}:</strong> {{ totcount }} {{ txt_commits_repo }} |
            <strong>{{ txt_filtered }}:</strong> {{ totcom }} {{ txt_commits }} |
            <strong>{{ txt_page }}:</strong> {{ page }} / {{ totpage }}
        </div>
    </div>

    <!-- Commits List -->
    <div class="chlog-commits">
        {{{ commits }}}
    </div>

    <!-- Pagination -->
    <div class="chlog-pagination">
        {{{ paging }}}
    </div>
</div>
