<dialog class="sl-modal sl-modal-lg" id="sl-icon-window" aria-labelledby="sl-icon-window-name">
  <div class="sl-modal-title">
    <i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>
    <span class="sl-modal-cap"><strong id="sl-icon-window-name">{{ title_text }}</strong></span>
    <span class="sl-modal-acts"><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ close_text }}" aria-label="{{ close_text }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
  </div>
  <div class="sl-modal-bar">
    <nav class="sl-icon-modal-tabs">
      <button type="button" class="sl-is-active" data-sl-icon-source="bi">Bootstrap Icons</button>
    </nav>
    <input type="search" class="sl-select-config" placeholder="{{ search_text }}" aria-label="{{ search_text }}" data-sl-icon-search data-sl-focus>
  </div>
  <div class="sl-modal-body sl-modal-body-flush">
    <div class="sl-icon-modal-grid notranslate" translate="no" data-sl-icon-grid></div>
  </div>
</dialog>
