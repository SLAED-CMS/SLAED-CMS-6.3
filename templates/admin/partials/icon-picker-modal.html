<dialog class="sl-icon-modal" id="sl_icon_modal">
  <div class="sl-icon-modal-head">
    <nav class="sl-icon-modal-tabs">
      <button type="button" class="sl-is-active" data-sl-icon-source="bi">Bootstrap Icons</button>
    </nav>
    <input type="search" class="sl-select-config" placeholder="{{ search_text }}" data-sl-icon-search>
    <button type="button" class="sl-icon-modal-close" title="{{ close_text }}" data-sl-icon-close><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="sl-icon-modal-grid" data-sl-icon-grid></div>
</dialog>
