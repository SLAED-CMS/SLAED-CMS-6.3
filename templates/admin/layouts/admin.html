<!doctype html>
<html lang="{{ lang }}">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
{{{ meta }}}
{{{ links }}}
{{{ scripts }}}
</head>
<body>
    <div class="wrapper sl-admin-shell">
        <div class="wraptop"></div>
        <div class="wrapmid">
            <div class="header sl-admin-header">
                <div class="sl-admin-brand"><h1><a href="//slaed.net" target="_blank" class="thide" title="SLAED CMS">SLAED CMS</a></h1></div>
                <div class="sl-admin-toolbar">
                    <div class="toolbar">
                        <div>
                            <ul class="reset">{{{ menu }}}</ul>
                            <span class="language sl-admin-language">{{{ admin_langs }}}</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sl-admin-main">
                <aside class="sl-admin-sidebar">{{{ admin_blocks }}}</aside>
                <main class="sl-admin-content">{% block content %}{% endblock %}</main>
            </div>
            <div class="footer sl-admin-footer">
                <div class="copyright">{% if time_html %}{{{ time_html }}}<br>{% endif %}{{{ license }}}</div>
                <span>{{{ foot_html }}}</span>
            </div>
        </div>
        <div class="wrapfoot"></div>
        {{{ debug_html }}}
    </div>
</body>
</html>
