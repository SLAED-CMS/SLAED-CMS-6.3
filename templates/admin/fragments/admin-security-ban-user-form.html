<form action="{{ route }}.php?name=security" method="post"><table class="sl_table_form"><tr><td>{{ name_label }}</td><td>{{{ name_html }}}</td></tr><tr><td>{{ time_label }}</td><td><input type="number" name="time" value="{{ time_value }}" class="sl_form" placeholder="{{ time_label }}" required></td></tr><tr><td>{{ info_label }}</td><td><textarea name="info" cols="65" rows="5" class="sl_form" placeholder="{{ info_placeholder }}" required>{{ info_value }}</textarea></td></tr><tr><td>{{ mail_label }}</td><td><input type="checkbox" name="mail" value="1" OnClick="CloseOpen('{{ cookie_id }}', 0);"{{{ check_attr }}}></td></tr><tr><td colspan="2"><div id="{{ cookie_id }}" class="data" data-all='{"id": "{{ cookie_id }}"}'><table class="sl_table_form"><tr><td>{{ mailtext_label }}<div class="sl_small">{{ mailtext_hint }}</div></td><td>{{{ mailtext_html }}}</td></tr></table></div></td></tr><tr><td colspan="2" class="sl_center"><input type="hidden" name="op" value="bansave"><input type="hidden" name="id" value="4"><input type="submit" value="{{ add_label }}" class="sl_but_blue"></td></tr></table></form>
