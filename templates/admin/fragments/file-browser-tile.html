<div class="sl-fm-cell" data-sl-fm-file="{{ pick_value }}"{% if is_dir %} data-sl-fm-dir="{{ pick_value }}"{% endif %}{% if is_move %} draggable="true"{% endif %}>
  {% if is_mark %}<label class="sl-fm-pick"><input type="checkbox" value="{{ pick_value }}" aria-label="{{ mark_text }}" data-sl-fm-mark></label>{% endif %}
  <a class="sl-fm-tile" href="{{ url }}" hx-get="{{ url }}" hx-target="{% if is_dir %}#slfmbody{% else %}#slfmside{% endif %}" hx-swap="innerHTML" hx-push-url="false" title="{{ hint_text }}" data-sl-fm-pick>
    <span class="sl-fm-tile-img sl-fm-thumb-{{ tone }}">
      {% if image_url %}<img src="{{ image_url }}" alt="{{ name }}" loading="lazy">{% else %}<i class="bi bi-{{ icon }}" aria-hidden="true"></i>{% endif %}
    </span>
    <span class="sl-fm-tile-kind">{{ kind_text }}</span>
    <span class="sl-fm-tile-cap"><b>{{ name }}</b><small>{{ size_text }} · {{ day_text }}</small></span>
  </a>
  {% if full_url %}<button type="button" class="sl-but-mini sl-fm-tile-shot" title="{{ shot_text }}" aria-label="{{ shot_text }}" data-sl-fm-show data-sl-fm-file="{{ pick_value }}" data-sl-fm-name="{{ name }}" data-sl-fm-img="{{ full_url }}" data-sl-fm-info="{{ info_url }}" data-sl-fm-down="{{ down_url }}"><i class="bi bi-zoom-in" aria-hidden="true"></i></button>{% endif %}
  {{{ acts_html }}}
</div>
