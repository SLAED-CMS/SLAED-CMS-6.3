<span class="sl-move-controls">
	{% if up_query %}<a href="index.php?{{{ up_query }}}" hx-get="index.php?{{{ up_query }}}" hx-target="#rep{{ target }}" hx-swap="innerHTML" hx-push-url="false" title="{{ up_title }}" class="sl-bl-up"></a>{% endif %}
	{% if down_query %}<a href="index.php?{{{ down_query }}}" hx-get="index.php?{{{ down_query }}}" hx-target="#rep{{ target }}" hx-swap="innerHTML" hx-push-url="false" title="{{ down_title }}" class="sl-bl-down"></a>{% endif %}
</span>
