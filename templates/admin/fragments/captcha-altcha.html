<script {{{ script_attr }}} src="{{ script_src }}"></script>
<div class="sl-captcha">
  <altcha-widget
    challengeurl="{{ challengeurl }}"
    name="{{ field_name }}"
    auto="onsubmit"
    {% if strings_attr %}strings="{{ strings_attr }}"{% endif %}
    hidefooter
  ></altcha-widget>
  <input type="text" name="{{ hp_name }}" value="" class="sl-captcha-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="{{ ts_name }}" value="{{ ts_value }}">
</div>
