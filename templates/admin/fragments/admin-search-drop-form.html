<form id="drop{{ form_id }}" action="{{ action_url }}" method="post" style="display:none"><input type="hidden" name="op" value="drop"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="sort" value="{{ sort }}"><input type="hidden" name="order" value="{{ order }}"><input type="hidden" name="num" value="{{ num }}"><input type="hidden" name="find" value="{{ find }}"><input type="hidden" name="fmod" value="{{ fmod }}"><input type="hidden" name="token" value="{{ token }}"></form><a href="#" OnClick="if (DelCheck(this, '{{ confirm_text }}')) document.getElementById('drop{{ form_id }}').submit(); return false;" title="{{ title }}">{{ label }}</a>
