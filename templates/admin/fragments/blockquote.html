{% if is_callout %}
  <div class="sl-callout-{{ callout_type }}">{{{ content_html }}}</div>
{% elseif is_hide %}
  <blockquote class="sl-hide"><p title="{{ title_text }}">{{{ content_html }}}</p></blockquote>
{% elseif is_quote %}
  <blockquote><p title="{{ title_text }}">{{{ content_html }}}</p></blockquote>
{% else %}
  <blockquote>{{{ content_html }}}</blockquote>
{% endif %}
