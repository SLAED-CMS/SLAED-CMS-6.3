<li class="sl-tabs-item">
  <a
    href="{% if href %}{{ href }}{% else %}#{% endif %}"
    {% if rel %}data-sl-tab-target="{{ rel }}"{% endif %}
    {% if title %}title="{{ title }}"{% endif %}
    class="sl-tabs-link{% if is_active %} sl-is-active{% endif %}"
    {% if rel %}data-sl-tab-link{% endif %}
    {% if link_attr %}{{{ link_attr }}}{% endif %}
  >{% if label_html %}{{{ label_html }}}{% else %}{{ label }}{% endif %}</a>
</li>
