<dialog class="sl-modal sl-modal-sm sl-modal-danger" id="sl-confirm" aria-labelledby="sl-confirm-name">
  <div class="sl-modal-title">
    <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
    <span class="sl-modal-cap"><strong id="sl-confirm-name">{{ _CONFIRM }}</strong></span>
    <span class="sl-modal-acts"><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ _CLOSE }}" aria-label="{{ _CLOSE }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
  </div>
  <div class="sl-modal-body">
    <p data-sl-confirm-text></p>
  </div>
  <div class="sl-modal-foot">
    <button type="button" class="sl-modal-btn" data-sl-close data-sl-focus>{{ _NO }}</button>
    <button type="button" class="sl-modal-btn sl-modal-btn-main" data-sl-confirm-ok>{{ _YES }}</button>
  </div>
</dialog>
