<div
  {% if id %}id="{{ id }}"{% endif %}
  class="
    sl-div-item
    {% if is_full %} sl-div-item-full{% endif %}
    {% if row_class %} {{ row_class }}{% endif %}
    {% if is_hidden %} sl-hidden{% endif %}
    {% if is_lang_edit %} sl-lang-edit-row{% endif %}
    {% if is_ratings_inner %} sl-ratings-inner-row{% endif %}
  "
  {% if attr %}{{{ attr }}}{% endif %}
>
  <div class="sl-div-label">{{{ label_html }}}</div>
  {% if field_unwrapped %}
    {% if has_field_text %}{{ field_text }}{% else %}{{{ field_html }}}{% endif %}
  {% else %}
    <div class="sl-div-field">{% if has_field_text %}{{ field_text }}{% else %}{{{ field_html }}}{% endif %}</div>
  {% endif %}
</div>
