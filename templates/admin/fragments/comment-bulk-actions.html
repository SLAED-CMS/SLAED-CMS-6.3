<div class="sl-div-grid">
    <div class="sl-div-item">
        <div class="sl-div-label">{{ label }}:</div>
        <div class="sl-div-field">
            <select name="op">
                <option value="{{ activate_value }}">{{ activate_label }}</option>
                <option value="{{ delete_value }}">{{ delete_label }}</option>
            </select>
            <input type="hidden" name="refer" value="{{ refer_value }}">
            <input type="submit" value="{{ submit_label }}" class="sl-but-blue">
        </div>
    </div>
</div>
