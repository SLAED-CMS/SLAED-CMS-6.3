<table id="{{ row_id }}"{% if is_hidden %} class="sl_none"{% endif %}><tr><td><a OnClick="HideShow('{{ next_id }}', 'slide', 'up', 500);" title="{{ add_label }}" class="sl_plus">{{ warn_label }} - {{ index_text }}:</a></td><td><input type="text" name="warn[]" value="{{ warn_value }}" class="sl_form" placeholder="{{ warn_label }} - {{ index_text }}"></td></tr></table>
