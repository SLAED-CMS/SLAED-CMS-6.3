<dialog class="sl-modal sl-modal-sm" id="sl-settings" aria-labelledby="sl-settings-name">
  <div class="sl-modal-title">
    <i class="bi bi-sliders" aria-hidden="true"></i>
    <span class="sl-modal-cap"><strong id="sl-settings-name">{{ _FUNCTIONS }}</strong></span>
    <span class="sl-modal-acts"><button type="button" class="sl-modal-act sl-modal-act-close" data-sl-close title="{{ _CLOSE }}" aria-label="{{ _CLOSE }}"><i class="bi bi-x-lg" aria-hidden="true"></i></button></span>
  </div>
  <div class="sl-modal-body">{{{ rows }}}</div>
</dialog>
