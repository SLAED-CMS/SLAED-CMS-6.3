<form name="form" class="sl-money-calc-form">
    <table class="sl-table-form">
        <tr>
            <td>{{ from_label }}: <input type="number" name="a" style="width: 65px;" class="sl-field"> EUR</td>
            <td>{{ to_label }} <input name="total" style="width: 65px;" class="sl-field"> {{ to_cur }}</td>
            <td><input type="button" value="{{ btn_label }}" class="sl-but-blue" OnClick="{{ fn_name }}(this.form)"></td>
        </tr>
    </table>
</form>
