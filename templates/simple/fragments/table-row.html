<tr class="sl-table-row"{% if id %} id="{{ id }}"{% endif %}>{% if cells_html %}{{{ cells_html }}}{% else %}<td class="sl-table-cell sl-table-col-num"><a href="#{{ id }}" title="{{ id }}" class="sl_pnum">{{ id }}</a></td><td class="sl-table-cell">{% if title_new %}{{{ title_new }}} {% endif %}<a href="{{{ title_href }}}" title="{{ title_attr }}">{{ title_text }}</a></td><td class="sl-table-cell">{% if category_href %}<a href="{{{ category_href }}}" title="{{ category_attr }}">{{ category_text }}</a>{% else %}{{ category_text }}{% endif %}</td><td class="sl-table-cell">{{{ post_text }}}</td><td class="sl-table-cell"><time datetime="{{ time_iso }}" title="{{ time_label }}" class="sl_date">{{ time_text }}</time></td>{% endif %}</tr>
