<!doctype html>
<html lang="ru" data-sl-theme="day" data-sl-fx="slow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLAED Gradient Flow 2026</title>
<link rel="stylesheet" href="../templates/admin/assets/vendor/bootstrap/css/bootstrap-icons.min.css">
<style>
:root {
  --sl-page: #eef4f9;
  --sl-panel: #ffffff;
  --sl-soft: #f3f8fb;
  --sl-muted-bg: #f7fafc;
  --sl-line: #d9e5ee;
  --sl-line-hard: #b8cfdd;
  --sl-text: #1d3446;
  --sl-head: #082031;
  --sl-mute: #64798c;
  --sl-blue: #0783bd;
  --sl-blue-hot: #109fdd;
  --sl-green: #2aa747;
  --sl-green-soft: #e4f5e6;
  --sl-orange: #dc7a00;
  --sl-orange-soft: #fdf1dd;
  --sl-red: #d63a3a;
  --sl-glow: rgba(16, 159, 221, 0.2);
  --sl-shadow: 0 1px 4px rgba(24, 62, 90, 0.09);
  --sl-shadow-hover: 0 10px 24px rgba(24, 62, 90, 0.16);
  --sl-card-grad: linear-gradient(180deg, #ffffff 0%, #f5f9fc 100%);
  --sl-rainbow: linear-gradient(115deg, #ff3d6e, #ff9f1c 28%, #9dff57 48%, #00d4ff 68%, #a855f7 88%, #ff3d6e);
  --sl-speed: 2.8s;
}
html[data-sl-fx="fast"] { --sl-speed: 0.55s; }
html[data-sl-theme="night"] {
  --sl-page: #0a1017;
  --sl-panel: #101b27;
  --sl-soft: #0c1622;
  --sl-muted-bg: #0e1925;
  --sl-line: #1e3245;
  --sl-line-hard: #33526c;
  --sl-text: #c6dae8;
  --sl-head: #eff8fe;
  --sl-mute: #7690a5;
  --sl-blue: #38b2e4;
  --sl-blue-hot: #4cc4ff;
  --sl-green: #4ecb74;
  --sl-green-soft: #12301c;
  --sl-orange: #f5a53a;
  --sl-orange-soft: #33230c;
  --sl-red: #ff6d6d;
  --sl-glow: rgba(76, 196, 255, 0.16);
  --sl-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  --sl-shadow-hover: 0 14px 30px rgba(0, 0, 0, 0.5);
  --sl-card-grad: linear-gradient(180deg, #111d2b 0%, #0d1723 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--sl-page);
  color: var(--sl-text);
  font: 14px/1.5 "Segoe UI", Tahoma, Arial, sans-serif;
  transition: background-color 0.3s ease;
}
button { font: inherit; }
a { text-decoration: none; }

/* rainbow text helper: gradient flows through glyphs */
@keyframes sl-flow { 0% { background-position: 0% 50%; } 100% { background-position: 260% 50%; } }
@keyframes sl-hue { to { filter: hue-rotate(360deg); } }
.sl-rainbow-text {
  background: var(--sl-rainbow);
  background-size: 260% 260%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: sl-flow var(--sl-speed) linear infinite;
}

/* ---------- header ---------- */
.sl-top {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--sl-line);
  background: color-mix(in srgb, var(--sl-panel) 88%, transparent);
  backdrop-filter: blur(10px);
}
.sl-logo { font-size: 19px; font-weight: 800; letter-spacing: 2px; color: var(--sl-head); cursor: default; }
.sl-logo:hover { background: var(--sl-rainbow); background-size: 260% 260%; background-clip: text; -webkit-background-clip: text; color: transparent; animation: sl-flow var(--sl-speed) linear infinite; }
.sl-nav { display: flex; gap: 2px; }
.sl-nav a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 33px;
  padding: 0 12px;
  border-radius: 9px;
  color: var(--sl-text);
  font-size: 13px;
  font-weight: 600;
  transition: background-color 0.18s ease;
}
.sl-nav a .bi { font-size: 15px; color: var(--sl-blue); }
.sl-nav a:hover { background: var(--sl-soft); }
.sl-nav a:hover .bi, .sl-nav a:hover b {
  background: var(--sl-rainbow);
  background-size: 260% 260%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: sl-flow var(--sl-speed) linear infinite;
}
.sl-nav a.sl-on { background: var(--sl-blue); color: #fff; }
.sl-nav a.sl-on .bi { color: #fff; }
.sl-top-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }

/* effect switcher */
.sl-fxswitch { display: flex; align-items: center; gap: 5px; }
.sl-fxswitch b { color: var(--sl-mute); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-right: 3px; }
.sl-fxswitch button {
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--sl-line);
  border-radius: 999px;
  background: transparent;
  color: var(--sl-mute);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
}
.sl-fxswitch button:hover { border-color: var(--sl-blue); color: var(--sl-blue); }
.sl-fxswitch button.sl-on { background: var(--sl-blue); border-color: var(--sl-blue); color: #fff; box-shadow: 0 3px 10px var(--sl-glow); }
.sl-iconbtn {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--sl-line-hard);
  border-radius: 10px;
  background: var(--sl-panel);
  color: var(--sl-text);
  font-size: 15px;
  cursor: pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
}
.sl-iconbtn:hover { border-color: var(--sl-blue); box-shadow: 0 0 0 3px var(--sl-glow); transform: translateY(-1px); }

/* ---------- layout ---------- */
.sl-wrap { max-width: 1360px; margin: 0 auto; padding: 15px 18px 120px; display: grid; gap: 15px; }

/* KPI strip */
.sl-kpis { display: flex; flex-wrap: wrap; gap: 9px; }
.sl-kpi {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--sl-line);
  border-radius: 999px;
  background: var(--sl-panel);
  box-shadow: var(--sl-shadow);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--sl-mute);
  transition: transform 0.16s ease, border-color 0.2s ease;
}
.sl-kpi:hover { transform: translateY(-2px); border-color: var(--sl-line-hard); }
.sl-kpi .bi { font-size: 14px; color: var(--sl-blue); }
.sl-kpi:hover .bi { animation: sl-hue var(--sl-speed) linear infinite; }
.sl-kpi b { color: var(--sl-head); font-variant-numeric: tabular-nums; }
.sl-kpi.sl-crit { border-color: color-mix(in srgb, var(--sl-red) 50%, var(--sl-line)); }
.sl-kpi.sl-crit .bi, .sl-kpi.sl-crit b { color: var(--sl-red); }

/* ---------- panel ---------- */
.sl-panel {
  border: 1px solid var(--sl-line);
  border-radius: 12px;
  background: var(--sl-panel);
  box-shadow: var(--sl-shadow);
  overflow: hidden;
}
.sl-panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--sl-line);
  color: var(--sl-head);
  font-weight: 700;
}
.sl-panel-head .bi { font-size: 16px; color: var(--sl-blue); }
.sl-panel-head:hover > .bi { animation: sl-hue var(--sl-speed) linear infinite; }
.sl-panel-head .sl-sp { margin-left: auto; }
.sl-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 11px;
  border: 1px solid var(--sl-line);
  border-radius: 999px;
  background: var(--sl-soft);
  color: var(--sl-mute);
  font-size: 11.5px;
  font-weight: 700;
}

/* ---------- module cards (style from the reference screenshot) ---------- */
.sl-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 11px; padding: 13px 14px; }
.sl-card {
  position: relative;
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  min-height: 112px;
  padding: 11px;
  border: 1px solid var(--sl-line);
  border-radius: 10px;
  background: var(--sl-card-grad);
  box-shadow: var(--sl-shadow);
  transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  overflow: hidden;
}
/* animated rainbow hairline on top, flows on hover */
.sl-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--sl-rainbow);
  background-size: 260% 100%;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.sl-card:hover::before { opacity: 1; animation: sl-flow var(--sl-speed) linear infinite; }
.sl-card:hover {
  border-color: color-mix(in srgb, var(--sl-blue) 45%, var(--sl-line));
  box-shadow: var(--sl-shadow-hover);
  transform: translateY(-3px);
}
.sl-card-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 54px;
  height: 54px;
  border: 1px solid var(--sl-line);
  border-radius: 10px;
  background: var(--sl-panel);
  transition: border-color 0.2s ease;
}
.sl-card-ico img { width: 40px; height: 40px; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease; }
/* icon effect modes: slow/fast = rainbow ring + flow; hue = hue-rotate spin */
html[data-sl-fx="slow"] .sl-card:hover .sl-card-ico,
html[data-sl-fx="fast"] .sl-card:hover .sl-card-ico {
  border-color: transparent;
  background:
    linear-gradient(var(--sl-panel), var(--sl-panel)) padding-box,
    var(--sl-rainbow) border-box;
  background-size: 100% 100%, 260% 260%;
  animation: sl-flow var(--sl-speed) linear infinite;
}
html[data-sl-fx="hue"] .sl-card:hover .sl-card-ico img { animation: sl-hue var(--sl-speed) linear infinite; }
.sl-card:hover .sl-card-ico img { transform: scale(1.12); }
.sl-card-body { min-width: 0; }
.sl-card-body strong {
  display: block;
  overflow: hidden;
  color: var(--sl-blue);
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sl-card:hover .sl-card-body strong {
  background: var(--sl-rainbow);
  background-size: 260% 260%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: sl-flow var(--sl-speed) linear infinite;
}
.sl-card-body > span { display: block; margin-top: 4px; overflow: hidden; color: var(--sl-mute); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.sl-status {
  position: relative;
  display: block;
  margin-top: 8px;
  padding: 4px 11px;
  border-radius: 7px;
  background: var(--sl-green-soft);
  color: var(--sl-green);
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
}
.sl-status.sl-warn { background: var(--sl-orange-soft); color: var(--sl-orange); }
.sl-status::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.5) 50%, transparent 70%);
  transform: translateX(-110%);
}
.sl-card:hover .sl-status::after { animation: sl-sweep calc(var(--sl-speed) / 2) ease infinite; }
html[data-sl-theme="night"] .sl-status::after { background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.13) 50%, transparent 70%); }
@keyframes sl-sweep { to { transform: translateX(110%); } }
.sl-acts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
.sl-acts a { display: inline-flex; align-items: center; gap: 5px; color: var(--sl-blue); font-size: 12.5px; }
.sl-acts a .bi { font-size: 13px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.sl-acts a:hover { text-decoration: underline; }
.sl-acts a:hover .bi { transform: scale(1.3) rotate(-8deg); }

/* per-card speed dial (horizontal, top-right) */
.sl-dial { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: row-reverse; align-items: center; gap: 5px; }
.sl-dial-toggle, .sl-dial-item {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 1px solid var(--sl-line-hard);
  border-radius: 999px;
  background: var(--sl-panel);
  color: var(--sl-mute);
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.sl-dial-toggle:hover, .sl-dial-item:hover { border-color: var(--sl-blue); color: var(--sl-blue); transform: scale(1.12); }
.sl-dial.sl-open .sl-dial-toggle { background: var(--sl-blue); border-color: var(--sl-blue); color: #fff; transform: rotate(90deg); }
.sl-dial-item { opacity: 0; transform: translateX(10px) scale(0.5); pointer-events: none; }
.sl-dial.sl-open .sl-dial-item { opacity: 1; transform: none; pointer-events: auto; }
.sl-dial.sl-open .sl-dial-item:nth-child(2) { transition-delay: 0.04s; }
.sl-dial.sl-open .sl-dial-item:nth-child(3) { transition-delay: 0.09s; }
.sl-dial.sl-open .sl-dial-item:nth-child(4) { transition-delay: 0.14s; }
.sl-dial-item:hover .bi { animation: sl-hue var(--sl-speed) linear infinite; }

/* ---------- blocks panel: same card language, position rows ---------- */
.sl-blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 11px; padding: 13px 14px; }

/* ---------- global speed dial (FAB, bottom-right) ---------- */
.sl-fab-wrap { position: fixed; right: 20px; bottom: 20px; z-index: 80; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 10px; }
.sl-fab {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(140deg, var(--sl-blue), var(--sl-blue-hot));
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 8px 22px color-mix(in srgb, var(--sl-blue) 45%, transparent);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
}
.sl-fab:hover { transform: scale(1.08); }
.sl-fab .bi { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.sl-fab-wrap.sl-open .sl-fab .bi { transform: rotate(135deg); }
.sl-fab-wrap.sl-open .sl-fab { background: linear-gradient(140deg, var(--sl-red), #ff7d5c); box-shadow: 0 8px 22px color-mix(in srgb, var(--sl-red) 40%, transparent); }
.sl-fab-item { display: inline-flex; align-items: center; gap: 9px; opacity: 0; transform: translateY(14px) scale(0.7); pointer-events: none; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
.sl-fab-wrap.sl-open .sl-fab-item { opacity: 1; transform: none; pointer-events: auto; }
.sl-fab-wrap.sl-open .sl-fab-item:nth-child(2) { transition-delay: 0.05s; }
.sl-fab-wrap.sl-open .sl-fab-item:nth-child(3) { transition-delay: 0.1s; }
.sl-fab-wrap.sl-open .sl-fab-item:nth-child(4) { transition-delay: 0.15s; }
.sl-fab-wrap.sl-open .sl-fab-item:nth-child(5) { transition-delay: 0.2s; }
.sl-fab-label {
  padding: 5px 10px;
  border-radius: 7px;
  background: var(--sl-head);
  color: var(--sl-page);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--sl-shadow);
}
.sl-fab-mini {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--sl-line-hard);
  border-radius: 50%;
  background: var(--sl-panel);
  color: var(--sl-blue);
  font-size: 16px;
  cursor: pointer;
  box-shadow: var(--sl-shadow-hover);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease;
}
.sl-fab-mini:hover { transform: scale(1.15); border-color: var(--sl-blue); }
.sl-fab-mini:hover .bi {
  background: var(--sl-rainbow);
  background-size: 260% 260%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: sl-flow 0.55s linear infinite;
}

/* ---------- toasts ---------- */
#sl-toasts { position: fixed; left: 50%; bottom: 20px; z-index: 100; display: grid; gap: 8px; transform: translateX(-50%); }
.sl-toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 16px;
  border: 1px solid var(--sl-line-hard);
  border-radius: 11px;
  background: var(--sl-panel);
  box-shadow: var(--sl-shadow-hover);
  color: var(--sl-head);
  font-size: 13px;
  font-weight: 600;
  animation: sl-toast-in 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
}
.sl-toast .bi { color: var(--sl-green); font-size: 15px; }
@keyframes sl-toast-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .sl-nav { display: none; }
  .sl-fxswitch { order: 5; flex-basis: 100%; }
  .sl-wrap { padding: 12px 10px 120px; }
  .sl-mods, .sl-blocks { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="sl-top">
  <div class="sl-logo">SLAED</div>
  <nav class="sl-nav" aria-label="Меню">
    <a href="#" class="sl-on"><i class="bi bi-house-door"></i><b>Главная</b></a>
    <a href="#"><i class="bi bi-boxes"></i><b>Блоки</b></a>
    <a href="#"><i class="bi bi-grid-3x3-gap"></i><b>Модули</b></a>
    <a href="#"><i class="bi bi-tags"></i><b>Категории</b></a>
  </nav>
  <div class="sl-top-right">
    <div class="sl-fxswitch" id="sl-fxswitch">
      <b>эффект:</b>
      <button type="button" class="sl-on" data-fx="slow">gradient slow</button>
      <button type="button" data-fx="fast">gradient fast</button>
      <button type="button" data-fx="hue">hue rotate</button>
    </div>
    <button class="sl-iconbtn" id="sl-theme" type="button" title="День / ночь"><i class="bi bi-moon-stars"></i></button>
  </div>
</header>

<div class="sl-wrap">

  <div class="sl-kpis" aria-label="Счётчики">
    <span class="sl-kpi sl-crit"><i class="bi bi-shield-exclamation"></i> setup.php <b>риск</b></span>
    <span class="sl-kpi"><i class="bi bi-person-plus"></i> регистрации <b id="sl-k-users">88</b></span>
    <span class="sl-kpi"><i class="bi bi-chat-dots"></i> модерация <b>3</b></span>
    <span class="sl-kpi"><i class="bi bi-briefcase"></i> клиенты <b>10</b></span>
    <span class="sl-kpi"><i class="bi bi-lightning-charge"></i> генерация <b id="sl-k-gen">0.31s</b></span>
    <span class="sl-kpi"><i class="bi bi-eye"></i> онлайн <b id="sl-k-online">7</b></span>
  </div>

  <section class="sl-panel">
    <div class="sl-panel-head">
      <i class="bi bi-grid-3x3-gap"></i> Панель управления модулями
      <span class="sl-sp"></span>
      <span class="sl-chip">наведите на карточку · ⋯ раскрывает мини-действия</span>
    </div>
    <div class="sl-mods" id="sl-mods"></div>
  </section>

  <section class="sl-panel">
    <div class="sl-panel-head">
      <i class="bi bi-boxes"></i> Панель управления блоками
      <span class="sl-sp"></span>
      <span class="sl-chip">тот же карточный язык</span>
    </div>
    <div class="sl-blocks" id="sl-blocks"></div>
  </section>

</div>

<div class="sl-fab-wrap" id="sl-fab">
  <button class="sl-fab" id="sl-fab-toggle" type="button" title="Быстрые действия"><i class="bi bi-plus-lg"></i></button>
  <span class="sl-fab-item"><span class="sl-fab-label">Новость</span><button class="sl-fab-mini" type="button" data-toast="Редактор новости открыт"><i class="bi bi-newspaper"></i></button></span>
  <span class="sl-fab-item"><span class="sl-fab-label">Новый блок</span><button class="sl-fab-mini" type="button" data-toast="Мастер блока запущен"><i class="bi bi-puzzle"></i></button></span>
  <span class="sl-fab-item"><span class="sl-fab-label">Пользователь</span><button class="sl-fab-mini" type="button" data-toast="Форма пользователя открыта"><i class="bi bi-person-plus"></i></button></span>
  <span class="sl-fab-item"><span class="sl-fab-label">Бэкап БД</span><button class="sl-fab-mini" type="button" data-toast="Бэкап поставлен в очередь"><i class="bi bi-cloud-arrow-up"></i></button></span>
</div>

<div id="sl-toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var ICO = '../templates/admin/images/icons/';

  /* theme */
  var root = document.documentElement;
  var themeBtn = document.getElementById('sl-theme');
  function applyTheme(t) {
    root.setAttribute('data-sl-theme', t);
    themeBtn.querySelector('.bi').className = 'bi ' + (t === 'night' ? 'bi-sun' : 'bi-moon-stars');
    try { localStorage.setItem('sl-flow-theme', t); } catch (e) {}
  }
  themeBtn.addEventListener('click', function () {
    applyTheme(root.getAttribute('data-sl-theme') === 'night' ? 'day' : 'night');
  });
  try { var saved = localStorage.getItem('sl-flow-theme'); if (saved) applyTheme(saved); } catch (e) {}

  /* effect switcher: slow / fast / hue */
  document.getElementById('sl-fxswitch').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('sl-on'); });
    b.classList.add('sl-on');
    root.setAttribute('data-sl-fx', b.getAttribute('data-fx'));
  });

  /* toast */
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'sl-toast';
    t.innerHTML = '<i class="bi bi-check2-circle"></i>' + msg;
    document.getElementById('sl-toasts').appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity 0.4s'; }, 2500);
    setTimeout(function () { t.remove(); }, 3000);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-toast]');
    if (b) toast(b.getAttribute('data-toast'));
  });

  /* module cards: reference style + per-card speed dial */
  var mods = [
    ['Конфигурации', 'config · только администраторы', 'emoji_u2699.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-power', 'status']]],
    ['Новости', 'news · все посетители', 'emoji_u1f4f0.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-database-gear', 'sql']]],
    ['Форум', 'forum · пользователи', 'emoji_u1f4ac.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-list-check', 'perms']]],
    ['Магазин', 'shop · все посетители', 'emoji_u1f6d2.svg', 'warn', 'проверить', [['bi-pencil-square', 'edit'], ['bi-arrow-repeat', 'update']]],
    ['Медиа каталог', 'media · отключен', 'emoji_u1f5bc.svg', 'warn', 'disabled', [['bi-power', 'enable'], ['bi-pencil-square', 'edit']]],
    ['Каталог файлов', 'files · все посетители', 'emoji_u1f4c1.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-folder2-open', 'files']]],
    ['Пользователи', 'account · все посетители', 'emoji_u1f465.svg', 'warn', '88 заявок', [['bi-pencil-square', 'edit'], ['bi-person-check', 'approve']]],
    ['Безопасность', 'security · только администраторы', 'emoji_u1f6e1.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-journal-text', 'logs']]],
    ['Статистика', 'statistic · все посетители', 'emoji_u1f4ca.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-graph-up', 'graphs']]]
  ];
  var dial = [['bi-folder2-open', 'Открыть'], ['bi-sliders', 'Настройки'], ['bi-eye', 'Наблюдать']];
  function card(m) {
    var el = document.createElement('article');
    el.className = 'sl-card';
    el.innerHTML = '<span class="sl-card-ico"><img src="' + ICO + m[2] + '" alt=""></span>' +
      '<span class="sl-card-body"><strong>' + m[0] + '</strong><span>' + m[1] + '</span>' +
      '<span class="sl-status' + (m[3] === 'warn' ? ' sl-warn' : '') + '">' + m[4] + '</span>' +
      '<span class="sl-acts">' + m[5].map(function (a) {
        return '<a href="#" data-toast="' + m[0] + ': ' + a[1] + '"><i class="bi ' + a[0] + '"></i> ' + a[1] + '</a>';
      }).join('') + '</span></span>' +
      '<span class="sl-dial"><button class="sl-dial-toggle" type="button" title="Ещё действия"><i class="bi bi-three-dots"></i></button>' +
      dial.map(function (d) {
        return '<button class="sl-dial-item" type="button" title="' + d[1] + '" data-toast="' + m[0] + ': ' + d[1].toLowerCase() + '"><i class="bi ' + d[0] + '"></i></button>';
      }).join('') + '</span>';
    return el;
  }
  var modbox = document.getElementById('sl-mods');
  mods.forEach(function (m) { modbox.appendChild(card(m)); });

  /* blocks panel, same card language */
  var blocks = [
    ['Верхний баннер', 'HTML · все посетители · поз. 1', 'emoji_u1f5bc.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-arrows-move', 'move']]],
    ['Последние сообщения форума', 'файл · все посетители · центр', 'emoji_u1f4ac.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-arrow-repeat', 'refresh']]],
    ['Опрос', 'системный · справа · поз. 6', 'emoji_u1f4ca.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-bar-chart', 'votes']]],
    ['Sape', 'HTML · верхний баннер · поз. 2', 'emoji_u1f517.svg', 'warn', 'отключен', [['bi-power', 'enable'], ['bi-trash3', 'delete']]],
    ['Блок пользователя', 'системный · пользователи', 'emoji_u1f464.svg', 'ok', 'активен', [['bi-pencil-square', 'edit'], ['bi-list-check', 'perms']]],
    ['Реклама шаблонов', 'HTML · по центру вверху · поз. 6', 'emoji_u1f4e3.svg', 'warn', 'проверить', [['bi-pencil-square', 'edit'], ['bi-eye', 'preview']]]
  ];
  var blockbox = document.getElementById('sl-blocks');
  blocks.forEach(function (m) { blockbox.appendChild(card(m)); });

  /* per-card speed dial toggling (one open at a time) */
  document.addEventListener('click', function (e) {
    var tgl = e.target.closest('.sl-dial-toggle');
    document.querySelectorAll('.sl-dial.sl-open').forEach(function (d) {
      if (!tgl || d !== tgl.parentNode) d.classList.remove('sl-open');
    });
    if (tgl) tgl.parentNode.classList.toggle('sl-open');
  });

  /* global speed dial */
  var fab = document.getElementById('sl-fab');
  document.getElementById('sl-fab-toggle').addEventListener('click', function () {
    fab.classList.toggle('sl-open');
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#sl-fab')) fab.classList.remove('sl-open');
  });

  /* light live counters */
  var online = 7, users = 88;
  setInterval(function () {
    if (Math.random() < 0.4) {
      online = Math.max(1, online + (Math.random() < 0.5 ? -1 : 1));
      document.getElementById('sl-k-online').textContent = online;
    }
    if (Math.random() < 0.15) document.getElementById('sl-k-users').textContent = ++users;
    document.getElementById('sl-k-gen').textContent = (0.28 + Math.random() * 0.07).toFixed(2) + 's';
  }, 2500);
})();
</script>
</body>
</html>
