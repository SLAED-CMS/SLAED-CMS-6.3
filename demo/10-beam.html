<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 · Световой луч — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 10 — Light beam. The cheapest of the moving variants: the band is left as it is, and once every eight
       seconds a soft beam crosses it. Wide, low-contrast and slow to fade in, so it reads as light moving
       across the photo rather than a flash. One transform and one opacity, in both themes. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The dial, and the only thing it touches. --demo-dim darkens the photo and nothing else: it runs in the
       dark mode alone, because multiplying by white is a no-op, and at 0 the band is exactly what ships today.
       The effect below never reads the dial, so it lives at every position of it and in both modes. */
    body[class] #head-content,
    body[class] #demo-line {
      background-color: light-dark(#ffffff, color-mix(in srgb, #14293a calc(var(--demo-dim, 0) * 100%), #ffffff));
      background-blend-mode: multiply;
    }

    /* The veil the dial fades in: darker where the headline stands, plus a vignette that gives the band edges.
       The vignette is deliberately shallow — at the fifty per cent this variant now runs at, the earlier
       0.5 stop drew a visible circle in the middle of the band and the beam read as part of it.
       Both stops are transparent in light, so no position of the dial puts a filter on the light theme. */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: var(--demo-dim, 0);
      background:
        linear-gradient(
          100deg,
          light-dark(transparent, rgba(8, 16, 26, 0.92)) 0%,
          light-dark(transparent, rgba(8, 16, 26, 0.55)) 60%,
          light-dark(transparent, rgba(8, 16, 26, 0.8)) 100%
        ),
        radial-gradient(
          170% 240% at 50% 50%,
          transparent 62%,
          light-dark(transparent, rgba(0, 0, 0, 0.22)) 100%
        );
    }

    /* The beam. Soft comes from the seven stops and the lowered peak, not from width: the band is only some
       hundred and twenty pixels tall, so a wide beam stops reading as a shaft of light and turns into a blur
       drifting across. It travels upright: on a band this low a tilt makes the top edge light up before the
       bottom, and that reads as the beam sliding rather than crossing. */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      z-index: 2;
      width: 30%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      background: linear-gradient(
        90deg,
        transparent 0%,
        light-dark(rgba(124, 196, 238, 0.16), rgba(124, 196, 238, 0.12)) 22%,
        light-dark(rgba(160, 214, 244, 0.34), rgba(160, 214, 244, 0.26)) 40%,
        light-dark(rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.36)) 50%,
        light-dark(rgba(160, 214, 244, 0.34), rgba(160, 214, 244, 0.26)) 60%,
        light-dark(rgba(124, 196, 238, 0.16), rgba(124, 196, 238, 0.12)) 78%,
        transparent 100%
      );
      animation: demo-beam 8s linear infinite;
    }

    /* Eight seconds: three and a half of travel at an even pace, four and a half of rest. Linear on purpose —
       an eased pass hurries through the middle of the band, which is the half the eye actually watches. */
    @keyframes demo-beam {
      0% {
        transform: translate3d(0, 0, 0);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      32% {
        opacity: 1;
      }
      44%,
      100% {
        transform: translate3d(480%, 0, 0);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content::after,
      #demo-line::after {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
