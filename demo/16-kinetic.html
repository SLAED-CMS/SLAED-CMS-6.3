<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>16 · Кинетическая типографика — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 16 — Kinetic type. The photograph is not touched at all: what comes alive is the headline. A wave of light
       runs along the letters every six seconds through background-clip: text, and a thread of brand gradient
       wakes up under them. The cheapest way on this page to make the band feel alive — no extra layer over the
       photo, nothing to dim, and identical in both themes. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The dial, and the only thing it touches. --demo-dim darkens the photo and nothing else: it runs in the
       dark mode alone, because multiplying by white is a no-op, and at 0 the band is exactly what ships today.
       The effect below never reads the dial, so it lives at every position of it and in both modes. */
    body[class] #head-content,
    body[class] #demo-line {
      background-color: light-dark(#ffffff, color-mix(in srgb, #14293a calc(var(--demo-dim, 0) * 100%), #ffffff));
      background-blend-mode: multiply;
    }

    /* The wave. The gradient stays bright at both ends, so the letters never fall below the contrast they hold now */
    #head-content .sl-font,
    .sl-demo-line-title {
      background-image: linear-gradient(
        100deg,
        #ffffff 0%,
        #ffffff 45%,
        var(--sl-primary-inverse) 50%,
        #ffffff 55%,
        #ffffff 100%
      );
      background-size: 320% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      /* Chrome paints text-shadow over a background clipped to the text, which turns white letters muddy grey.
         The same lift comes from a drop-shadow on the element, which composites after the clip instead. */
      text-shadow: none;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45));
      animation: demo-type-wave 6s var(--sl-ease-in-out) infinite;
    }

    /* The thread under the headline, drawn from nothing on each pass of the wave */
    #head-content .sl-font,
    .sl-demo-line-title {
      position: relative;
    }

    #head-content .sl-font::after,
    .sl-demo-line-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      height: 2px;
      width: 100%;
      transform-origin: 0 50%;
      background: var(--sl-grad-line);
      animation: demo-rule-wake 6s var(--sl-ease-in-out) infinite;
    }

    @keyframes demo-type-wave {
      0% {
        background-position: 100% 0;
      }
      55%,
      100% {
        background-position: -60% 0;
      }
    }

    @keyframes demo-rule-wake {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      55% {
        transform: scaleX(1);
        opacity: 1;
      }
      100% {
        transform: scaleX(1);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content .sl-font,
      .sl-demo-line-title,
      #head-content .sl-font::after,
      .sl-demo-line-title::after {
        animation: none;
      }

      #head-content .sl-font,
      .sl-demo-line-title {
        color: var(--sl-band-text);
        background-image: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
