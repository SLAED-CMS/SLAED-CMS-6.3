<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLAED Loading Gallery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../templates/admin/assets/vendor/bootstrap/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="../templates/admin/assets/css/base.css">
<style>
:root {
  color-scheme: light;
  --bg: #eef5fb;
  --bg-soft: #f8fbfe;
  --panel: rgba(255, 255, 255, 0.9);
  --panel-strong: #ffffff;
  --text: #173044;
  --muted: #5d7489;
  --line: rgba(31, 120, 209, 0.14);
  --line-strong: rgba(31, 120, 209, 0.24);
  --accent: #1f78d1;
  --accent-soft: #cfe7ff;
  --accent-strong: #0f66bd;
  --shadow: 0 18px 40px rgba(28, 61, 102, 0.12);
  --shadow-soft: 0 10px 24px rgba(28, 61, 102, 0.08);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--text);
  font: 14px/1.5 Tahoma, Arial, Verdana, sans-serif;
  background:
    radial-gradient(circle at 15% 14%, rgba(31, 120, 209, 0.11), transparent 18rem),
    radial-gradient(circle at 82% 18%, rgba(59, 191, 159, 0.1), transparent 20rem),
    radial-gradient(circle at 80% 82%, rgba(239, 107, 140, 0.07), transparent 22rem),
    linear-gradient(180deg, #f6fafd 0%, #eef5fb 44%, #e9f1f9 100%);
}

body::before,
body::after {
  position: fixed;
  inset: 0;
  pointer-events: none;
  content: "";
}

body::before {
  background:
    linear-gradient(90deg, transparent 0 49.7%, rgba(31, 120, 209, 0.035) 49.7% 50.3%, transparent 50.3% 100%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.55), transparent 26%, rgba(31, 120, 209, 0.03));
  opacity: 0.45;
}

body::after {
  background: radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(23, 48, 68, 0.04) 100%);
}

.page {
  width: min(1600px, calc(100vw - 28px));
  margin: 0 auto;
  padding: 18px 0 28px;
}

.hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
  gap: 20px;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 251, 255, 0.92));
  box-shadow: var(--shadow);
}

.hero::before,
.hero::after {
  position: absolute;
  content: "";
  pointer-events: none;
}

.hero::before {
  inset: -40% auto auto 62%;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(31, 120, 209, 0.14) 0%, rgba(31, 120, 209, 0.03) 35%, transparent 72%);
}

.hero::after {
  inset: auto -8% -32% auto;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 191, 159, 0.11) 0%, transparent 70%);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(31, 120, 209, 0.16), rgba(59, 191, 159, 0.32));
  box-shadow: var(--shadow-soft);
}

.brand-mark .bi {
  font-size: 20px;
  color: var(--accent-strong);
}

.hero h1 {
  margin: 0 0 10px;
  font-size: clamp(30px, 4vw, 56px);
  line-height: 1.02;
  letter-spacing: -0.03em;
}

.hero p {
  max-width: 760px;
  margin: 0;
  color: var(--muted);
  font-size: 16px;
}

.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.fact {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(31, 120, 209, 0.04);
  color: var(--muted);
}

.control-panel {
  display: grid;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(243, 248, 253, 0.96));
  box-shadow: var(--shadow-soft);
}

.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.control-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: linear-gradient(180deg, #fff, #f2f7fc);
  color: var(--text);
  cursor: pointer;
  user-select: none;
}

.control-btn:hover,
.control-btn.is-active {
  border-color: rgba(31, 120, 209, 0.42);
  box-shadow: 0 6px 14px rgba(31, 120, 209, 0.08);
}

.control-btn .bi {
  color: var(--accent);
}

.status-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
}

.shell {
  display: grid;
  gap: 18px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 14px;
}

.sample {
  display: grid;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  box-shadow: var(--shadow-soft);
}

.sample[hidden] {
  display: none !important;
}

.sample-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.sample-title {
  min-width: 0;
}

.sample-title strong {
  display: block;
  margin-bottom: 3px;
  font-size: 15px;
  line-height: 1.2;
}

.sample-title span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.sample-badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  background: rgba(31, 120, 209, 0.08);
  color: var(--accent-strong);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stage {
  position: relative;
  overflow: hidden;
  min-height: 96px;
  padding: 14px;
  border: 1px solid rgba(31, 120, 209, 0.12);
  border-radius: 14px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(239, 245, 251, 0.95)),
    linear-gradient(90deg, transparent 0 49.6%, rgba(31, 120, 209, 0.045) 49.6% 50.4%, transparent 50.4% 100%);
}

.stage::before {
  position: absolute;
  inset: auto 12px 12px 12px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(31, 120, 209, 0.28), transparent);
  content: "";
}

.loader {
  --accent: #1f78d1;
  --accent-soft: #cfe7ff;
  --accent-fade: rgba(31, 120, 209, 0.08);
  --speed: 1.2s;
  --count: 6;
  --line: rgba(31, 120, 209, 0.15);
  position: relative;
}

.loader--bars {
  display: flex;
  align-items: end;
  gap: 6px;
  height: 60px;
  padding: 8px 10px 12px;
}

.loader--bars::before {
  position: absolute;
  inset: auto 10px 10px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
  content: "";
}

.loader--bars::after {
  position: absolute;
  inset: 8px 10px auto;
  height: 100%;
  border-radius: 12px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  opacity: 0;
  content: "";
}

.loader--bars[data-mode="scan"]::after {
  opacity: 1;
  animation: sl-scan var(--speed) linear infinite;
}

.loader--bars span {
  flex: 1;
  min-width: 6px;
  height: var(--bar-h, 24%);
  border-radius: 999px;
  background: linear-gradient(180deg, var(--accent-soft), var(--accent));
  box-shadow: 0 8px 16px var(--accent-fade);
  transform-origin: bottom center;
  animation-duration: var(--speed);
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
  animation-delay: calc(var(--i) * -120ms);
}

.loader--bars[data-mode="wave"] span {
  animation-name: sl-bar-wave;
}

.loader--bars[data-mode="meter"] span {
  animation-name: sl-bar-meter;
}

.loader--bars[data-mode="scan"] span {
  animation-name: sl-bar-scan;
}

.loader--bars[data-mode="stack"] span {
  animation-name: sl-bar-stack;
}

.loader--dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 60px;
  padding: 10px 12px;
}

.loader--dots::before {
  position: absolute;
  inset: auto 12px 11px;
  height: 1px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
  content: "";
}

.loader--dots span {
  width: var(--dot-size, 10px);
  height: var(--dot-size, 10px);
  border-radius: 50%;
  background: linear-gradient(180deg, #ffffff, var(--accent-soft) 48%, var(--accent));
  box-shadow: 0 6px 14px var(--accent-fade);
  animation-duration: var(--speed);
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
  animation-delay: calc(var(--i) * -110ms);
}

.loader--dots[data-mode="chain"] span {
  animation-name: sl-dot-chain;
}

.loader--dots[data-mode="pulse"] span {
  animation-name: sl-dot-pulse;
}

.loader--dots[data-mode="drift"] span {
  animation-name: sl-dot-drift;
}

.loader--dots[data-mode="ring"] {
  gap: 8px;
}

.loader--dots[data-mode="ring"] span {
  width: 9px;
  height: 9px;
  animation-name: sl-dot-ring;
}

@keyframes sl-bar-wave {
  0%, 100% { transform: scaleY(0.34); opacity: 0.52; }
  50% { transform: scaleY(1); opacity: 1; }
}

@keyframes sl-bar-meter {
  0%, 100% { transform: scaleY(0.5); }
  25% { transform: scaleY(0.92); }
  50% { transform: scaleY(0.68); }
  75% { transform: scaleY(1); }
}

@keyframes sl-bar-scan {
  0%, 100% { transform: scaleY(0.28); filter: saturate(0.9); }
  40% { transform: scaleY(0.76); }
  60% { transform: scaleY(1); }
}

@keyframes sl-bar-stack {
  0%, 100% { transform: scaleY(0.42); }
  33% { transform: scaleY(0.88); }
  66% { transform: scaleY(0.58); }
}

@keyframes sl-scan {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(110%); }
}

@keyframes sl-dot-chain {
  0%, 100% { transform: translateY(0) scale(0.78); opacity: 0.52; }
  50% { transform: translateY(-6px) scale(1.06); opacity: 1; }
}

@keyframes sl-dot-pulse {
  0%, 100% { transform: scale(0.74); opacity: 0.48; }
  45% { transform: scale(1.1); opacity: 1; }
}

@keyframes sl-dot-drift {
  0%, 100% { transform: translateY(0) scale(0.82); opacity: 0.56; }
  35% { transform: translateY(-3px) scale(1); opacity: 0.92; }
  70% { transform: translateY(2px) scale(0.92); opacity: 0.78; }
}

@keyframes sl-dot-ring {
  0%, 100% { transform: scale(0.7); opacity: 0.38; }
  50% { transform: scale(1.12); opacity: 1; }
}

body.is-paused *,
body.is-paused *::before,
body.is-paused *::after {
  animation-play-state: paused !important;
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div>
      <div class="brand"><span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span> SLAED Demo</div>
      <h1>Loading Gallery</h1>
      <p>Viele Ladebalken und Ladedots im SLAED-Look, mit einem einzigen gemeinsamen CSS-System. Kein Zoo aus Spezialklassen, sondern wenige Bausteine mit Varianten.</p>
      <div class="facts">
        <span class="fact"><i class="bi bi-grid-3x3-gap"></i>&nbsp;40 Varianten</span>
        <span class="fact"><i class="bi bi-bar-chart-line"></i>&nbsp;Bars + Dots</span>
        <span class="fact"><i class="bi bi-sliders"></i>&nbsp;Shared CSS</span>
        <span class="fact"><i class="bi bi-palette"></i>&nbsp;SLAED Colors</span>
      </div>
    </div>
    <div class="control-panel">
      <div class="control-row">
        <button class="control-btn is-active" type="button" data-filter="all"><i class="bi bi-grid"></i>All</button>
        <button class="control-btn" type="button" data-filter="bars"><i class="bi bi-bar-chart-fill"></i>Bars</button>
        <button class="control-btn" type="button" data-filter="dots"><i class="bi bi-three-dots"></i>Dots</button>
        <button class="control-btn" type="button" data-filter="mix"><i class="bi bi-intersect"></i>Mix</button>
        <button class="control-btn" type="button" data-pause="toggle"><i class="bi bi-pause-fill"></i>Pause</button>
      </div>
      <div class="status-row">
        <span class="status-pill">1 CSS block</span>
        <span class="status-pill">8 keyframes</span>
        <span class="status-pill">65 variants</span>
        <span class="status-pill">40 Bars</span>
        <span class="status-pill">20 Dots</span>
        <span class="status-pill">5 Mix</span>
      </div>
    </div>
  </section>

  <section class="gallery" id="gallery" aria-label="Loading variants gallery"></section>
</div>

<script>
(function () {
  const tones = [
    { name: 'Blue', accent: '#1f78d1', soft: '#cfe7ff' },
    { name: 'Sky', accent: '#4aa3ff', soft: '#d7ebff' },
    { name: 'Mint', accent: '#3bbf9f', soft: '#daf7ef' },
    { name: 'Amber', accent: '#d89a24', soft: '#fde9b9' },
    { name: 'Rose', accent: '#ef6b8c', soft: '#ffd7e0' },
  ];

  const barSeeds = [
    { title: 'Pulse Rail', mode: 'wave', note: 'thin rising bars', count: 7, speed: 1.15, bars: [22, 36, 54, 68, 48, 82, 30] },
    { title: 'Meter Rail', mode: 'meter', note: 'compact meter rhythm', count: 6, speed: 1.28, bars: [18, 44, 26, 60, 38, 72] },
    { title: 'Scan Rail', mode: 'scan', note: 'sweeping highlight', count: 8, speed: 1.38, bars: [24, 38, 18, 64, 30, 74, 42, 58] },
    { title: 'Stack Rail', mode: 'stack', note: 'stacked SLAED bars', count: 5, speed: 1.05, bars: [28, 50, 72, 54, 36] },
    { title: 'Ribbon Bars', mode: 'wave', note: 'soft ribbon cadence', count: 7, speed: 1.22, bars: [20, 28, 46, 36, 64, 52, 84] },
    { title: 'Pillar Bars', mode: 'stack', note: 'tall pillar pulses', count: 6, speed: 1.08, bars: [84, 56, 74, 34, 66, 42] },
    { title: 'Edge Bars', mode: 'scan', note: 'edge-heavy sweep', count: 8, speed: 1.34, bars: [86, 42, 18, 26, 72, 28, 40, 78] },
    { title: 'Core Bars', mode: 'meter', note: 'center core pulse', count: 6, speed: 1.18, bars: [30, 58, 88, 48, 24, 66] },
  ];

  const dotSeeds = [
    { title: 'Dot Chain', mode: 'chain', note: 'soft ellipsis motion', count: 3, speed: 0.95, dots: 3 },
    { title: 'Dot Pulse', mode: 'pulse', note: 'classic SLAED dots', count: 4, speed: 1.12, dots: 4 },
    { title: 'Dot Drift', mode: 'drift', note: 'floating dot row', count: 5, speed: 1.26, dots: 5 },
    { title: 'Dot Ring', mode: 'ring', note: 'ring-like dot pulse', count: 6, speed: 1.4, dots: 6 },
  ];

  const mixSeed = {
    title: 'Hybrid Rail',
    note: 'bars and dots together',
    barMode: 'scan',
    dotMode: 'pulse',
    bars: [18, 42, 64, 48, 80, 36],
    dots: 4,
    speed: 1.18,
  };

  const gallery = document.getElementById('gallery');
  const filterButtons = document.querySelectorAll('[data-filter]');
  const pauseButton = document.querySelector('[data-pause]');

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  const makeAccent = (accent, soft) => {
    return `--accent:${accent};--accent-soft:${soft};--accent-fade:rgba(31,120,209,.08);--line:rgba(31,120,209,.16);`;
  };

  const buildBars = (count, bars) => {
    const cells = [];
    for (let index = 0; index < count; index += 1) {
      const height = clamp(bars[index % bars.length] + (((index % 3) - 1) * 5), 14, 92);
      cells.push(`<span style="--i:${index};--bar-h:${height}%;"></span>`);
    }
    return cells.join('');
  };

  const buildDots = (count) => {
    const cells = [];
    for (let index = 0; index < count; index += 1) {
      cells.push(`<span style="--i:${index};"></span>`);
    }
    return cells.join('');
  };

  const buildCombo = (item) => {
    return `
      <div style="display:grid;gap:10px;">
        <div class="loader loader--bars" data-mode="${item.barMode}" style="${item.style}">${buildBars(item.barCount, item.profile)}</div>
        <div class="loader loader--dots" data-mode="${item.dotMode}" style="${item.style}">${buildDots(item.dotCount)}</div>
      </div>
    `;
  };

  const buildCard = (item) => {
    const familyLabel = item.kind === 'bars' ? 'Bars' : 'Dots';
    const familyIcon = item.kind === 'bars' ? 'bi-bar-chart-fill' : (item.kind === 'mix' ? 'bi-intersect' : 'bi-three-dots');
    const familyName = item.kind === 'mix' ? 'Mix' : familyLabel;
    const loader = item.kind === 'bars'
      ? `<div class="loader loader--bars" data-mode="${item.mode}" style="${item.style}">${buildBars(item.count, item.profile)}</div>`
      : item.kind === 'mix'
        ? buildCombo(item)
        : `<div class="loader loader--dots" data-mode="${item.mode}" style="${item.style}">${buildDots(item.count)}</div>`;

    return `
      <article class="sample" data-kind="${item.kind}">
        <div class="sample-head">
          <div class="sample-title">
            <strong>${item.title}</strong>
            <span>${item.note}</span>
          </div>
          <span class="sample-badge"><i class="bi ${familyIcon}"></i>&nbsp;${familyName}</span>
        </div>
        <div class="stage">
          ${loader}
        </div>
      </article>
    `;
  };

  const items = [];

  barSeeds.forEach((seed, seedIndex) => {
    tones.forEach((tone, toneIndex) => {
      const count = clamp(seed.count + ((toneIndex % 3) - 1), 5, 8);
      const speed = (seed.speed + (toneIndex * 0.08) + (seedIndex * 0.03)).toFixed(2);
      items.push({
        kind: 'bars',
        mode: seed.mode,
        title: `${seed.title} / ${tone.name}`,
        note: seed.note,
        count,
        profile: seed.bars,
        style: `${makeAccent(tone.accent, tone.soft)}--speed:${speed}s;`,
      });
    });
  });

  dotSeeds.forEach((seed, seedIndex) => {
    tones.forEach((tone, toneIndex) => {
      const count = clamp(seed.count + (toneIndex % 2), 3, 8);
      const speed = (seed.speed + (toneIndex * 0.07) + (seedIndex * 0.04)).toFixed(2);
      items.push({
        kind: 'dots',
        mode: seed.mode,
        title: `${seed.title} / ${tone.name}`,
        note: seed.note,
        count,
        profile: [],
        style: `${makeAccent(tone.accent, tone.soft)}--speed:${speed}s;--dot-size:${seed.mode === 'ring' ? '9px' : '10px'};`,
      });
    });
  });

  tones.forEach((tone, toneIndex) => {
    const speed = (mixSeed.speed + (toneIndex * 0.05)).toFixed(2);
    items.push({
      kind: 'mix',
      barMode: mixSeed.barMode,
      dotMode: mixSeed.dotMode,
      title: `${mixSeed.title} / ${tone.name}`,
      note: mixSeed.note,
      barCount: clamp(6 + (toneIndex % 2), 5, 8),
      dotCount: clamp(mixSeed.dots + (toneIndex % 2), 3, 6),
      profile: mixSeed.bars,
      style: `${makeAccent(tone.accent, tone.soft)}--speed:${speed}s;`,
    });
  });

  const render = (filter = 'all') => {
    gallery.innerHTML = items
      .map((item) => buildCard(item))
      .join('');

    document.querySelectorAll('.sample').forEach((card) => {
      card.hidden = filter !== 'all' && card.dataset.kind !== filter;
    });
  };

  filterButtons.forEach((button) => {
    button.addEventListener('click', () => {
      filterButtons.forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      render(button.dataset.filter || 'all');
    });
  });

  pauseButton.addEventListener('click', () => {
    document.body.classList.toggle('is-paused');
    pauseButton.innerHTML = document.body.classList.contains('is-paused')
      ? '<i class="bi bi-play-fill"></i>Play'
      : '<i class="bi bi-pause-fill"></i>Pause';
  });

  render('all');
})();
</script>
</body>
</html>
