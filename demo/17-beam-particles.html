<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>17 · Луч и сезонные частицы — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 17 — Beam and season particles: 10 and 14 in one band. Four layers where each parent has only two
       pseudo-elements, so the particles move onto the centred wrapper and span the window from there —
       the same trick the brand thread used before it was dropped. Order from the bottom: veil, beam,
       near particles, far particles, text. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The dial, and the only thing it touches. --demo-dim darkens the photo and nothing else: it runs in the
       dark mode alone, because multiplying by white is a no-op, and at 0 the band is exactly what ships today.
       Neither effect below reads the dial, so both live at every position of it and in both modes. */
    body[class] #head-content,
    body[class] #demo-line {
      background-color: light-dark(#ffffff, color-mix(in srgb, #14293a calc(var(--demo-dim, 0) * 100%), #ffffff));
      background-blend-mode: multiply;
    }

    /* The veil the dial fades in: darker where the headline stands, plus a shallow vignette. It stays shallow
       on purpose — at fifty per cent a deeper one draws a visible circle in the middle of the band.
       Both stops are transparent in light, so no position of the dial puts a filter on the light theme. */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: var(--demo-dim, 0);
      background:
        linear-gradient(
          100deg,
          light-dark(transparent, rgba(8, 16, 26, 0.92)) 0%,
          light-dark(transparent, rgba(8, 16, 26, 0.55)) 60%,
          light-dark(transparent, rgba(8, 16, 26, 0.8)) 100%
        ),
        radial-gradient(
          170% 240% at 50% 50%,
          transparent 62%,
          light-dark(transparent, rgba(0, 0, 0, 0.22)) 100%
        );
    }

    /* The beam, upright and even-paced: eight seconds, three and a half of travel and four and a half of rest */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      z-index: 2;
      width: 30%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      background: linear-gradient(
        90deg,
        transparent 0%,
        light-dark(rgba(124, 196, 238, 0.16), rgba(124, 196, 238, 0.12)) 22%,
        light-dark(rgba(160, 214, 244, 0.34), rgba(160, 214, 244, 0.26)) 40%,
        light-dark(rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.36)) 50%,
        light-dark(rgba(160, 214, 244, 0.34), rgba(160, 214, 244, 0.26)) 60%,
        light-dark(rgba(124, 196, 238, 0.16), rgba(124, 196, 238, 0.12)) 78%,
        transparent 100%
      );
      animation: demo-beam 8s linear infinite;
    }

    /* The season, in four values: two tones, the fall time and the drift of the near layer */
    body {
      --demo-p1: rgba(255, 255, 255, 0.95);
      --demo-p2: rgba(214, 236, 255, 0.75);
      --demo-p-fall: 9s;
      --demo-p-drift: 14s;
    }

    body.sl-spring {
      --demo-p1: rgba(255, 226, 236, 0.9);
      --demo-p2: rgba(232, 246, 210, 0.8);
      --demo-p-fall: 11s;
      --demo-p-drift: 17s;
    }

    body.sl-summer {
      --demo-p1: rgba(255, 246, 196, 0.85);
      --demo-p2: rgba(226, 245, 205, 0.7);
      --demo-p-fall: 15s;
      --demo-p-drift: 21s;
    }

    body.sl-autumn {
      --demo-p1: rgba(240, 147, 43, 0.85);
      --demo-p2: rgba(224, 122, 95, 0.7);
      --demo-p-fall: 10s;
      --demo-p-drift: 15s;
    }

    body.sl-newyear {
      --demo-p1: rgba(255, 255, 255, 0.95);
      --demo-p2: rgba(179, 112, 207, 0.8);
      --demo-p-fall: 8s;
      --demo-p-drift: 13s;
    }

    /* Both particle layers hang off the centred wrapper: full-bleed by inset, under the text by z-index, and
       tall enough to cover the band whatever height the wrapper itself takes. */
    #head-content .sl-wrp::before,
    #demo-line .sl-wrp::before,
    #head-content .sl-wrp::after,
    #demo-line .sl-wrp::after {
      content: "";
      position: absolute;
      top: -100%;
      bottom: -100%;
      left: calc(50% - 50vw);
      z-index: -1;
      width: 100vw;
      pointer-events: none;
    }

    /* The near layer: bigger, faster, falling straight down */
    #head-content .sl-wrp::before,
    #demo-line .sl-wrp::before {
      background-image:
        radial-gradient(3px 3px at 40px 20px, var(--demo-p1), transparent),
        radial-gradient(2.6px 2.6px at 180px 70px, var(--demo-p1), transparent),
        radial-gradient(2.2px 2.2px at 320px 40px, var(--demo-p2), transparent),
        radial-gradient(2.8px 2.8px at 260px 110px, var(--demo-p2), transparent),
        radial-gradient(2.4px 2.4px at 120px 130px, var(--demo-p1), transparent);
      background-size: 380px 150px;
      animation: demo-fall var(--demo-p-fall) linear infinite;
    }

    /* The far layer: smaller, slower, drifting sideways as it goes */
    #head-content .sl-wrp::after,
    #demo-line .sl-wrp::after {
      opacity: 0.7;
      background-image:
        radial-gradient(1.4px 1.4px at 90px 50px, var(--demo-p2), transparent),
        radial-gradient(1.2px 1.2px at 230px 15px, var(--demo-p1), transparent),
        radial-gradient(1.6px 1.6px at 410px 90px, var(--demo-p2), transparent);
      background-size: 520px 190px;
      animation: demo-drift-side var(--demo-p-drift) linear infinite;
    }

    @keyframes demo-beam {
      0% {
        transform: translate3d(0, 0, 0);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      32% {
        opacity: 1;
      }
      44%,
      100% {
        transform: translate3d(480%, 0, 0);
        opacity: 0;
      }
    }

    @keyframes demo-fall {
      from {
        transform: translate3d(0, -150px, 0);
      }
      to {
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes demo-drift-side {
      from {
        transform: translate3d(60px, -190px, 0);
      }
      to {
        transform: translate3d(-60px, 0, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content::after,
      #demo-line::after {
        animation: none;
        opacity: 0;
      }

      #head-content .sl-wrp::before,
      #demo-line .sl-wrp::before,
      #head-content .sl-wrp::after,
      #demo-line .sl-wrp::after {
        animation: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
