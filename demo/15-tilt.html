<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15 · Наклон к курсору — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 15 — Tilt. The band behaves like a plane on a hinge: the headline turns in 3D toward the pointer, the
       photo leans the other way behind it, and a specular edge slides to the side the plane turned to. It is the
       card-tilt of a product page applied to a full-width strip, and it touches brightness nowhere. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The photo becomes a layer of its own. background-image: inherit takes whatever the season rule put on the
       band, so the five season rules are never duplicated, and the dial's tone is multiplied into this layer
       instead of the element beneath it. What moves here is a transform and only a transform -- the compositor's
       work, not the painter's. Animating background-size or -position is what made the first cut stutter: it
       repaints the band and resamples a 1920px JPEG on every single frame. */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      inset: -16% -6%;
      z-index: 0;
      pointer-events: none;
      background-image: inherit;
      background-repeat: no-repeat;
      background-position: 50% 50%;
      background-size: cover;
      background-color: light-dark(#ffffff, color-mix(in srgb, #14293a calc(var(--demo-dim, 0) * 100%), #ffffff));
      background-blend-mode: multiply;
      will-change: transform;
    }

    #head-content,
    #demo-line {
      perspective: 800px;
    }

    /* The plane. The headline is what actually turns, which is what the eye reads as the band turning */
    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      transform:
        rotateX(calc(var(--demo-ny) * -5deg))
        rotateY(calc(var(--demo-nx) * 7deg))
        translate3d(calc(var(--demo-nx) * 6px), 0, 0);
      transform-style: preserve-3d;
      transition: transform var(--sl-time-base) var(--sl-ease-in-out);
    }

    /* The photo behind it leans the other way, which is what makes the turn read as depth */
    #head-content::before,
    #demo-line::before {
      transform:
        translate3d(calc(var(--demo-nx) * -14px), calc(var(--demo-ny) * -8px), 0)
        scale(1.04);
    }

    /* The specular edge, always on the side the plane turned to */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
      background: linear-gradient(
        calc(90deg + var(--demo-nx) * 20deg),
        transparent 30%,
        light-dark(rgba(255, 255, 255, 0.3), rgba(124, 196, 238, 0.22)) 50%,
        transparent 70%
      );
      opacity: 0.75;
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content > .sl-wrp,
      #demo-line > .sl-wrp {
        transform: none;
        transition: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
  <script>demoTrackPointer();</script>
</body>
</html>
