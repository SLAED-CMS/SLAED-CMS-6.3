<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Параллакс на скролле — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 03 — Parallax on scroll. The photo drifts against the page and the timeline is the scroll itself:
       animation-timeline: scroll() for the band that opens the page, view() for the one that arrives later.
       No scroll listener, no JavaScript, nothing running while the page is still. The season image stays on the
       element, so the five season rules are not duplicated anywhere — only its background-position moves. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The photo becomes a layer of its own. background-image: inherit takes whatever the season rule put on the
       band, so the five season rules are never duplicated, and the dial's tone is multiplied into this layer
       instead of the element beneath it. What moves here is a transform and only a transform -- the compositor's
       work, not the painter's. Animating background-size or -position is what made the first cut stutter: it
       repaints the band and resamples a 1920px JPEG on every single frame. */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      inset: -16% -6%;
      z-index: 0;
      pointer-events: none;
      background-image: inherit;
      background-repeat: no-repeat;
      background-position: 50% 50%;
      background-size: cover;
      background-color: light-dark(#ffffff, color-mix(in srgb, #14293a calc(var(--demo-dim, 0) * 100%), #ffffff));
      background-blend-mode: multiply;
      will-change: transform;
    }

    /* The veil the dial fades in: darker where the headline stands, plus a vignette that gives the band edges.
       Both stops are transparent in light, so no position of the dial puts a filter on the light theme. */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: var(--demo-dim, 0);
      background:
        linear-gradient(
          100deg,
          light-dark(transparent, rgba(8, 16, 26, 0.92)) 0%,
          light-dark(transparent, rgba(8, 16, 26, 0.55)) 60%,
          light-dark(transparent, rgba(8, 16, 26, 0.8)) 100%
        ),
        radial-gradient(
          130% 180% at 50% 50%,
          transparent 35%,
          light-dark(transparent, rgba(0, 0, 0, 0.5)) 100%
        );
    }

    @supports (animation-timeline: scroll()) {
      /* The head band is already on screen when the page opens, so its layer reads the page scroller */
      #head-content::before {
        animation: demo-drift linear both;
        animation-timeline: scroll(root block);
        animation-range: 0 600px;
      }

      /* The demo strip arrives from below, so its layer reads its own entry into the viewport */
      #demo-line::before {
        animation: demo-drift linear both;
        animation-timeline: view();
        animation-range: entry 0% exit 100%;
      }
    }

    @keyframes demo-drift {
      from {
        transform: translate3d(0, -3%, 0) scale(1.06);
      }
      to {
        transform: translate3d(0, 3%, 0) scale(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content::before,
      #demo-line::before {
        animation: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
