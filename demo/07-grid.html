<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 · Неоновая сетка — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 07 — Neon grid. A grid laid flat by perspective runs into the horizon under the headline, and a scan line
       crosses it every nine seconds. The tone is a console rather than a postcard, which is arguably what the
       front page of a CMS is; the photo is replaced outright, so the dial has nothing to darken here either. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The season is one colour here: the glow the grid is drawn in */
    body {
      --demo-neon: light-dark(#1c6e9e, #38a9de);
    }

    body.sl-spring {
      --demo-neon: light-dark(#3f8f4f, #46c95d);
    }

    body.sl-summer {
      --demo-neon: light-dark(#2f8f7a, #2fd6b0);
    }

    body.sl-autumn {
      --demo-neon: light-dark(#b06a20, #f0932b);
    }

    body.sl-newyear {
      --demo-neon: light-dark(#6a3fa0, #b370cf);
    }

    body[class] #head-content,
    body[class] #demo-line {
      background-image: none;
      background-color: light-dark(#1f5f86, #070f18);
    }

    /* The floor: two repeating gradients seen through perspective, masked out where they reach the horizon */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      left: -60%;
      right: -60%;
      bottom: -10%;
      top: 30%;
      z-index: 1;
      pointer-events: none;
      transform: perspective(140px) rotateX(58deg);
      transform-origin: 50% 100%;
      opacity: 0.9;
      background-image:
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--demo-neon) 85%, transparent) 0 2px, transparent 2px 90px),
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--demo-neon) 70%, transparent) 0 2px, transparent 2px 40px);
      mask-image: linear-gradient(to top, #000000 0%, transparent 85%);
      animation: demo-grid-run 4s linear infinite;
    }

    /* The horizon glow that hides where the grid ends */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(70% 120% at 50% 118%, color-mix(in srgb, var(--demo-neon) 45%, transparent) 0%, transparent 65%),
        linear-gradient(180deg, light-dark(rgba(12, 40, 62, 0.55), rgba(5, 10, 18, 0.85)) 0%, transparent 55%);
    }

    /* The scan: one bright line crossing the band, nine seconds apart */
    #head-content .sl-wrp::after,
    #demo-line .sl-wrp::after {
      content: "";
      position: absolute;
      top: -100%;
      left: -50vw;
      z-index: 3;
      width: 200vw;
      height: 300%;
      pointer-events: none;
      background: linear-gradient(
        100deg,
        transparent 44%,
        color-mix(in srgb, var(--demo-neon) 26%, transparent) 50%,
        transparent 56%
      );
      animation: demo-scan 9s linear infinite;
    }

    @keyframes demo-grid-run {
      from {
        background-position: 0 0, 0 0;
      }
      to {
        background-position: 0 0, 0 40px;
      }
    }

    @keyframes demo-scan {
      0% {
        transform: translate3d(-60%, 0, 0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      45% {
        opacity: 1;
      }
      60% {
        transform: translate3d(60%, 0, 0);
        opacity: 0;
      }
      100% {
        transform: translate3d(60%, 0, 0);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content::before,
      #demo-line::before,
      #head-content .sl-wrp::after,
      #demo-line .sl-wrp::after {
        animation: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
