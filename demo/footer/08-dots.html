<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>08 · Точки вместо палок — стенд подвала SLAED</title>
  <link rel="stylesheet" href="../../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/foot.css">
  <style>
    /* 08 — The smallest possible answer. The separator moves from ::before to ::after, so it belongs to the item
       ahead of the break and stays at the end of a line instead of hanging at the start of the next one. The shape
       is unchanged; only the hanging bar and the thumb target are fixed. */

    /* The theme floats this link right (theme.css:129). Inside the flex row the float is inert and margin-left:auto
       does the work; the moment a variant turns the block into a grid or a block, the float wakes up, leaves the
       flow and lands on top of whatever follows. Every variant here starts by putting it back in the flow. */
    @media (max-width: 768px) {
      .sl-fmenu .sl-pull-right {
        float: none;
      }
    }

    /* The phone range only: the desktop row is not what anyone complained about */
    @media (max-width: 768px) {
      #footbox > .sl-wrp:last-child > .sl-fmenu {
        display: block;
        padding: var(--sl-space-5) 0;
      }

      .sl-fmenu ul {
        column-gap: var(--sl-space-4);
      }

      .sl-fmenu ul li {
        display: flex;
        align-items: center;
      }

      .sl-fmenu ul li::before {
        display: none;
      }

      .sl-fmenu ul li:not(:last-child)::after {
        content: "·";
        margin-left: var(--sl-space-4);
        opacity: 0.5;
      }

      .sl-fmenu ul li a {
        display: flex;
        align-items: center;
        min-height: 40px;
      }

      .sl-fmenu .sl-pull-right {
        display: flex;
        align-items: center;
        min-height: 40px;
        margin: var(--sl-space-3) 0 0;
        padding-top: var(--sl-space-3);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку собирает <code>assets/foot.js</code>.</p></noscript>
  <script src="assets/foot.js"></script>
</body>
</html>
