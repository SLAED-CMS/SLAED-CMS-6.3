<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Чипы — стенд подвала SLAED</title>
  <link rel="stylesheet" href="../../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/foot.css">
  <style>
    /* 03 — Chips. Each item carries its own border, so a wrap needs no separator to read as a break and nothing
       can hang at the start of a row. The advertising line is the one filled chip, which is also what it is. */

    /* The theme floats this link right (theme.css:129). Inside the flex row the float is inert and margin-left:auto
       does the work; the moment a variant turns the block into a grid or a block, the float wakes up, leaves the
       flow and lands on top of whatever follows. Every variant here starts by putting it back in the flow. */
    @media (max-width: 768px) {
      .sl-fmenu .sl-pull-right {
        float: none;
      }
    }

    /* The phone range only: the desktop row is not what anyone complained about */
    @media (max-width: 768px) {
      #footbox > .sl-wrp:last-child > .sl-fmenu {
        display: block;
        padding: var(--sl-space-6) 0;
      }

      .sl-fmenu ul {
        gap: var(--sl-space-3);
        justify-content: center;
      }

      .sl-fmenu ul li::before {
        display: none;
      }

      .sl-fmenu ul li a {
        display: flex;
        align-items: center;
        min-height: 40px;
        padding: 0 var(--sl-space-5);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: var(--sl-radius-pill);
      }

      .sl-fmenu .sl-pull-right {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        width: fit-content;
        margin: var(--sl-space-5) auto 0;
        padding: 0 var(--sl-space-6);
        border-radius: var(--sl-radius-pill);
        background: rgba(255, 255, 255, 0.14);
      }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку собирает <code>assets/foot.js</code>.</p></noscript>
  <script src="assets/foot.js"></script>
</body>
</html>
