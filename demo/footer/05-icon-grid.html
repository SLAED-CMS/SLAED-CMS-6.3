<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Сетка с иконками — стенд подвала SLAED</title>
  <link rel="stylesheet" href="../../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/foot.css">
  <style>
    /* 05 — Icons at every width. One idea carried through three shapes: an icon marks each destination, and the bar
       separators go away because the icon already tells the eye where one item ends and the next begins.

         above 1200   one row, icons inline, the ad on the right as it is today
         768 - 1200   four columns by two rows
         below 768    two columns by four rows, the ad on a line of its own

       The theme floats the ad right (theme.css:129). Inside the flex row that float is inert and margin-left:auto
       does the work; the moment the block becomes a grid the float wakes up, leaves the flow and lands on top of
       whatever follows — so every branch below the first puts it back into the flow. */

    /* The icons, one per destination, from the font the theme already ships. Numbered by position: the prototype
       may key on nth-child, but a theme has to carry the icon in the markup, or the two lists drift apart the
       first time a section is added. */
    #footbox > .sl-wrp:last-child > .sl-fmenu ul li a::before,
    #footbox > .sl-wrp:last-child > .sl-fmenu .sl-pull-right::before {
      font-family: bootstrap-icons, sans-serif;
      font-size: 18px;
      line-height: 1;
      opacity: 0.7;
    }

    .sl-fmenu ul li:nth-child(1) a::before { content: "\f423"; }
    .sl-fmenu ul li:nth-child(2) a::before { content: "\f1cc"; }
    .sl-fmenu ul li:nth-child(3) a::before { content: "\f4a3"; }
    .sl-fmenu ul li:nth-child(4) a::before { content: "\f356"; }
    .sl-fmenu ul li:nth-child(5) a::before { content: "\f505"; }
    .sl-fmenu ul li:nth-child(6) a::before { content: "\f194"; }
    .sl-fmenu ul li:nth-child(7) a::before { content: "\f310"; }
    .sl-fmenu ul li:nth-child(8) a::before { content: "\f2ee"; }

    .sl-fmenu .sl-pull-right::before { content: "\f484"; }

    /* The bar is what hangs at the start of a wrapped row, and with an icon in front of every label it has no work
       left to do at any width */
    .sl-fmenu ul li::before {
      display: none;
    }

    .sl-fmenu ul li a,
    .sl-fmenu .sl-pull-right {
      display: inline-flex;
      align-items: center;
      gap: var(--sl-space-4);
    }

    /* Full width: the row it is today, with icons instead of bars */
    #footbox > .sl-wrp:last-child > .sl-fmenu {
      column-gap: var(--sl-space-8);
    }

    .sl-fmenu ul {
      column-gap: var(--sl-space-8);
      row-gap: var(--sl-space-3);
    }

    .sl-fmenu ul li a {
      min-height: 40px;
    }

    /* Between the tablet and the desktop step: four columns, two rows */
    @media (max-width: 1200px) {
      #footbox > .sl-wrp:last-child > .sl-fmenu {
        display: block;
      }

      .sl-fmenu .sl-pull-right {
        float: none;
      }

      .sl-fmenu ul {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        column-gap: var(--sl-space-6);
      }

      .sl-fmenu ul li a {
        min-height: 42px;
      }

      .sl-fmenu .sl-pull-right {
        min-height: 44px;
        margin: var(--sl-space-4) 0 0;
        padding-top: var(--sl-space-4);
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        width: 100%;
      }
    }

    /* The phone: two columns, four rows, and the ad gets a line to itself */
    @media (max-width: 768px) {
      #footbox > .sl-wrp:last-child > .sl-fmenu {
        padding: var(--sl-space-6) 0;
      }

      .sl-fmenu ul {
        grid-template-columns: 1fr 1fr;
        gap: var(--sl-space-2) var(--sl-space-5);
      }

      .sl-fmenu ul li a {
        min-height: 44px;
      }

      .sl-fmenu .sl-pull-right {
        min-height: 44px;
        margin-top: var(--sl-space-5);
        padding-top: var(--sl-space-5);
      }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку собирает <code>assets/foot.js</code>.</p></noscript>
  <script src="assets/foot.js"></script>
</body>
</html>
