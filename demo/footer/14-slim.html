<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14 · Сжатый подвал — стенд подвала SLAED</title>
  <link rel="stylesheet" href="../../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/foot.css">
  <style>
    /* 14 — The largest intervention, and the only one that touches the columns above: the technology strip goes
       away on a phone, the wordmark column keeps the mark alone, and the menu runs as a scrolling line. The footer
       stops being a third of the page. */

    /* The theme floats this link right (theme.css:129). Inside the flex row the float is inert and margin-left:auto
       does the work; the moment a variant turns the block into a grid or a block, the float wakes up, leaves the
       flow and lands on top of whatever follows. Every variant here starts by putting it back in the flow. */
    @media (max-width: 768px) {
      .sl-fmenu .sl-pull-right {
        float: none;
      }
    }

    /* The phone range only: the desktop footer is not what anyone complained about */
    @media (max-width: 768px) {
      /* The columns shrink: technology is decoration, and on a phone it costs a whole screen */
      #footbox > .sl-wrp:first-child > section[aria-label="Технологии"] {
        display: none;
      }

      #footbox > .sl-wrp:first-child .sl-madein {
        display: none;
      }

      #footbox > .sl-wrp:last-child > .sl-fmenu {
        display: block;
        padding: var(--sl-space-5) 0;
      }

      /* The copyright leaves the top of the footer and joins the lower row, which is where it is looked for */
      #footbox > .sl-wrp:first-child .sl-foot-copy {
        display: none;
      }

      #footbox > .sl-wrp:last-child > .sl-fmenu::after {
        content: "SLAED CMS © 2005–2026 Eduard Laas. Released under MIT License.";
        display: block;
        width: 100%;
        font-size: var(--sl-font-micro);
        opacity: 0.65;
      }

      .sl-fmenu ul li::before {
        display: none;
      }

      .sl-fmenu ul {
        flex-wrap: nowrap;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        gap: var(--sl-space-6);
      }

      .sl-fmenu ul::-webkit-scrollbar {
        display: none;
      }

      .sl-fmenu ul li {
        flex: 0 0 auto;
        scroll-snap-align: start;
      }

      .sl-fmenu ul li a {
        display: flex;
        align-items: center;
        min-height: 42px;
        white-space: nowrap;
      }

      .sl-fmenu .sl-pull-right {
        display: flex;
        align-items: center;
        min-height: 40px;
        margin: var(--sl-space-3) 0 0;
        padding-top: var(--sl-space-3);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: var(--sl-font-small);
      }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку собирает <code>assets/foot.js</code>.</p></noscript>
  <script src="assets/foot.js"></script>
</body>
</html>
