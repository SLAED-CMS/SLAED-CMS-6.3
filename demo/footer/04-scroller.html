<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Лента со скроллом — стенд подвала SLAED</title>
  <link rel="stylesheet" href="../../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/foot.css">
  <style>
    /* 04 — One line that scrolls sideways with snapping, so the block keeps the height it has on a desktop instead
       of growing to three rows. The separators stay: on a single line they never wrap, so they never hang. */

    /* The theme floats this link right (theme.css:129). Inside the flex row the float is inert and margin-left:auto
       does the work; the moment a variant turns the block into a grid or a block, the float wakes up, leaves the
       flow and lands on top of whatever follows. Every variant here starts by putting it back in the flow. */
    @media (max-width: 768px) {
      .sl-fmenu .sl-pull-right {
        float: none;
      }
    }

    /* The phone range only: the desktop row is not what anyone complained about */
    @media (max-width: 768px) {
      #footbox > .sl-wrp:last-child > .sl-fmenu {
        display: block;
        padding: var(--sl-space-5) 0;
      }

      .sl-fmenu ul {
        flex-wrap: nowrap;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        padding-bottom: var(--sl-space-3);
      }

      .sl-fmenu ul::-webkit-scrollbar {
        display: none;
      }

      /* The item has to be a flex line of its own, or the bar drawn by ::before stacks above the link instead of
         standing beside it: the link itself is a flex box, and a block li lays the two out one under the other */
      .sl-fmenu ul li {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        scroll-snap-align: start;
      }

      .sl-fmenu ul li::before {
        margin: 0 var(--sl-space-5);
      }

      .sl-fmenu ul li a {
        display: flex;
        align-items: center;
        min-height: 44px;
        white-space: nowrap;
      }

      .sl-fmenu .sl-pull-right {
        display: flex;
        align-items: center;
        min-height: 40px;
        margin: 0;
        padding-top: var(--sl-space-3);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку собирает <code>assets/foot.js</code>.</p></noscript>
  <script src="assets/foot.js"></script>
</body>
</html>
