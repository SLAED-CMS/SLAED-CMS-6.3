<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Мешь-градиент и зерно — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 05 — Mesh gradient and grain. The photograph goes away entirely: four blobs of brand colour breathe under
       a film of noise, and the season is told by which four colours they are. The band stops being a picture that
       has to be dimmed and becomes a surface that already belongs to the page — four JPEGs leave the load, and
       the dial has nothing left to darken, which is why it does nothing on this page. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The seasonal photo is replaced, not covered: nothing bright is left underneath to leak through */
    body[class] #head-content,
    body[class] #demo-line {
      background-image: none;
      background-color: light-dark(#3f9bd0, #0c1a26);
    }

    /* The mesh. Each season repaints the four stops below and nothing else in the block */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      inset: -60% -15%;
      z-index: 1;
      pointer-events: none;
      filter: blur(30px);
      background:
        radial-gradient(34% 70% at 12% 40%, var(--demo-mesh-1) 0%, transparent 70%),
        radial-gradient(30% 62% at 38% 62%, var(--demo-mesh-2) 0%, transparent 72%),
        radial-gradient(32% 66% at 64% 38%, var(--demo-mesh-3) 0%, transparent 70%),
        radial-gradient(38% 74% at 88% 58%, var(--demo-mesh-4) 0%, transparent 72%);
      animation: demo-mesh 28s ease-in-out infinite;
    }

    /* The grain: one inline SVG turbulence, tiled, that keeps the gradient from banding on a wide screen */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.26;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      background-size: 160px 160px;
    }

    /* The season is four colours, and that is the whole of it */
    body {
      --demo-mesh-1: light-dark(#7cc4ee, #1f6f9e);
      --demo-mesh-2: light-dark(#a7d8f0, #16544f);
      --demo-mesh-3: light-dark(#5cbcea, #2a3f7a);
      --demo-mesh-4: light-dark(#3f9bd0, #123449);
    }

    body.sl-spring {
      --demo-mesh-1: light-dark(#9fd779, #2b6b3a);
      --demo-mesh-2: light-dark(#7cc4ee, #17566b);
      --demo-mesh-3: light-dark(#c9e8a4, #2f7a53);
      --demo-mesh-4: light-dark(#5cbcea, #123f4d);
    }

    body.sl-summer {
      --demo-mesh-1: light-dark(#8fd06a, #1f6b45);
      --demo-mesh-2: light-dark(#ffd166, #2f7a5a);
      --demo-mesh-3: light-dark(#5cbcea, #14554d);
      --demo-mesh-4: light-dark(#3f9bd0, #14384a);
    }

    body.sl-autumn {
      --demo-mesh-1: light-dark(#f0932b, #7a4416);
      --demo-mesh-2: light-dark(#e07a5f, #5e2a22);
      --demo-mesh-3: light-dark(#f4c95d, #6b5320);
      --demo-mesh-4: light-dark(#a3623c, #33202a);
    }

    body.sl-newyear {
      --demo-mesh-1: light-dark(#7cc4ee, #1e4f8a);
      --demo-mesh-2: light-dark(#b370cf, #3d2a6b);
      --demo-mesh-3: light-dark(#ffffff, #2a6f9e);
      --demo-mesh-4: light-dark(#5cbcea, #142a49);
    }

    @keyframes demo-mesh {
      0% {
        transform: translate3d(-4%, 0, 0) scale(1);
      }
      33% {
        transform: translate3d(3%, -3%, 0) scale(1.1);
      }
      66% {
        transform: translate3d(4%, 2%, 0) scale(1.04);
      }
      100% {
        transform: translate3d(-4%, 0, 0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #head-content::before,
      #demo-line::before {
        animation: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
