<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLAED — модуль поиска: витрина вариантов</title>
<link rel="stylesheet" href="/templates/lite/assets/vendor/bootstrap/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="/templates/lite/assets/css/base.css">
<link rel="stylesheet" href="/templates/lite/assets/css/theme.css">
<style>
  /* ==================================================================
   * modul-search.html — proposal gallery for the search module.
   * Reuses the LIVE lite theme (base.css + theme.css): breadcrumbs
   * (.sl-category-nav/.sl-crumb with tone colours + hover underline),
   * chips (.sl-card-*), buttons (.sl-but/.sl-but-mini), inputs
   * (.sl-field), tinted category tiles (.sl-card-image.sl-cat-tone-N).
   *
   * Result look switches by <body class="sl-demo-<variant>">, form
   * look by "sl-demo-form-<variant>". Only new hooks are sl-sr-* and
   * the inline-form helpers — every one rides on base.css tokens and
   * follows the sl-* naming rule, ready to move into theme.css.
   * ================================================================= */
  body { background: var(--sl-color-bg); color: var(--sl-color-text); }

  /* ---- toolbar ---- */
  .sl-demo-bar { position: sticky; top: 0; z-index: 20; background: var(--sl-color-bg);
    border-bottom: 1px solid var(--sl-color-border); box-shadow: var(--sl-shadow-soft); padding: 11px 20px; }
  .sl-demo-bar-in { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  .sl-demo-grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sl-demo-grp > span { font-size: 12px; color: var(--sl-color-text-muted); }
  .sl-demo-grp button { font: inherit; font-size: 12.5px; cursor: pointer; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--sl-color-border-strong); background: var(--sl-color-bg); color: var(--sl-color-text); }
  .sl-demo-grp button:hover { border-color: var(--sl-color-brand); }
  .sl-demo-grp button.is-on { background: var(--sl-color-brand-link); border-color: var(--sl-color-brand-link); color: #fff; }

  .sl-demo-wrap { max-width: 900px; margin: 0 auto; padding: 22px 20px 90px; }
  .sl-demo-cur { font-size: 13px; color: var(--sl-color-text-muted); margin: 0 0 18px; }
  .sl-demo-cur b { color: var(--sl-color-text-heading); }

  /* ---- one-row search form ---- */
  .sl-search-inline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sl-space-md);
    margin: 0 0 8px; padding: 14px 16px; background: var(--sl-color-surface);
    border: 1px solid var(--sl-color-border); border-radius: var(--sl-radius-card); }
  .sl-search-inline .sl-field { margin: 0; }
  .sl-search-inline .sl-search-word { flex: 1 1 240px; min-width: 180px; }
  .sl-search-inline .sl-search-mod  { flex: 0 0 auto; min-width: 176px; }
  /* form: pill */
  .sl-demo-form-pill .sl-search-inline { gap: 0; border-radius: 999px; padding: 4px 4px 4px 8px; background: var(--sl-color-bg); box-shadow: var(--sl-shadow-soft); }
  .sl-demo-form-pill .sl-search-inline .sl-field { border: 0; box-shadow: none; background: transparent; }
  .sl-demo-form-pill .sl-search-mod { border-right: 1px solid var(--sl-color-border) !important; max-width: 190px; border-radius: 0; }
  /* form: plain (no panel) */
  .sl-demo-form-plain .sl-search-inline { background: transparent; border: 0; padding: 0; }

  .sl-search-hint { font-size: 12.5px; color: var(--sl-color-text-muted); margin: 0 0 24px; padding-left: 2px; }
  .sl-search-hint b { color: var(--sl-color-text-heading); }

  /* ---- results: shared skeleton ---- */
  .sl-sr-list { display: flex; flex-direction: column; }
  .sl-sr-item { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--sl-color-border); }
  .sl-sr-item:last-child { border-bottom: 0; }
  .sl-sr-body { flex: 1 1 auto; min-width: 0; }
  .sl-sr-aside { flex: 0 0 auto; display: flex; align-items: flex-start; }
  /* icon tile (reuses .sl-card-image look) — hidden unless a variant asks for it */
  .sl-sr-tile { display: none; float: none; flex: 0 0 auto; margin: 2px 0 0; }
  .sl-sr-tile.sl-card-image { margin: 2px 0 0; }

  /* crumb: real .sl-category-nav, just tightened for a result row */
  .sl-sr-crumb.sl-category-nav { margin: 0 0 4px; gap: var(--sl-space-sm); font-size: 12.5px; }
  .sl-sr-crumb .sl-crumb { font-size: 12.5px; }

  .sl-sr-title { margin: 0 0 5px; font-size: 19px; font-weight: 500; line-height: 1.3; }
  .sl-sr-title a { color: var(--sl-color-brand-link); text-decoration: none; }
  .sl-sr-title a:hover { text-decoration: underline; }
  .sl-sr-title a:visited { color: var(--sl-color-accent); }
  .sl-sr-title mark, .sl-sr-snip mark { background: transparent; color: var(--sl-color-text-strong); font-weight: 700; }

  .sl-sr-snip { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: var(--sl-color-text-muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sl-sr-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

  /* ==================================================================
   * VARIANTS (result look) — driven by body.sl-demo-*
   * Each result carries .sl-cat-tone-N so --sl-cat-tone is available.
   * ================================================================= */

  /* 1. GOOGLE — flat, blue title, muted snippet */
  /* (base skeleton already is this) */

  /* 2. CARDS — tone-tinted card */
  .sl-demo-cards .sl-sr-list { gap: 14px; }
  .sl-demo-cards .sl-sr-item { padding: 16px 18px; border-bottom: 0; border-radius: var(--sl-radius-card);
    background: var(--sl-color-bg); border: 1px solid var(--sl-color-border);
    box-shadow: var(--sl-shadow-soft); transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease; }
  .sl-demo-cards .sl-sr-item:hover { box-shadow: var(--sl-shadow-strong); transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--sl-cat-tone) 45%, var(--sl-color-border)); }

  /* 3. ACCENT — left tone bar */
  .sl-demo-accent .sl-sr-list { gap: 10px; }
  .sl-demo-accent .sl-sr-item { padding: 12px 16px; border-bottom: 0; border-radius: var(--sl-radius-control);
    background: var(--sl-color-surface); border-left: 3px solid var(--sl-cat-tone); }

  /* 4. TILE — tone icon tile on the left */
  .sl-demo-tile .sl-sr-tile { display: grid; }
  .sl-demo-tile .sl-sr-item { padding: 14px 0; }

  /* 5. MAGAZINE — icon tile + soft tone panel */
  .sl-demo-magazine .sl-sr-list { gap: 12px; }
  .sl-demo-magazine .sl-sr-tile { display: grid; }
  .sl-demo-magazine .sl-sr-item { padding: 14px 16px; border-bottom: 0; border-radius: var(--sl-radius-card);
    background: color-mix(in srgb, var(--sl-cat-tone) 6%, var(--sl-color-bg));
    border: 1px solid color-mix(in srgb, var(--sl-cat-tone) 20%, var(--sl-color-border)); }

  /* 6. COMPACT — dense one-line snippet */
  .sl-demo-compact .sl-sr-item { padding: 9px 0; }
  .sl-demo-compact .sl-sr-title { font-size: 15.5px; margin-bottom: 1px; }
  .sl-demo-compact .sl-sr-crumb.sl-category-nav { margin-bottom: 1px; }
  .sl-demo-compact .sl-sr-snip { -webkit-line-clamp: 1; font-size: 13px; margin-bottom: 3px; }

  /* 7. DIVIDER — plain rows (skeleton) with a touch more air */
  .sl-demo-divider .sl-sr-item { padding: 18px 0; }

  /* 8. RAIL — left meta column */
  .sl-demo-rail .sl-sr-item { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 16px 0; }
  .sl-demo-rail .sl-sr-crumb.sl-category-nav { grid-column: 1; grid-row: 1 / span 3; flex-direction: column;
    align-items: flex-start; gap: 6px; margin: 0; }
  .sl-demo-rail .sl-sr-crumb .sl-crumb-sep { display: none; }
  .sl-demo-rail .sl-sr-body { display: contents; }
  .sl-demo-rail .sl-sr-title, .sl-demo-rail .sl-sr-snip, .sl-demo-rail .sl-sr-meta { grid-column: 2; }
  .sl-demo-rail .sl-sr-tile, .sl-demo-rail .sl-sr-aside { display: none; }

  /* 9. NUMBERED — big tone number */
  .sl-demo-numbered .sl-sr-list { counter-reset: sr; }
  .sl-demo-numbered .sl-sr-aside { display: none; }
  .sl-demo-numbered .sl-sr-item { counter-increment: sr; }
  .sl-demo-numbered .sl-sr-item::before { content: counter(sr); flex: 0 0 auto; align-self: flex-start;
    width: 34px; height: 34px; display: grid; place-items: center; font-size: 14px; font-weight: 700;
    color: var(--sl-cat-tone); background: color-mix(in srgb, var(--sl-cat-tone) 12%, #fff);
    border: 1px solid color-mix(in srgb, var(--sl-cat-tone) 26%, var(--sl-color-border)); border-radius: 999px; }

  /* 10. CHIPS-TOP — meta above the title */
  .sl-demo-chipstop .sl-sr-body { display: flex; flex-direction: column; }
  .sl-demo-chipstop .sl-sr-crumb { order: 1; }
  .sl-demo-chipstop .sl-sr-meta  { order: 2; margin: 2px 0 6px; }
  .sl-demo-chipstop .sl-sr-title { order: 3; }
  .sl-demo-chipstop .sl-sr-snip  { order: 4; }

  /* 11. MINIMAL — no chips, typographic */
  .sl-demo-minimal .sl-sr-meta, .sl-demo-minimal .sl-sr-aside { display: none; }
  .sl-demo-minimal .sl-sr-item { padding: 14px 0; }
  .sl-demo-minimal .sl-sr-snip { -webkit-line-clamp: 3; }

  /* 12. TINTED — full soft tone background row */
  .sl-demo-tinted .sl-sr-list { gap: 8px; }
  .sl-demo-tinted .sl-sr-item { padding: 14px 16px; border-bottom: 0; border-radius: var(--sl-radius-control);
    background: color-mix(in srgb, var(--sl-cat-tone) 9%, var(--sl-color-bg)); }

  @media (max-width: 560px) {
    .sl-demo-rail .sl-sr-item { grid-template-columns: 1fr; }
    .sl-demo-rail .sl-sr-crumb.sl-category-nav { grid-row: auto; flex-direction: row; }
    .sl-search-inline .sl-search-mod { flex: 1 1 100%; }
  }
</style>
</head>
<body class="sl-demo-google sl-demo-form-panel">

<div class="sl-demo-bar">
  <div class="sl-demo-bar-in">
    <div class="sl-demo-grp" id="grpForm">
      <span>Форма:</span>
      <button data-form="panel" class="is-on">в панели</button>
      <button data-form="pill">пилюля</button>
      <button data-form="plain">без панели</button>
    </div>
    <div class="sl-demo-grp" id="grpRes">
      <span>Результаты:</span>
      <button data-res="google" class="is-on">Google</button>
      <button data-res="cards">Карточки</button>
      <button data-res="accent">Акцент-бар</button>
      <button data-res="tile">Иконка-плитка</button>
      <button data-res="magazine">Журнал</button>
      <button data-res="tinted">Тон-фон</button>
      <button data-res="chipstop">Чипсы сверху</button>
      <button data-res="numbered">Нумерованный</button>
      <button data-res="rail">Лев. колонка</button>
      <button data-res="divider">Разделители</button>
      <button data-res="compact">Плотный</button>
      <button data-res="minimal">Минимал</button>
    </div>
  </div>
</div>

<div class="sl-demo-wrap">
  <p class="sl-demo-cur">Активно: форма <b id="curForm">в панели</b> · результаты <b id="curRes">Google</b></p>

  <!-- one-row form -->
  <form class="sl-search-inline" action="index.php?name=search" method="post" onsubmit="return false">
    <select name="mod" class="sl-field sl-search-mod">
      <option value="">Во всех отделах</option>
      <option value="news" selected>Новости</option>
      <option value="faq">Вопросы и ответы</option>
      <option value="forum">Форум</option>
      <option value="files">Каталог файлов</option>
      <option value="pages">Статьи</option>
    </select>
    <input type="text" name="word" class="sl-field sl-search-word" value="slaed" placeholder="Поиск" maxlength="100" required>
    <button type="submit" class="sl-but">Поиск</button>
  </form>
  <p class="sl-search-hint">Найдено <b>96</b> совпадений по запросу «<b>slaed</b>» · показаны 1–6</p>

  <div class="sl-sr-list" id="results"></div>

  <h4 class="sl-pager-info">Всего: <b>96</b> на <b>16</b> страницах по <b>6</b> на каждой странице</h4>
  <div class="sl-pager">
    <div class="sl-pager-main">
      <div class="sl-pager-pages">
        <span title="1" class="sl-but-mini sl-is-active">1</span>
        <a href="#" title="2" class="sl-but-mini">2</a>
        <a href="#" title="3" class="sl-but-mini">3</a>
        <a href="#" title="4" class="sl-but-mini">4</a>
        <a href="#" title="5" class="sl-but-mini">5</a>
        <span title="…" class="sl-but-mini sl-is-muted">…</span>
        <a href="#" title="16" class="sl-but-mini">16</a>
      </div>
      <div class="sl-pager-nextprev">
        <b class="sl-pager-prev"><span title="Назад" class="sl-but-mini sl-is-muted"><i class="bi bi-chevron-left" aria-hidden="true"></i></span></b>
        <b class="sl-pager-next"><a href="#" title="Вперед" class="sl-but-mini"><i class="bi bi-chevron-right" aria-hidden="true"></i></a></b>
      </div>
    </div>
  </div>
</div>

<script>
// tone: 0 info, 1 success, 2 warning, 3 accent, 4 primary, 5 danger
const R = [
  { id:1, mod:'Новости', modUrl:'index.php?name=news', cat:'Наши новости', catUrl:'index.php?name=news&cat=2',
    tone:1, icon:'house', title:'<mark>SLAED</mark> CMS 6.2 Pro — Система управления содержимым сайта',
    snip:'Вышла новая версия <mark>SLAED</mark> CMS 6.2 Pro: переработан модуль поиска, обновлён шаблонизатор lite, добавлена подсветка совпадений и портируемое кеширование ассетов. Обновление рекомендовано всем пользователям…',
    date:'28.04.2017', coms:12, reads:'30 145', author:'SLAED CMS' },
  { id:2, mod:'Вопросы и ответы', modUrl:'index.php?name=faq', cat:'Внедрения и изменения', catUrl:'index.php?name=faq&cat=40',
    tone:0, icon:'patch-question', title:'Что нужно учитывать при разработке модулей для новых версий <mark>SLAED</mark>?',
    snip:'При разработке модулей для <mark>SLAED</mark> CMS придерживайтесь границы шаблонов: PHP отдаёт данные и семантические флаги, а разметку и CSS-классы формирует шаблон. Все входные значения проходят через getVar()…',
    date:'06.03.2009', reads:'18 902', author:'SLAED CMS' },
  { id:3, mod:'Каталог файлов', modUrl:'index.php?name=files', cat:'Темы и графика', catUrl:'index.php?name=files&cat=6',
    tone:4, icon:'palette', title:'Адаптивный шаблон на фреймворке Pure для <mark>SLAED</mark>',
    snip:'Лёгкий адаптивный шаблон для <mark>SLAED</mark> на базе Pure.css: блоки слева и справа, мобильное меню, поддержка тёмной темы. Совместим с движком поиска и подсветкой результатов…',
    date:'20.03.2021', coms:3, reads:'8 402', author:'SLAED CMS' },
  { id:4, mod:'Форум', modUrl:'index.php?name=forum', cat:'Общие вопросы', catUrl:'index.php?name=forum&cat=5',
    tone:3, icon:'chat-square-text', title:'С какими форумами возможна интеграция <mark>SLAED</mark>?',
    snip:'Обсуждение вариантов интеграции стороннего форума со <mark>SLAED</mark> CMS: единая авторизация, общий поиск по темам и сообщениям, перенос пользователей. Приведены примеры настройки и готовые патчи…',
    date:'28.05.2007', coms:27, author:'admin' },
  { id:5, mod:'Статьи', modUrl:'index.php?name=pages', cat:'Учебники и инструкции', catUrl:'index.php?name=pages&cat=9',
    tone:2, icon:'book', title:'Установка и первичная настройка <mark>SLAED</mark> CMS',
    snip:'Пошаговое руководство: загрузка дистрибутива <mark>SLAED</mark>, создание базы данных, запуск установщика, настройка ЧПУ, кеша и прав доступа. Типичные ошибки и их решение…',
    date:'27.11.2016', coms:8, reads:'54 120', author:'SLAED CMS' },
  { id:6, mod:'Каталог сайтов', modUrl:'index.php?name=links', cat:'Партнёры', catUrl:'index.php?name=links&cat=3',
    tone:5, icon:'link-45deg', title:'Официальные ресурсы и зеркала проекта <mark>SLAED</mark>',
    snip:'Список официальных сайтов <mark>SLAED</mark>: форум поддержки, база знаний, репозиторий на GitHub, демо-стенды и партнёрские площадки. Все ссылки проверены модерацией…',
    date:'11.02.2019', reads:'6 730', author:'SLAED CMS' },
];

const chip = r => {
  let s = '';
  s += `<time datetime="" title="Дата публикации" class="sl-chip sl-chip-info sl-card-date"><i class="bi bi-calendar3" aria-hidden="true"></i> ${r.date}</time>`;
  s += `<a href="${r.catUrl}" title="${r.cat}" class="sl-chip sl-card-category"><i class="bi bi-folder" aria-hidden="true"></i> ${r.cat}</a>`;
  if (r.coms) s += `<a href="${r.modUrl}&op=view&id=${r.id}#comm" title="Комментарии" class="sl-chip sl-card-comment"><i class="bi bi-chat-text" aria-hidden="true"></i> ${r.coms}</a>`;
  if (r.reads) s += `<span title="Прочитано" class="sl-chip sl-card-reads"><i class="bi bi-eye" aria-hidden="true"></i> ${r.reads}</span>`;
  s += `<span class="sl-chip sl-chip-info sl-card-post"><a href="index.php?name=account&op=view&uname=${encodeURIComponent(r.author)}" title="Разместил" class="sl-author"><i class="bi bi-person" aria-hidden="true"></i> ${r.author}</a></span>`;
  return s;
};

const item = r => `
  <article class="sl-sr-item sl-cat-tone-${r.tone}">
    <a class="sl-sr-tile sl-card-image sl-cat-tone-${r.tone}" href="${r.catUrl}" title="${r.cat}"><i class="bi bi-${r.icon}" aria-hidden="true"></i></a>
    <div class="sl-sr-body">
      <nav class="sl-category-nav sl-sr-crumb" aria-label="Категория">
        <a class="sl-crumb sl-cat-tone-0" href="${r.modUrl}" title="${r.mod}">${r.mod}</a>
        <span class="sl-crumb-sep">»</span>
        <a class="sl-crumb sl-cat-tone-${r.tone}" href="${r.catUrl}" title="${r.cat}">${r.cat}</a>
      </nav>
      <h4 class="sl-sr-title"><a href="${r.modUrl}&op=view&id=${r.id}">${r.title}</a></h4>
      <p class="sl-sr-snip">${r.snip}</p>
      <div class="sl-sr-meta">${chip(r)}</div>
    </div>
    <div class="sl-sr-aside"><a href="#${r.id}" class="sl-but-mini" title="${r.id}">${r.id}</a></div>
  </article>`;

document.getElementById('results').innerHTML = R.map(item).join('');

const RES = { google:'Google', cards:'Карточки', accent:'Акцент-бар', tile:'Иконка-плитка', magazine:'Журнал',
  tinted:'Тон-фон', chipstop:'Чипсы сверху', numbered:'Нумерованный', rail:'Левая колонка', divider:'Разделители',
  compact:'Плотный', minimal:'Минимал' };
const FORMS = { panel:'в панели', pill:'пилюля', plain:'без панели' };

function apply(prefix, val, names, grp, curId, key) {
  Object.keys(names).forEach(v => document.body.classList.remove(prefix + v));
  document.body.classList.add(prefix + val);
  grp.querySelectorAll('button').forEach(b => b.classList.toggle('is-on', b.dataset[key] === val));
  document.getElementById(curId).textContent = names[val];
}
const grpForm = document.getElementById('grpForm'), grpRes = document.getElementById('grpRes');
grpForm.addEventListener('click', e => { const b = e.target.closest('button'); if (b) apply('sl-demo-form-', b.dataset.form, FORMS, grpForm, 'curForm', 'form'); });
grpRes.addEventListener('click',  e => { const b = e.target.closest('button'); if (b) apply('sl-demo-', b.dataset.res, RES, grpRes, 'curRes', 'res'); });
</script>
</body>
</html>
