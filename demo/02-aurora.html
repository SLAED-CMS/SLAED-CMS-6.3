<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 · Аврора — стенд полос SLAED</title>
  <link rel="stylesheet" href="../templates/lite/assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/base.css">
  <link rel="stylesheet" href="../templates/lite/assets/css/theme.css">
  <link rel="stylesheet" href="assets/demo.css">
  <style>
    /* 02 — Aurora. Two curtains of colour drift over the photo, one turning left and one right, 24 and 31 seconds
       a lap, so the pair never repeats the same picture twice in a session. The curtains hold their own strength
       and never read the dial — which is what was broken in the first cut, where the dial at zero switched the
       whole effect off. Overlay for the lower curtain and screen for the upper: both blends answer the ground
       they land on, so the aurora shows over a pale summer photo as well as over a dark winter one. */

    /* Both bands become a stacking context: effects go under the text, never over it */
    #head-content,
    #demo-line {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    #head-content > .sl-wrp,
    #demo-line > .sl-wrp {
      position: relative;
      z-index: 5;
    }

    /* The dial, and the only thing it touches. --demo-dim darkens the photo and nothing else: it runs in the
       dark mode alone, because multiplying by white is a no-op, and at 0 the band is exactly what ships today.
       The effect below never reads the dial, so it lives at every position of it and in both modes. */
    body[class] #head-content,
    body[class] #demo-line {
      background-color: light-dark(#ffffff, color-mix(in srgb, #14293a calc(var(--demo-dim, 0) * 100%), #ffffff));
      background-blend-mode: multiply;
    }

    /* Curtain one: the wide, slow one. Overlay deepens it over a light photo and lifts it over a dark one */
    #head-content::before,
    #demo-line::before {
      content: "";
      position: absolute;
      inset: -160% -20%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.85;
      filter: blur(38px);
      mix-blend-mode: overlay;
      background:
        radial-gradient(38% 60% at 18% 50%, rgba(56, 169, 222, 0.95) 0%, transparent 70%),
        radial-gradient(30% 55% at 47% 42%, rgba(70, 201, 93, 0.75) 0%, transparent 72%),
        radial-gradient(42% 65% at 78% 55%, rgba(179, 112, 207, 0.8) 0%, transparent 74%);
      animation: demo-aurora-a 24s linear infinite;
    }

    /* Curtain two: narrower, faster in feel, going the other way; screen keeps it reading as light and not paint */
    #head-content::after,
    #demo-line::after {
      content: "";
      position: absolute;
      inset: -160% -20%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.5;
      filter: blur(46px);
      mix-blend-mode: screen;
      background:
        radial-gradient(46% 70% at 30% 45%, rgba(28, 110, 158, 0.8) 0%, transparent 72%),
        radial-gradient(36% 60% at 66% 60%, rgba(76, 178, 240, 0.65) 0%, transparent 70%);
      animation: demo-aurora-b 31s linear infinite;
    }

    @keyframes demo-aurora-a {
      0% {
        transform: translate3d(-8%, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(8%, 2%, 0) scale(1.12);
      }
      100% {
        transform: translate3d(-8%, 0, 0) scale(1);
      }
    }

    @keyframes demo-aurora-b {
      0% {
        transform: translate3d(9%, 1%, 0) scale(1.08);
      }
      50% {
        transform: translate3d(-9%, -2%, 0) scale(1);
      }
      100% {
        transform: translate3d(9%, 1%, 0) scale(1.08);
      }
    }

    /* Motion off: the curtains hold their opening pose, which is a finished picture on its own */
    @media (prefers-reduced-motion: reduce) {
      #head-content::before,
      #demo-line::before,
      #head-content::after,
      #demo-line::after {
        animation: none;
      }
    }
  </style>
</head>
<body class="sl-summer">
  <noscript><p style="padding:24px">Стенду нужен JavaScript: разметку страницы собирает <code>assets/demo.js</code>.</p></noscript>
  <script src="assets/demo.js"></script>
</body>
</html>
